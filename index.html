<div id="start"><div class="card"><h1>DARK REALM</h1><div style="color:#b9a47c">THE OLD TOWN</div><p>به شهر قدیمی خوش آمدی.<br>در کوچه‌ها بگرد، با مردم شهر حرف بزن و رازهای این سرزمین را کشف کن.</p><button id="play">شروع ماجراجویی</button><p>نسخه آزمایشی آفلاین</p></div></div>
<script>

{x:1100,y:690,name:'مامان ادریس',msg:'من همیشه مراقب شهر هستم. به میدان مرکزی سر بزن؛ آنجا معمولاً آدم‌های زیادی پیدا می‌کنی.',color:'#9b5968',route:[[1100,690],[1120,790],[970,790],[1030,760]]},
{x:820,y:980,name:'ویچر',msg:'سلام مسافر! هرچی بخوای شاید توی مغازه پیدا بشه، البته قیمت‌ها رو خودم تعیین میکنم!',color:'#536c49',route:[[820,980],[760,980],[650,900],[760,850],[900,900]]},
{x:1430,y:1000,name:'زئوس',msg:'دنبال معامله‌ای؟ من آدم مناسبی برای هر کاری هستم... البته پولت رو اول نشون بده.',color:'#80649b',route:[[1430,1000],[1510,950],[1550,850],[1450,800],[1400,900]]},
{x:1100,y:1200,name:'تانجیرو',msg:'نگران نباش! تا وقتی من اینجام، اجازه نمیدم کسی به شهر آسیب بزنه.',color:'#365c75',route:[[1100,1200],[1180,1100],[1250,1000],[1180,1050],[1100,1100]]},
{x:900,y:700,name:'یاشار',msg:'من فقط یه شهروند عادی هستم... چیزی ندیدی، چیزی نشنیدی.',color:'#333b49',route:[[900,700],[850,750],[800,800],[900,850],[950,750]]},
{x:1600,y:850,name:'اراد',msg:'سلام مسافر. من ارادم؛ این شهر پر از رازهای پنهانه. همیشه چشم‌هات رو باز نگه دار.',color:'#242735',route:[[1600,850],[1650,900],[1700,950],[1600,1000],[1550,900]]},
{x:2050,y:1740,name:'ممد اسموک',msg:'سلام رفیق. مدتیه دارم تلاش می‌کنم عادت بدی رو کنار بذارم و اوضاعمو بهتر کنم.',color:'#292b32',route:[[2050,1740],[2110,1770],[2180,1740],[2200,1820],[2130,1860],[2050,1810]]}];
const buildingZones=buildings.map(b=>({x:b.x+8,y:b.y+20,w:b.w-16,h:b.h-20}));
const trees=[];
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function circleRect(x,y,r,o){const px=Math.max(o.x,Math.min(x,o.x+o.w)),py=Math.max(o.y,Math.min(y,o.y+o.h));return Math.hypot(x-px,y-py)<r}
for(let i=0;i<85;i++){for(let a=0;a<45;a++){const x=35+Math.random()*(world.w-70),y=35+Math.random()*(world.h-70),s=16+Math.random()*11,box={x:x-s,y:y-s,w:s*2,h:s*2};if(buildingZones.some(b=>overlap(box,b))||roads.some(r=>overlap(box,r))||Math.hypot(x-1100,y-900)<155||Math.hypot(x-player.x,y-player.y)<120||npcs.some(n=>Math.hypot(x-n.x,y-n.y)<85)||trees.some(t=>Math.hypot(x-t.x,y-t.y)<t.s+s+10))continue;trees.push({x,y,s});break}}
const obstacles=[...buildingZones,...trees.map(t=>({x:t.x-t.s*.55,y:t.y-t.s*.5,w:t.s*1.1,h:t.s*1.1}))];
function blocked(x,y,r=12,ignore=null){if(x-r<0||y-r<0||x+r>world.w||y+r>world.h)return true;for(const o of obstacles)if(circleRect(x,y,r,o))return true;if(Math.hypot(x-fountain.x,y-fountain.y)<fountain.r+r-3)return true;for(const n of npcs)if(n!==ignore&&Math.hypot(x-n.x,y-n.y)<r+12)return true;return false}
let keys={},joy={x:0,y:0},running=false,near=null;
const valid=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(valid.includes(k)){e.preventDefault();keys[k]=true}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{keys={};joy.x=joy.y=0;running=false});
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let dragging=false;
function joyMove(e){const r=stick.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),m=34;if(d>m){dx=dx/d*m;dy=dy/d*m}joy.x=dx/m;joy.y=dy/m;let c=(stick.clientWidth-46)/2;nub.style.left=(c+dx)+'px';nub.style.top=(c+dy)+'px'}
function joyStop(){dragging=false;joy.x=joy.y=0;let c=(stick.clientWidth-46)/2;nub.style.left=c+'px';nub.style.top=c+'px'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;stick.setPointerCapture(e.pointerId);joyMove(e)});stick.addEventListener('pointermove',e=>{if(dragging)joyMove(e)});stick.addEventListener('pointerup',joyStop);stick.addEventListener('pointercancel',joyStop);stick.addEventListener('lostpointercapture',joyStop);
const runBtn=document.getElementById('run');runBtn.addEventListener('pointerdown',e=>{e.preventDefault();running=true;runBtn.setPointerCapture(e.pointerId);runBtn.style.background='#a0804b'});function stopRun(){running=false;runBtn.style.background='#70552f'}runBtn.addEventListener('pointerup',stopRun);runBtn.addEventListener('pointercancel',stopRun);runBtn.addEventListener('lostpointercapture',stopRun);
const settingsPanel=document.getElementById('settingsPanel');document.getElementById('settingsBtn').onclick=()=>settingsPanel.style.display=settingsPanel.style.display==='block'?'none':'block';document.getElementById('closeSettings').onclick=()=>settingsPanel.style.display='none';
let audioCtx=null,master=null,soundEnabled=true;
function initAudio(){try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();master=audioCtx.createGain();master.gain.value=Number(document.getElementById('volume').value)/100;master.connect(audioCtx.destination);const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.value=78;g.gain.value=.012;osc.connect(g);g.connect(master);osc.start()}else if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function setVolume(){if(master&&audioCtx)master.gain.setTargetAtTime(soundEnabled?Number(document.getElementById('volume').value)/100:0,audioCtx.currentTime,.06)}
document.getElementById('volume').addEventListener('input',setVolume);document.getElementById('soundBtn').onclick=()=>{soundEnabled=!soundEnabled;setVolume();document.getElementById('soundBtn').textContent=soundEnabled?'🔊 قطع صدا':'🔇 فعال کردن صدا'};
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';initAudio()};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x-camX,y-camY,w,h)}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x-camX,y-camY,r,0,Math.PI*2);ctx.fill()}
function drawGround(){rect(0,0,world.w,world.h,'#29382f');const sx=Math.max(0,Math.floor(camX/120)*120),sy=Math.max(0,Math.floor(camY/120)*120);for(let y=sy;y<camY+H+120;y+=120)for(let x=sx;x<camX+W+120;x+=120)if((x/120+y/120)%2===0)rect(x,y,120,120,'#2d3d32');
for(const r of roads)rect(r.x-3,r.y-3,r.w+6,r.h+6,'#403a32');
for(const r of roads)rect(r.x,r.y,r.w,r.h,'#655747');
ctx.save();ctx.beginPath();for(const r of roads)ctx.rect(r.x-camX,r.y-camY,r.w,r.h);ctx.clip();
const tw=48,th=40,tx0=Math.floor(camX/tw)*tw,ty0=Math.floor(camY/th)*th;
for(let y=ty0;y<camY+H+th;y+=th)for(let x=tx0;x<camX+W+tw;x+=tw){let a=Math.floor(x/tw),b=Math.floor(y/th);ctx.fillStyle=(a+b)%2?'#71624f':'#796a57';ctx.fillRect(x-camX+1,y-camY+1,tw-2,th-2)}
ctx.restore();circle(1100,900,104,'#443d32');circle(1100,900,98,'#8a7962');circle(1100,900,88,'#675a49');circle(1100,900,80,'#796a57');ctx.strokeStyle='#a18b6d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(1100-camX,900-camY,92,0,Math.PI*2);ctx.stroke()}
function drawTree(t){circle(t.x+5,t.y+12,t.s,'#17241c');rect(t.x-4,t.y-3,8,22,'#5a402d');circle(t.x,t.y-13,t.s,'#1b3022');circle(t.x-9,t.y-21,t.s*.65,'#29452e');circle(t.x+9,t.y-21,t.s*.65,'#314d35');circle(t.x,t.y-31,t.s*.5,'#3a5a3d')}
function drawBuilding(b){rect(b.x+9,b.y+12,b.w,b.h,'#171b1c');rect(b.x,b.y,b.w,b.h,'#665548');for(let i=0;i<5;i++)rect(b.x+8,b.y+30+i*27,b.w-16,2,'#81705d');rect(b.x-12,b.y-20,b.w+24,38,'#392a28');rect(b.x+25,b.y+55,35,45,'#b08c54');rect(b.x+b.w-60,b.y+55,35,45,'#b08c54');rect(b.x+b.w/2-17,b.y+b.h-60,34,60,'#4a3023');if(b.chimney){rect(b.x+b.w-48,b.y-32,25,40,'#59463a');rect(b.x+b.w-53,b.y-36,35,9,'#392b26')}ctx.fillStyle='#d3c1a0';ctx.font='11px Tahoma';ctx.textAlign='center';ctx.fillText(b.name,b.x+b.w/2-camX,b.y-30-camY)}
function drawFountain(){let x=1100-camX,y=900-camY;ctx.save();ctx.translate(x,y);for(const [r,c] of [[65,'#252b27'],[61,'#4d5147'],[55,'#a18d6e'],[49,'#77705b'],[43,'#3c6264']]){ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#c0ad8b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,55,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#8da5a0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,44,0,Math.PI*2);ctx.stroke();for(let i=0;i<4;i++){ctx.save();ctx.rotate(i*Math.PI/2);ctx.fillStyle='#d0bc95';ctx.fillRect(-4,-42,8,7);ctx.strokeStyle='#b5d5d0';ctx.beginPath();ctx.moveTo(0,-31);ctx.quadraticCurveTo(7,-23,0,-16);ctx.stroke();ctx.restore()}ctx.fillStyle='#b49d77';ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d5e9df';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawActor(n,isPlayer=false){const x=n.x,y=n.y,w=isPlayer&&n.moving?Math.sin(n.frame)*3:0;circle(x,y+12,11,'#111');rect(x-7+w,y+13,5,11,'#292d35');rect(x+2-w,y+13,5,11,'#292d35');if(isPlayer){rect(x-10,y-3,20,24,'#334b68');circle(x,y-11,10,'#d3a17d');rect(x-10,y-20,20,6,'#30241f')}else{circle(x,y,9,'#b98c69');rect(x-8,y+8,16,20,n.color);rect(x-13,y+10,4,12,'#c49a78');rect(x+9,y+10,4,12,'#c49a78');ctx.fillStyle='#f3dca5';ctx.font='12px Tahoma';ctx.textAlign='center';ctx.fillText(n.name,x-camX,y-28-camY);if(Math.hypot(player.x-x,player.y-y)<85){ctx.fillStyle='white';ctx.fillText('تعامل',x-camX,y-43-camY)}}}
function moveNPC(n,dt){if(n.pause>0){n.pause-=dt;return}if(n.target===undefined)n.target=0;let p=n.route[n.target],dx=p[0]-n.x,dy=p[1]-n.y,d=Math.hypot(dx,dy);if(d<10){n.target=(n.target+1)%n.route.length;n.pause=28;return}let step=Math.min(d,.34*dt),nx=n.x+dx/d*step,ny=n.y+dy/d*step;if(!blocked(nx,n.y,10,n))n.x=nx;if(!blocked(n.x,ny,10,n))n.y=ny}
function clock(){let m=(480+gameTime*6)%1440,h=Math.floor(m/60),mi=Math.floor(m%60);return{h,text:String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}}
function drawLighting(){const h=clock().h,night=h<6||h>=19;if(!night)return;ctx.fillStyle='rgba(9,18,38,.36)';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,190,90,.07)';for(const b of buildings){let x=b.x+42-camX,y=b.y+75-camY;if(x>-100&&x<W+100&&y>-100&&y<H+100)ctx.fillRect(x-25,y-20,50,40)}}
function updateCamera(){let tx=player.x-W/2,ty=player.y-H/2;camX+=(tx-camX)*.16;camY+=(ty-camY)*.16;camX=Math.max(0,Math.min(world.w-W,camX));camY=Math.max(0,Math.min(world.h-H,camY))}
function update(dt){if(!started)return;gameTime+=dt;let dx=joy.x,dy=joy.y;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}player.moving=l>.1;if(player.moving){let sp=(running?4.5:2.5)*dt;player.frame+=dt*.17;if(Math.abs(dx)>Math.abs(dy))player.direction=dx>0?'right':'left';else player.direction=dy>0?'down':'up';let nx=player.x+dx*sp,ny=player.y+dy*sp;if(!blocked(nx,player.y,player.r))player.x=nx;if(!blocked(player.x,ny,player.r))player.y=ny}player.x=Math.max(20,Math.min(world.w-20,player.x));player.y=Math.max(20,Math.min(world.h-20,player.y));updateCamera();if(Math.floor(gameTime*30)%2===0)npcs.forEach(n=>moveNPC(n,dt*2));near=null;let best=75;for(const n of npcs){let d=Math.hypot(player.x-n.x,player.y-n.y);if(d<best){best=d;near=n}}}
const dialog=document.getElementById('dialog');let dialogTimer;function interact(){if(!started)return;document.getElementById('who').textContent=near?near.name:'شهر قدیمی';document.getElementById('words').textContent=near?near.msg:'کسی نزدیکت نیست. کمی به مردم شهر نزدیک‌تر شو.';dialog.style.display='block';clearTimeout(dialogTimer);dialogTimer=setTimeout(()=>dialog.style.display='none',6000)}document.getElementById('talk').addEventListener('click',interact);
function visible(x,y,p=100){return x>camX-p&&x<camX+W+p&&y>camY-p&&y<camY+H+p}
function draw(){drawGround();for(const t of trees)if(visible(t.x,t.y,55))drawTree(t);for(const b of buildings)if(visible(b.x+b.w/2,b.y+b.h/2,180))drawBuilding(b);drawFountain();drawLighting();let actors=npcs.map(n=>({y:n.y,n,player:false}));actors.push({y:player.y,n:player,player:true});actors.sort((a,b)=>a.y-b.y);for(const a of actors)drawActor(a.n,a.player);let c=clock(),phase=c.h<8?'🌅 صبح':c.h<17?'☀️ روز':c.h<20?'🌇 غروب':'🌙 شب';document.getElementById('stats').innerHTML='❤️ 100<br>🪙 25<br>'+phase+'<br>🕐 '+c.text}
function loop(now){let dt=Math.min(1.8,(now-lastTime)/16.67);lastTime=now;update(dt);if(started)draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
