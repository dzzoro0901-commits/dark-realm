const trees=[];
function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function safeTree(x,y,s){
 const box={x:x-s,y:y-s,w:s*2,h:s*2};
 if(buildingZones.some(b=>overlaps(box,b))||roads.some(r=>overlaps(box,r))||overlaps(box,fountainZone)||regions.some(r=>overlaps(box,r)))return false;
 if(npcs.some(n=>Math.hypot(x-n.x,y-n.y)<100))return false;
 return true
}
for(let i=0;i<65;i++)for(let a=0;a<80;a++){let x=40+Math.random()*2720,y=40+Math.random()*2220,s=18+Math.random()*14;if(safeTree(x,y,s)){trees.push({x,y,size:s});break}}

buildings.forEach(b=>obstacles.push({x:b.x+8,y:b.y+20,w:b.w-16,h:b.h-20}));

function regionAt(x,y){return regions.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)||null}

function handleAction(a){
 if(!a)return;if(a==='close'){closeMenu();return}
 if(a==='save'){saveGame();notify('ذخیره شد','پیشرفت بازی ذخیره شد.');return}
 if(a==='redeem'){
  const input=document.getElementById('giftInput'),code=input?input.value.trim().toUpperCase():'';
  if(code!=='MAX'){notify('کد نامعتبر','این کد معتبر نیست.');return}
  if(game.giftUsed){notify('کد تکراری','قبلاً از این کد استفاده کرده‌ای.');return}
  game.coins+=1000;game.giftUsed=true;saveGame();notify('🎉 جایزه دریافت شد','۱۰۰۰ سکه به کیف پولت اضافه شد.');return;
 }
 if(a==='storageTakeMenu'){showStorageTake();return}
 if(a.startsWith('equip:')){equipWeapon(a.slice(6));return}
 if(a.startsWith('magicselect:')){
  const type=a.slice(12);if(!game.magicUnlocked[type]){notify('جادو قفل است','ابتدا این مهارت را آزاد کن.');return}
  game.selectedMagic=type;saveGame();notify('جادو انتخاب شد','جادوی انتخاب‌شده تغییر کرد.');return;
 }
 if(a==='magicupgrade'){
  const cost=game.level*90;
  if(game.coins<cost){notify('سکه کافی نیست','برای ارتقا '+cost+' سکه لازم داری.');return}
  const available=['fireball','ice','lightning'].find(k=>game.magicUnlocked[k]&&(game.magicLevels[k]||1)<game.level+1);
  if(!available){
   if(game.level>=3&&!game.magicUnlocked.ice)game.magicUnlocked.ice=true;
   else if(game.level>=5&&!game.magicUnlocked.lightning)game.magicUnlocked.lightning=true;
   else{notify('فعلاً ارتقایی نداری','با بالا رفتن سطح شخصیت، جادوهای بیشتری آزاد می‌شوند.');return}
   game.coins-=cost;saveGame();showMagic();return;
  }
  game.coins-=cost;game.magicLevels[available]=(game.magicLevels[available]||1)+1;saveGame();showMagic();return;
 }
 if(a.startsWith('deposit:')){
  if(!game.ownedHouse||!buildingInterior.active||currentBuilding()?.id!==game.ownedHouse){notify('صندوق شخصی','صندوق فقط در خانه خودت قابل استفاده است.');return}
  let n=a.slice(8);if((game.inventory[n]||0)<1){notify('وسیله‌ای نداری','از این وسیله در کیف تو وجود ندارد.');return}
  game.inventory[n]--;game.storage[n]=(game.storage[n]||0)+1;saveGame();showStorage();return;
 }
 if(a.startsWith('withdraw:')){
  let n=a.slice(9);if((game.storage[n]||0)<1){notify('صندوق خالی است','از این وسیله در صندوق وجود ندارد.');return}
  game.storage[n]--;game.inventory[n]=(game.inventory[n]||0)+1;saveGame();showStorageTake();return;
 }
 if(a.startsWith('enter:')){let b=buildings.find(x=>x.id===a.slice(6));if(b)enterBuilding(b);return}
 if(a.startsWith('unlock:')){
  let id=a.slice(7),b=buildings.find(x=>x.id===id);
  if(!b||!b.locked){closeMenu();return}
  if(game.keys<1){notify('کلید نداری','از بازارچه یک کلید بخر.');return}
  game.keys--;game.unlockedHouses.push(id);saveGame();notify('🔓 خانه باز شد','قفل خانه باز شد. حالا می‌توانی وارد شوی.');return;
 }
 if(a==='key'){
  if(game.coins<60){notify('سکه کافی نیست','برای خرید کلید ۶۰ سکه لازم داری.');return}
  game.coins-=60;game.keys++;saveGame();notify('🗝 کلید خریدی','یک کلید به کیف تو اضافه شد.');return;
 }
 if(a==='returncity'){dungeon.inside=false;clearCombatProjectiles();player.x=2550;player.y=890;closeMenu();saveGame();return}
 if(a.startsWith('travel:')){
  const i=Number(a.split(':')[1]),r=regions[i];if(!r)return;
  player.x=r.x+140;player.y=r.y+150;clearCombatProjectiles();
  if(!game.discovered.includes(r.id)){game.discovered.push(r.id);game.xp+=20;notify('🌟 منطقه کشف شد','به '+r.name+' رسیدی! ۲۰ تجربه گرفتی.');levelCheck()}else closeMenu();
  saveGame();return;
 }
 if(a==='reload'){
  if(game.coins<30){notify('سکه کافی نیست','برای پر کردن خشاب ۳۰ سکه لازم داری.');return}
  game.coins-=30;game.ammo=game.maxAmmo;saveGame();notify('خشاب پر شد','مهماتت کامل شد.');return;
 }
 if(a==='potion'){
  if(game.inventory['معجون']<1){notify('معجون نداری','از بازارچه معجون بخر.');return}
  if(game.health>=game.maxHealth){notify('سلامتی کامل است','فعلاً نیازی نداری.');return}
  game.inventory['معجون']--;game.health=Math.min(game.maxHealth,game.health+35);saveGame();notify('معجون مصرف شد','سلامتی‌ات بازیابی شد.');return;
 }
 if(a.startsWith('chat:')||a.startsWith('gift:')||a.startsWith('npcjob:')){
  let p=a.split(':'),n=findNPC(p[1]);if(!n)return;
  if(p[0]==='chat'){n.friend=Math.min(10,n.friend+1);game.reputation++;n.mood='خوشحال';saveGame();notify('گفت‌وگوی دوستانه',n.name+' از صحبت با تو خوشحال شد.')}

  nearInteriorExit=Math.hypot(x-(interiorRoom.x+interiorRoom.w/2),y-(interiorRoom.y+interiorRoom.h-35))<65;
  if(b&&b.type==='home'&&b.id===game.ownedHouse){
   nearInteriorChest=Math.hypot(x-(interiorRoom.x+87),y-(interiorRoom.y+278))<75;
   nearInteriorBed=Math.hypot(x-(interiorRoom.x+490),y-(interiorRoom.y+260))<75;
  }
  if(b&&['bakery','inn','blacksmith','market','armory'].includes(b.type))nearInteriorMerchant=Math.hypot(x-(interiorRoom.x+interiorRoom.w/2),y-(interiorRoom.y+125))<90;
 }else if(dungeon.inside){
  nearDungeonExit=Math.hypot(player.x-(dungeon.x+35),player.y-(dungeon.y+165))<65;
 }else{
  let best=85;for(const n of npcs){let d=Math.hypot(player.x-n.x,player.y-n.y);if(d<best){best=d;near=n}}
  let bestB=125;for(const b of buildings){let bx=Math.max(b.x,Math.min(player.x,b.x+b.w)),by=Math.max(b.y,Math.min(player.y,b.y+b.h)),d=Math.hypot(player.x-bx,player.y-by);if(d<bestB){bestB=d;nearBuilding=b}}
  let bp=90;for(const p of portals){let d=Math.hypot(player.x-p.x,player.y-p.y);if(d<bp){bp=d;nearPortal=p}}
  nearDungeon=Math.hypot(player.x-(dungeon.x+130),player.y-(dungeon.y+190))<100;
  nearCastle=Math.hypot(player.x-4700,player.y-1900)<145;
  if(nearPortal){near=null;nearBuilding=null;nearDungeon=false}
  else if(near&&nearBuilding){let dn=Math.hypot(player.x-near.x,player.y-near.y),bx=Math.max(nearBuilding.x,Math.min(player.x,nearBuilding.x+nearBuilding.w)),by=Math.max(nearBuilding.y,Math.min(player.y,nearBuilding.y+nearBuilding.h));if(Math.hypot(player.x-bx,player.y-by)<dn)near=null;else nearBuilding=null}
 }
}
function getClock(){let m=(360+(gameTime/240)*1440)%1440,h=Math.floor(m/60),mi=Math.floor(m%60);return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(buildingInterior.active){rect(camX,camY,W,H,'#211b17');drawInterior()}
 else if(dungeon.inside){
  rect(camX,camY,W,H,'#211c29');
  for(let i=0;i<18;i++){let x=dungeon.x+(i*73)%dungeon.w,y=dungeon.y+(i*51)%dungeon.h;circle(x,y,8,'#494052')}
  drawDungeon();
  rect(dungeon.x+12,dungeon.y+145,42,48,'#33241d');rect(dungeon.x+18,dungeon.y+151,30,40,'#a47a48');
  ctx.fillStyle='#f4d79c';ctx.font='11px Tahoma';ctx.textAlign='center';ctx.fillText('خروج',dungeon.x+33-camX,dungeon.y+137-camY);
 }else{
  drawGround();drawCityWall();drawRegionWalls();trees.forEach(drawTree);buildings.forEach(drawBuilding);drawCastle();drawDungeon();
 }
 if(!buildingInterior.active)npcs.forEach(drawNPC);
 if(!buildingInterior.active){enemies.forEach(drawEnemy);if(dungeon.inside)dungeonEnemies.forEach(drawEnemy)}
 if(!buildingInterior.active&&!dungeon.inside)drawPortals();
 drawGuards();
 projectiles.forEach(p=>{circle(p.x,p.y,5,'#b9edff');circle(p.x,p.y,2,'#fff')});
 magicProjectiles.forEach(p=>{circle(p.x,p.y,p.type==='lightning'?8:7,p.type==='fireball'?'#ff9b42':p.type==='ice'?'#8eeaff':'#e4d6ff');circle(p.x,p.y,3,'#fff')});
 enemyProjectiles.forEach(p=>{circle(p.x,p.y,7,p.color||'#b58bdb');circle(p.x,p.y,3,'#fff')});
 if(dungeon.inside&&!game.dungeonChest){rect(dungeon.x+190,dungeon.y+125,34,28,'#a87935');rect(dungeon.x+190,dungeon.y+125,34,7,'#e0b95c')}
 drawPlayer();drawLighting();drawWeather();if(!dungeon.inside&&!buildingInterior.active)drawMinimap();
 const r=regionAt(player.x,player.y);
 const place=buildingInterior.active?(currentBuilding()?.name||'ساختمان'):dungeon.inside?'سیاه‌چال':r?r.name:'شهر قدیمی';
 document.getElementById('stats').innerHTML='❤️ '+game.health+'/'+game.maxHealth+'<br>🪙 '+game.coins+'<br>✨ سطح '+game.level+' | XP '+game.xp+'<br>⚔️ '+({sword:'شمشیر',shotgun:'شاتگان',ak:'AK-47',none:'بدون سلاح'}[game.equippedWeapon]||'شمشیر')+'<br>🔫 '+game.ammo+'/'+game.maxAmmo+'<br>🔮 '+Math.floor(game.mana)+'/'+game.maxMana+'<br>📍 '+place+'<br>🕒 '+getClock()+'<br>🌦 '+({clear:'صاف',rain:'بارانی',fog:'مه‌آلود',snow:'برفی'}[weather]);
 const hint=document.getElementById('hint');
 if(buildingInterior.active){
  if(nearInteriorExit)hint.textContent='برای خروج از ساختمان تعامل کن';
  else if(nearInteriorChest)hint.textContent='صندوق شخصی؛ برای مدیریت وسایل تعامل کن';
  else if(nearInteriorBed)hint.textContent='برای خوابیدن و بازیابی سلامتی تعامل کن';
  else if(nearInteriorMerchant)hint.textContent='برای خریدوفروش با فروشنده تعامل کن';
  else hint.textContent='داخل ساختمان را بگرد؛ در خروجی پایین اتاق است';
 }else if(dungeon.inside){
  if(nearDungeonExit)hint.textContent='برای خروج از سیاه‌چال تعامل کن';
  else if(!game.dungeonChest&&Math.hypot(player.x-(dungeon.x+205),player.y-(dungeon.y+140))<65)hint.textContent='صندوق گنج؛ برای باز کردن تعامل کن';
  else hint.textContent='سیاه‌چال را پاک‌سازی کن؛ خروج همیشه در دسترس است';
 }else if(nearPortal)hint.textContent='برای سفر با دروازه تعامل کن';
 else if(nearDungeon)hint.textContent='ورودی سیاه‌چال؛ برای ورود تعامل کن';
 else if(nearCastle)hint.textContent='برای مدیریت قلعه تعامل کن';
 else if(near)hint.textContent='برای صحبت با '+near.name+' تعامل کن';
 else if(nearBuilding)hint.textContent='برای ورود به '+nearBuilding.name+' تعامل کن';
 else if(r)hint.textContent='منطقه: '+r.name+' | دشمن‌ها را پیدا کن و شکست بده';
 else hint.textContent='شهر را بگرد، تجارت کن یا از دروازه جهان عبور کن';
 if(performance.now()<respawnMessageUntil)hint.textContent='به نقطه امن برگشتی؛ سلامتی به ۵۰ رسید.';
}
let last=performance.now(),saveTimer=0;
function loop(now){let dt=Math.min(2,(now-last)/16.67);last=now;update(dt);draw();saveTimer+=dt;if(saveTimer>600){saveGame();saveTimer=0}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
