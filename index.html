<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DARK REALM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#101710;
 font-family:Tahoma;
 touch-action:none;
 color:white
}
canvas{
 width:100vw;
 height:100vh;
 display:block;
 image-rendering:pixelated
}
#ui{
 position:fixed;
 inset:0;
 pointer-events:none
}
.panel{
 background:rgba(13,19,27,.88);
 border:1px solid #81734f;
 border-radius:12px;
 padding:10px
}
#top{
 position:absolute;
 top:12px;
 left:12px;
 right:12px;
 display:flex;
 justify-content:space-between
}
#title{
 color:#d9bd84;
 font-weight:bold;
 font-size:17px
}
#stats{
 font-size:12px;
 line-height:1.8
}
#hint{
 position:absolute;
 top:85px;
 left:50%;
 transform:translateX(-50%);
 white-space:nowrap;
 background:#111a24dd;
 padding:8px 13px;
 border-radius:20px;
 font-size:11px
}
#controls{
 position:absolute;
 bottom:18px;
 left:20px;
 right:20px;
 display:flex;
 justify-content:space-between;
 align-items:end
}
#stick{
 width:120px;
 height:120px;
 border-radius:50%;
 background:#ffffff12;
 border:2px solid #ffffff55;
 position:relative
}
#nub{
 width:48px;
 height:48px;
 position:absolute;
 left:34px;
 top:34px;
 border-radius:50%;
 background:#b9c6ba77;
 border:2px solid #ffffff88
}
#buttons{
 display:flex;
 gap:12px;
 align-items:end
}
.action{
 border-radius:50%;
 border:1px solid #c4a16c;
 color:white;
 background:#302a20dd;
 font-weight:bold
}
#run{
 width:65px;
 height:65px
}
#talk{
 width:75px;
 height:75px;
 background:#66502c
}
#start{
 position:fixed;
 inset:0;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#080d13ee;
 padding:20px;
 text-align:center
}
.card{
 background:#17212b;
 border:1px solid #b39a67;
 border-radius:20px;
 padding:30px;
 max-width:400px
}
h1{
 color:#d6bd8a;
 letter-spacing:4px
}
p{
 color:#c3cbd2;
 font-size:13px;
 line-height:2
}
#play{
 background:#9b7948;
 color:white;
 border:0;
 padding:15px 35px;
 border-radius:10px;
 font-weight:bold;
 font-size:15px
}
#dialog{
 display:none;
 position:absolute;
 bottom:145px;
 left:5%;
 width:90%;
 background:#101823f5;
 border:1px solid #d0ae70;
 border-radius:15px;
 padding:15px;
 text-align:center;
 line-height:2
}
#who{color:#e3c78f;font-weight:bold}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

<div id="top">
 <div class="panel">
  <div id="title">DARK REALM</div>
  <small>THE OLD TOWN</small>
 </div>

 <div class="panel" id="stats">
  ❤️ 100<br>
  🪙 25
 </div>
</div>

<div id="hint">به سرزمین کهن خوش آمدی</div>

<div id="controls">

 <div id="stick">
  <div id="nub"></div>
 </div>

 <div id="buttons">
  <button class="action" id="run">دویدن</button>
  <button class="action" id="talk">تعامل</button>
 </div>

</div>

<div id="dialog">
 <div id="who"></div>
 <div id="words"></div>
</div>

</div>

<div id="start">
 <div class="card">
  <h1>DARK REALM</h1>
  <div style="color:#b9a47c">THE OLD TOWN</div>

  <p>
   در سرزمین‌های فراموش‌شده قدم بگذار.<br>
   شهر قدیمی را کشف کن و رازهای آن را پیدا کن.
  </p>

  <button id="play">شروع ماجراجویی</button>

  <p>نسخه آزمایشی ۲ · Offline</p>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

let camX=0;
let camY=0;

let started=false;
let running=false;

function resize(){
 W=innerWidth;
 H=innerHeight;

 canvas.width=W*devicePixelRatio;
 canvas.height=H*devicePixelRatio;

 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

addEventListener("resize",resize);
resize();

const world={
 w:2400,
 h:2000
};

const player={
 x:1200,
 y:1000,
 speed:2.3,
 direction:"down",
 moving:false,
 frame:0
};

let joy={x:0,y:0};
let keys={};

let obstacles=[];
let trees=[];
let buildings=[];
let npcs=[];

/* -----------------------------
   ساختمان‌ها
----------------------------- */

function building(x,y,w,h,name){
 buildings.push({x,y,w,h,name});

 obstacles.push({
  x:x+10,
  y:y+20,
  w:w-20,
  h:h-10
 });
}

building(750,650,230,190,"خانه");
building(1150,600,260,210,"مغازه");
building(1550,680,230,190,"خانه");
building(650,1200,240,190,"خانه");
building(1450,1250,270,220,"خانه");
building(1000,350,260,200,"تالار");

/* -----------------------------
   درختان
----------------------------- */

for(let i=0;i<130;i++){

 let x=Math.random()*world.w;
 let y=Math.random()*world.h;

 if(
  x>900&&x<1500&&
  y>800&&y<1200
 )continue;

 trees.push({
  x,y,
  size:20+Math.random()*15
 });

 obstacles.push({
  x:x-12,
  y:y-10,
  w:24,
  h:25
 });
}

/* -----------------------------
   شخصیت‌های شهر
----------------------------- */

npcs=[
 {
  x:1200,
  y:780,
  name:"نگهبان شهر",
  msg:"مسافر، مراقب جنگل شمالی باش. چیزهایی در تاریکی حرکت می‌کنند."
 },
 {
  x:900,
  y:1050,
  name:"فروشنده",
  msg:"به بازار قدیمی خوش آمدی. روزی اجناس زیادی برای فروش خواهم داشت."
 },
 {
  x:1500,
  y:1050,
  name:"مسافر",
  msg:"در شرق شهر خرابه‌هایی پیدا کرده‌ام. کسی جرئت نزدیک شدن ندارد."
 },
 {
  x:1200,
  y:1350,
  name:"دهقان پیر",
  msg:"این سرزمین روزگاری تحت فرمان یک پادشاه قدرتمند بود."
 }
];

let near=null;

/* -----------------------------
   کیبورد
----------------------------- */

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

/* -----------------------------
   جوی‌استیک
----------------------------- */

const stick=document.getElementById("stick");
const nub=document.getElementById("nub");

let dragging=false;

function moveJoy(e){

 let r=stick.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 let d=Math.hypot(dx,dy);
 let max=36;

 if(d>max){
  dx=dx/d*max;
  dy=dy/d*max;
 }

 joy.x=dx/max;
 joy.y=dy/max;

 nub.style.left=(34+dx)+"px";
 nub.style.top=(34+dy)+"px";
}

stick.addEventListener("pointerdown",e=>{
 dragging=true;
 stick.setPointerCapture(e.pointerId);
 moveJoy(e);
});

stick.addEventListener("pointermove",e=>{
 if(dragging)moveJoy(e);
});

function stopJoy(){
 dragging=false;
 joy.x=0;
 joy.y=0;
 nub.style.left="34px";
 nub.style.top="34px";
}

stick.addEventListener("pointerup",stopJoy);
stick.addEventListener("pointercancel",stopJoy);

/* -----------------------------
   دویدن
----------------------------- */

document.getElementById("run").addEventListener("pointerdown",()=>{
 running=true;
});

document.getElementById("run").addEventListener("pointerup",()=>{
 running=false;
});

document.getElementById("run").addEventListener("pointercancel",()=>{
 running=false;
});

/* -----------------------------
   شروع
----------------------------- */

document.getElementById("play").onclick=()=>{
 started=true;
 document.getElementById("start").style.display="none";
};

/* -----------------------------
   برخورد
----------------------------- */

function collide(x,y){

 let r=12;

 for(let o of obstacles){

  if(
   x+r>o.x&&
   x-r<o.x+o.w&&
   y+r>o.y&&
   y-r<o.y+o.h
  ){
   return true;
  }
 }

 return false;
}

/* -----------------------------
   حرکت
----------------------------- */

function update(){

 if(!started)return;

 let dx=joy.x;
 let dy=joy.y;

 if(keys.w||keys.arrowup)dy-=1;
 if(keys.s||keys.arrowdown)dy+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;

 let length=Math.hypot(dx,dy);

 if(length>1){
  dx/=length;
  dy/=length;
 }

 player.moving=length>0.1;

 let speed=running?4.3:2.3;

 if(player.moving){

  player.frame+=running?.23:.13;

  if(Math.abs(dx)>Math.abs(dy)){
   player.direction=dx>0?"right":"left";
  }else{
   player.direction=dy>0?"down":"up";
  }

  let nx=player.x+dx*speed;
  let ny=player.y+dy*speed;

  if(!collide(nx,player.y))player.x=nx;
  if(!collide(player.x,ny))player.y=ny;
 }

 player.x=Math.max(20,Math.min(world.w-20,player.x));
 player.y=Math.max(20,Math.min(world.h-20,player.y));

 camX+=(player.x-W/2-camX)*0.12;
 camY+=(player.y-H/2-camY)*0.12;

 camX=Math.max(0,Math.min(world.w-W,camX));
 camY=Math.max(0,Math.min(world.h-H,camY));

 near=null;

 for(let n of npcs){
  if(Math.hypot(player.x-n.x,player.y-n.y)<70){
   near=n;
   break;
  }
 }
}

/* -----------------------------
   رسم زمین
----------------------------- */

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(x-camX,y-camY,w,h);
}

function circle(x,y,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(x-camX,y-camY,r,0,Math.PI*2);
 ctx.fill();
}

function ground(){

 rect(0,0,world.w,world.h,"#28382d");

 /* بافت زمین */

 for(let y=0;y<world.h;y+=48){
  for(let x=0;x<world.w;x+=48){

   let seed=(x*13+y*7)%5;

   if(seed===0){
    rect(x,y,3,3,"#354638");
   }

   if(seed===2){
    rect(x+20,y+10,4,3,"#202e25");
   }
  }
 }

 /* مسیر اصلی */

 rect(0,950,world.w,120,"#665747");
 rect(1100,0,120,world.h,"#665747");

 rect(0,990,world.w,8,"#796b59");
 rect(1155,0,8,world.h,"#796b59");

 /* مسیر فرعی */

 rect(800,700,80,400,"#5b4c3e");
 rect(1450,950,100,450,"#5b4c3e");

 /* سنگ‌فرش */

 for(let y=950;y<1070;y+=24){
  for(let x=0;x<world.w;x+=40){
   rect(x,y,36,20,"#756654");
  }
 }

 for(let x=1100;x<1220;x+=24){
  for(let y=0;y<world.h;y+=40){
   rect(x,y,20,36,"#756654");
  }
 }
}

/* -----------------------------
   رسم درخت
----------------------------- */

function drawTree(t){

 let x=t.x;
 let y=t.y;
 let s=t.size;

 /* سایه */

 circle(x+5,y+10,s,"#18221c");

 /* تنه */

 rect(x-6,y-10,12,28,"#59402d");

 /* برگ */

 circle(x,y-15,s,"#1b3022");
 circle(x-10,y-25,s*.7,"#29452e");
 circle(x+10,y-25,s*.7,"#314d35");

 circle(x-5,y-35,s*.6,"#3a5a3d");

}

/* -----------------------------
   ساختمان
----------------------------- */

function drawBuilding(b){

 let x=b.x;
 let y=b.y;
 let w=b.w;
 let h=b.h;

 /* سایه */

 rect(x+12,y+15,w,h,"#111614");

 /* دیوار */

 rect(x,y,w,h,"#665548");

 /* سنگ */

 for(let i=0;i<6;i++){
  rect(
   x+10,
   y+30+i*25,
   w-20,
   2,
   "#81705d"
  );
 }

 /* سقف */

 rect(x-12,y-20,w+24,38,"#3b2928");

 rect(x+10,y-14,w-20,7,"#57403b");

 /* پنجره */

 rect(x+25,y+55,35,45,"#211e1a");
 rect(x+w-60,y+55,35,45,"#211e1a");

 rect(x+28,y+58,29,39,"#b3935c");
 rect(x+w-57,y+58,29,39,"#b3935c");

 /* در */

 rect(x+w/2-20,y+h-65,40,65,"#35241c");
 rect(x+w/2-16,y+h-61,32,61,"#53372a");

 /* نام */

 ctx.fillStyle="#d3c1a0";
 ctx.font="11px Tahoma";
 ctx.textAlign="center";

 ctx.fillText(
  b.name,
  x+w/2-camX,
  y-30-camY
 );
}

/* -----------------------------
   شخصیت
----------------------------- */

function drawPlayer(){

 let x=player.x;
 let y=player.y;

 let walk=player.moving?
  Math.sin(player.frame)*5:0;

 /* سایه */

 circle(x,y+15,12,"#111");

 /* پاها */

 rect(x-8+walk,y+14,6,12,"#292d35");
 rect(x+2-walk,y+14,6,12,"#292d35");

 /* بدن */

 rect(x-10,y-3,20,22,"#334b68");

 /* لباس */

 rect(x-8,y+2,16,13,"#415e7f");

 /* دست */

 rect(x-13,y+2,4,12,"#c49a78");
 rect(x+9,y+2,4,12,"#c49a78");

 /* سر */

 circle(x,y-11,10,"#d3a17d");

 /* مو */

 rect(x-10,y-20,20,6,"#30241f");

 if(player.direction==="left"){
  rect(x-11,y-15,5,8,"#30241f");
 }

 if(player.direction==="right"){
  rect(x+6,y-15,5,8,"#30241f");
 }

 /* نام */

 ctx.fillStyle="#e5d5b6";
 ctx.font="12px Tahoma";
 ctx.textAlign="center";

 ctx.fillText("تو",x-camX,y-35-camY);
}

/* -----------------------------
   NPC
----------------------------- */

function drawNPC(n){

 circle(n.x,n.y+10,11,"#111");

 circle(n.x,n.y-8,9,"#c49a79");

 rect(n.x-9,n.y,18,21,"#795c4c");

 rect(n.x-8,n.y-17,16,5,"#342821");

 if(near===n){

  ctx.fillStyle="#f1d59c";
  ctx.font="12px Tahoma";
  ctx.textAlign="center";

  ctx.fillText(
   "تعامل",
   n.x-camX,
   n.y-35-camY
  );
 }
}

/* -----------------------------
   میدان شهر
----------------------------- */

function drawFountain(){

 circle(1200,1000,75,"#4e5147");
 circle(1200,1000,58,"#8c8068");
 circle(1200,1000,43,"#3d5558");
 circle(1200,1000,15,"#9a8a66");

 circle(1200,1000,6,"#c0b18b");
}

/* -----------------------------
   رسم نهایی
----------------------------- */

function draw(){

 ctx.clearRect(0,0,W,H);

 ground();

 trees.forEach(drawTree);

 buildings.forEach(drawBuilding);

 drawFountain();

 npcs.forEach(drawNPC);

 drawPlayer();

}

/* -----------------------------
   تعامل
----------------------------- */

function interact(){

 let dialog=document.getElementById("dialog");

 document.getElementById("who").textContent=
  near?near.name:"";

 document.getElementById("words").textContent=
  near?near.msg:"کسی نزدیکت نیست.";

 dialog.style.display="block";

 setTimeout(()=>{
  dialog.style.display="none";
 },4000);
}

document.getElementById("talk").onclick=interact;

/* -----------------------------
   حلقه
----------------------------- */

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
