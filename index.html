
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OPEN CITY — 3D Mobile Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb7c6;font-family:Tahoma,Arial;color:#fff;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#101a20c9;border:1px solid #ffffff35;border-radius:12px;padding:9px 12px;backdrop-filter:blur(6px);font-size:12px}
#brand{position:absolute;top:12px;left:12px;font-weight:bold;letter-spacing:1px}
#stats{position:absolute;top:12px;right:12px;line-height:1.8;text-align:right}
#hint{position:absolute;top:88px;left:50%;transform:translateX(-50%);white-space:nowrap}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:bold;opacity:0;transition:opacity .2s}
#controls{position:absolute;bottom:16px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:5px;pointer-events:auto}
.ctrl{border:1px solid #ffffff70;background:#14232dcc;color:#fff;border-radius:14px;font-size:21px;touch-action:none;user-select:none}
.ctrl:active{background:#477b91}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions{display:flex;gap:8px;pointer-events:auto;align-items:end}
.actions .ctrl{width:64px;height:58px;font-size:12px;font-weight:bold}
#look{position:absolute;right:0;top:28%;width:42%;height:42%;pointer-events:auto}
#footer{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffbb;white-space:nowrap}
@media(min-width:800px){.pad{transform:scale(1.12);transform-origin:bottom left}.actions .ctrl{width:76px;height:64px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="brand" class="panel">OPEN CITY <span style="color:#8fe0ff">3D</span></div>
 <div id="stats" class="panel">وضعیت: <b id="mode">پیاده</b><br>سرعت: <b id="speed">۰</b></div>
 <div id="hint" class="panel">در شهر حرکت کن و کنار ماشین دکمه «سوار» را بزن</div>
 <div id="toast" class="panel"></div>
 <div id="look"></div>
 <div id="controls">
  <div class="pad">
   <button class="ctrl" id="up">▲</button>
   <button class="ctrl" id="left">◀</button>
   <button class="ctrl" id="down">▼</button>
   <button class="ctrl" id="right">▶</button>
  </div>
  <div class="actions">
   <button class="ctrl" id="jump">پرش</button>
   <button class="ctrl" id="enter">سوار</button>
   <button class="ctrl" id="brake">ترمز</button>
   <button class="ctrl" id="gas">گاز</button>
  </div>
 </div>
 <div id="footer">نسخه آزمایشی موبایل • حرکت: دکمه‌ها یا WASD • چرخش دوربین: کشیدن سمت راست صفحه</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const root=document.getElementById('game'),toast=document.getElementById('toast');
if(!window.THREE){
root.innerHTML='<div style="padding:30px;color:white">برای اجرای نسخه سه‌بعدی، اتصال اینترنت را روشن کنید و صفحه را دوباره بارگذاری کنید.</div>';
return;
}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc2d2);
scene.fog=new THREE.Fog(0x9fc2d2,90,270);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f4ff,0x64745d,2.0));
const sun=new THREE.DirectionalLight(0xfff0d2,2.2);
sun.position.set(-55,90,35);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);
const mat=(color,rough=.85)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x66845d));
ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
ground.receiveShadow=true;
scene.add(ground);
function box(w,h,d,color,x,y,z,shadow=true){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
m.position.set(x,y,z);
m.castShadow=shadow;
m.receiveShadow=true;
scene.add(m);
return m;
}
function road(w,d,x,z){
const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(0x30383d));
m.rotation.x=-Math.PI/2;
m.position.set(x,.005,z);
scene.add(m);
const dashMat=mat(0xe7dca4);
for(let k=-Math.floor(d/16);k<=Math.floor(d/16);k++){
const dash=new THREE.Mesh(new THREE.BoxGeometry(.22,.025,4),dashMat);
dash.position.set(x,.03,z+k*16);
scene.add(dash);
}
}
road(500,13,0,0);
road(500,13,0,54);
road(13,500,0,0);
road(13,500,54,0);
const buildingColors=[0xb9b2a2,0x8f9b9e,0xc7b69a,0x858d91,0xb7c2bd,0x9e8e82];
for(let gx=-5;gx<=5;gx++)for(let gz=-5;gz<=5;gz++){
if((Math.abs(gx)<=0&&Math.abs(gz)<=0)||((gx===0||gx===1)&&(gz===0||gz===1)))continue;
const cx=gx*46+23,cz=gz*46+23;
if(Math.abs(cx)<12||Math.abs(cz)<12||Math.abs(cx-54)<12||Math.abs(cz-54)<12)continue;
const w=18+Math.random()*9,d=18+Math.random()*9,h=12+Math.random()*38;
box(w,h,d,buildingColors[Math.floor(Math.random()*buildingColors.length)],cx,h/2,cz);
if(Math.random()>.55)box(w*.3,2,d*.3,0x626c70,cx,h+1,cz,false);
const winMat=mat(0x8dc0c9,.4);
for(let yy=4;yy<h-2;yy+=4)for(let xx=-w/2+2;xx<w/2-1;xx+=3.5){
const win=new THREE.Mesh(new THREE.BoxGeometry(1.35,1.5,.08),winMat);
win.position.set(cx+xx,yy,cz+d/2+.05);
scene.add(win);
}
if(Math.random()>.45){
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,3,7),mat(0x684b31));
trunk.position.set(cx-w/2-2,1.5,cz);
scene.add(trunk);
const crown=new THREE.Mesh(new THREE.SphereGeometry(2.1,8,7),mat(0x47784c));
crown.position.set(cx-w/2-2,4,cz);
crown.castShadow=true;
scene.add(crown);
}
}
for(let x=-180;x<=180;x+=45)for(const z of [-9,9,45,63]){
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,6,8),mat(0x3c4548));
pole.position.set(x,3,z);
scene.add(pole);
box(1.5,.12,.12,0x3c4548,x+.65,5.8,z,false);
const bulb=new THREE.PointLight(0xffe4ae,.35,13);
bulb.position.set(x+1,5.5,z);
scene.add(bulb);
}
function makePerson(){
const g=new THREE.Group();
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,4,8),mat(0x253f65));
torso.position.y=1.45;
torso.castShadow=true;
g.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),mat(0xc9906e));
head.position.y=2.35;
head.castShadow=true;
g.add(head);
const legs=[];
for(let s of [-1,1]){
const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.19,.7,3,7),mat(0x252b32));
leg.position.set(s*.22,.48,0);
leg.castShadow=true;
g.add(leg);
legs.push(leg);
}
return {group:g,legs};
}
const person=makePerson();
scene.add(person.group);
person.group.position.set(2,0,13);
const car=new THREE.Group();
scene.add(car);
const body=new THREE.Mesh(new THREE.BoxGeometry(4.4,1.05,2.15),mat(0xb52f28,.45));
body.position.y=.85;
body.castShadow=true;
car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.25,.95,1.8),mat(0x263d4b,.35));
cabin.position.set(-.25,1.72,0);
cabin.castShadow=true;
car.add(cabin);
const wheels=[];
for(const x of [-1.45,1.45])for(const z of [-1.12,1.12]){
const w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.32,16),mat(0x151719));
w.rotation.x=Math.PI/2;
w.position.set(x,.48,z);
w.castShadow=true;
car.add(w);
wheels.push(w);
}
car.position.set(9,0,18);
const player=person.group;
let inCar=false,yaw=0,camYaw=0,camPitch=.22,speed=0,velY=0,onGround=true;
const keys={};
let touch={};
const down=(id,k)=>{
const e=document.getElementById(id);
e.addEventListener('pointerdown',ev=>{
ev.preventDefault();
touch[k]=true;
e.setPointerCapture(ev.pointerId);
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>e.addEventListener(t,()=>touch[k]=false));
};
down('up','forward');
down('down','back');
down('left','left');
down('right','right');
down('gas','gas');
down('brake','brake');
down('jump','jump');
addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(e.key===' ')touch.jump=true;
if(e.key.toLowerCase()==='e')toggleCar();
});
addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
if(e.key===' ')touch.jump=false;
});
function active(k){
return !!touch[k]||
(k==='forward'&&(keys.w||keys.arrowup))||
(k==='back'&&(keys.s||keys.arrowdown))||
(k==='left'&&(keys.a||keys.arrowleft))||
(k==='right'&&(keys.d||keys.arrowright))||
(k==='gas'&&keys.w)||(k==='brake'&&keys.s);
}
let lookActive=false,lastX=0,lastY=0;
const look=document.getElementById('look');
look.addEventListener('pointerdown',e=>{
lookActive=true;lastX=e.clientX;lastY=e.clientY;
look.setPointerCapture(e.pointerId);
});
look.addEventListener('pointermove',e=>{
if(!lookActive)return;
const dx=e.clientX-lastX,dy=e.clientY-lastY;
lastX=e.clientX;lastY=e.clientY;
camYaw-=dx*.006;
camPitch=Math.max(-.05,Math.min(.75,camPitch+dy*.004));
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>look.addEventListener(t,()=>lookActive=false));
function say(t){
toast.textContent=t;
toast.style.opacity=1;
clearTimeout(say.timer);
say.timer=setTimeout(()=>toast.style.opacity=0,1500);
}
function toggleCar(){
if(!inCar&&player.position.distanceTo(car.position)<5){
inCar=true;
person.group.visible=false;
say('سوار خودرو شدی');
}else if(inCar){
inCar=false;
person.group.visible=true;
player.position.copy(car.position).add(new THREE.Vector3(3,0,0));
say('از خودرو پیاده شدی');
}else say('برای سوار شدن به ماشین نزدیک شو');
}
document.getElementById('enter').addEventListener('pointerdown',e=>{
e.preventDefault();toggleCar();
});
document.getElementById('jump').addEventListener('pointerdown',()=>{
if(!inCar&&onGround){velY=7;onGround=false;}
});
let last=performance.now();
function animate(now){
requestAnimationFrame(animate);
const dt=Math.min((now-last)/1000,.04);
last=now;
const f=active('forward'),b=active('back'),l=active('left'),r=active('right');
if(inCar){
if(active('gas')||f)speed=Math.min(speed+12*dt,25);
else if(active('brake')||b)speed=Math.max(speed-22*dt,-7);
else speed*=Math.pow(.94,dt*60);
if(l)car.rotation.y+=1.55*dt*(.35+Math.abs(speed)/18);
if(r)car.rotation.y-=1.55*dt*(.35+Math.abs(speed)/18);
const dir=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));
car.position.addScaledVector(dir,speed*dt);
wheels.forEach(w=>w.rotation.x+=speed*dt*1.8);
document.getElementById('mode').textContent='داخل خودرو';
document.getElementById('speed').textContent=Math.abs(speed).toFixed(0);
}else{
const moving=f||b||l||r;
if(moving){
let dx=(r?1:0)-(l?1:0),dz=(b?1:0)-(f?1:0);
const a=Math.atan2(dx,dz)+camYaw;
player.rotation.y=a;
const dir=new THREE.Vector3(Math.sin(a),0,Math.cos(a));
player.position.addScaledVector(dir,7*dt);
}
if(!onGround){
velY-=18*dt;
player.position.y+=velY*dt;
if(player.position.y<=0){
player.position.y=0;velY=0;onGround=true;
}
}
person.legs.forEach((leg,i)=>{
leg.rotation.x=moving?Math.sin(now*.012+i*Math.PI)*.55:0;
});
document.getElementById('mode').textContent='پیاده';
document.getElementById('speed').textContent=moving?'۷':'۰';
}
const actor=inCar?car:player;
actor.position.x=THREE.MathUtils.clamp(actor.position.x,-225,225);
actor.position.z=THREE.MathUtils.clamp(actor.position.z,-225,225);
const focus=actor.position.clone();
focus.y+=inCar?1.4:1.5;
const offset=new THREE.Vector3(
Math.sin(camYaw)*Math.cos(camPitch),
Math.sin(camPitch)+.22,
Math.cos(camYaw)*Math.cos(camPitch)
).multiplyScalar(inCar?10:8);
camera.position.lerp(focus.clone().add(offset),1-Math.pow(.001,dt));
camera.lookAt(focus);
renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
say('به OPEN CITY خوش آمدی');
})();
</script>
</body>
</html>
