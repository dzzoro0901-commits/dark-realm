
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARK REALM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251e;font-family:Tahoma;color:white;touch-action:none}
canvas{display:block;width:100%;height:100%}
button{font-family:Tahoma;cursor:pointer;user-select:none;-webkit-user-select:none}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101827e8;border:1px solid #9b895d;border-radius:12px;padding:10px}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
#title{font-size:17px;color:#d8bd83;font-weight:bold}
#stats{font-size:12px;line-height:1.8;text-align:right;min-width:120px}
#hint{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:#101827dd;padding:8px 12px;border-radius:20px;font-size:11px;white-space:nowrap}
#controls{position:absolute;bottom:20px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:auto}
#stick{width:120px;height:120px;border:2px solid #ffffff66;background:#ffffff20;border-radius:50%;position:relative;touch-action:none}

.action{border-radius:50%;background:#70552f;border:2px solid #e0bd7c;color:white;font-weight:bold;touch-action:none}
#run{width:65px;height:65px;font-size:12px}
#talk{width:75px;height:75px;font-size:13px}
#dialog{display:none;position:absolute;bottom:125px;left:5%;width:90%;max-height:30vh;overflow:auto;background:#101827f2;border:1px solid #d0ae70;border-radius:14px;padding:16px;text-align:center;line-height:1.8;pointer-events:auto}
#who{color:#e3c78f;font-weight:bold;margin-bottom:5px}

.card{background:#131d2c;border:1px solid #a88e5d;border-radius:20px;padding:28px;max-width:420px;width:100%}

#controls{bottom:8px}

#settingsPanel{top:175px}
#dialog{bottom:105px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
 <div id="top">
  <div class="panel"><div id="title">DARK REALM</div><small>THE OLD TOWN</small></div>
  <div class="panel" id="stats">❤️ 100<br>🪙 25<br>🌅 08:00</div>
 </div>

 <button id="settingsBtn">⚙️</button>
 <div id="settingsPanel">
  <div class="settingsTitle">⚙️ تنظیمات بازی</div>
  <div style="font-size:12px;margin-bottom:8px">🔊 صدای محیط</div>
  <input id="volume" type="range" min="0" max="100" value="35">
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#aaa"><span>کم</span><span>زیاد</span></div>
  <button id="soundBtn">🔊 قطع صدا</button>
  <button id="closeSettings">بستن</button>
 </div>

 <div id="hint">در شهر حرکت کن و با مردم صحبت کن</div>
 <div id="controls">
  <div id="stick"><div id="nub"></div></div>
  <div id="buttons">
   <button class="action" id="run">دویدن</button>
   <button class="action" id="talk">تعامل</button>
  </div>
 </div>
 <div id="dialog"><div id="who"></div><div id="words"></div></div>
</div>

<div id="start">
 <div class="card">
  <h1>DARK REALM</h1>
  <div style="color:#b9a47c">THE OLD TOWN</div>
  <p>به شهر قدیمی خوش آمدی.<br>در کوچه‌ها بگرد، با مردم شهر حرف بزن و رازهای این سرزمین را کشف کن.</p>
  <button id="play">شروع ماجراجویی</button>
  <p>نسخه آزمایشی آفلاین</p>
 </div>
</div>

<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
const world={w:2800,h:2300};
let W=innerWidth,H=innerHeight,camX=0,camY=0;
let started=false,lastTime=performance.now(),gameTime=0;
const dayLength=240;

function resize(){
 W=innerWidth;H=innerHeight;
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';
 canvas.style.height=H+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
resize();

const player={x:950,y:900,direction:'down',moving:false,frame:0,radius:12};
let keys={},joy={x:0,y:0},running=false,near=null;

const buildings=[
{x:650,y:350,w:220,h:170,name:'خانه',chimney:true},
{x:1400,y:350,w:240,h:190,name:'مغازه',chimney:true},
{x:2200,y:350,w:250,h:190,name:'مسافرخانه',chimney:true},
{x:650,y:1050,w:230,h:180,name:'خانه',chimney:true},
{x:1400,y:1050,w:250,h:200,name:'خانه',chimney:true},
{x:2200,y:1050,w:220,h:180,name:'خانه قدیمی',chimney:true},
{x:650,y:1740,w:230,h:180,name:'خانه جنگلی',chimney:true},
{x:1400,y:1740,w:250,h:190,name:'کلبه',chimney:true},
{x:2200,y:1740,w:250,h:190,name:'خانه قدیمی',chimney:true}
];

/* جاده‌ها با مرکزیت هماهنگ با میدان و فواره */
const roads=[
{x:0,y:680,w:2800,h:140},
{x:0,y:1480,w:2800,h:140},
{x:480,y:0,w:120,h:2300},
{x:1030,y:0,w:140,h:796},
{x:1030,y:1004,w:140,h:1296},
{x:1880,y:0,w:140,h:2300},
{x:2580,y:0,w:120,h:2300},
{x:0,y:830,w:996,h:140},
{x:1204,y:830,w:1596,h:140}
];

const plaza={x:1100,y:900,r:104};
const fountain={x:1100,y:900,r:58};

const npcs=[
{x:1100,y:690,name:'مامان ادریس',msg:'من همیشه مراقب شهر هستم. به میدان مرکزی سر بزن؛ آنجا معمولاً آدم‌های زیادی پیدا می‌کنی.',color:'#9b5968',route:[{x:1100,y:690},{x:1120,y:790},{x:970,y:790},{x:1030,y:760}]},
{x:820,y:980,name:'ویچر',msg:'سلام مسافر! هرچی بخوای شاید توی مغازه پیدا بشه، البته قیمت‌ها رو خودم تعیین میکنم!',color:'#536c49',route:[{x:820,y:980},{x:760,y:980},{x:650,y:900},{x:760,y:850},{x:900,y:900}]},
{x:1430,y:1000,name:'زئوس',msg:'دنبال معامله‌ای؟ من آدم مناسبی برای هر کاری هستم... البته پولت رو اول نشون بده.',color:'#80649b',route:[{x:1430,y:1000},{x:1510,y:950},{x:1550,y:850},{x:1450,y:800},{x:1400,y:900}]},
{x:1100,y:1200,name:'تانجیرو',msg:'نگران نباش! تا وقتی من اینجام، اجازه نمیدم کسی به شهر آسیب بزنه.',color:'#365c75',route:[{x:1100,y:1200},{x:1180,y:1100},{x:1250,y:1000},{x:1180,y:1050},{x:1100,y:1100}]},
{x:900,y:700,name:'یاشار',msg:'من فقط یه شهروند عادی هستم... چیزی ندیدی، چیزی نشنیدی.',color:'#333b49',route:[{x:900,y:700},{x:850,y:750},{x:800,y:800},{x:900,y:850},{x:950,y:750}]},
{x:1600,y:850,name:'اراد',msg:'سلام مسافر. من ارادم؛ این شهر پر از رازهای پنهانه. همیشه چشم‌هات رو باز نگه دار.',color:'#242735',route:[{x:1600,y:850},{x:1650,y:900},{x:1700,y:950},{x:1600,y:1000},{x:1550,y:900}]},
{x:2050,y:1740,name:'ممد اسموک',msg:'اوه... سلام رفیق. من ممد اسموکم. راستش یه مدته درگیر یه عادت بد شدم و کنار گذاشتنش برام آسون نیست. دارم سعی می‌کنم اوضاعمو درست کنم.',color:'#292b32',route:[{x:2050,y:1740},{x:2110,y:1770},{x:2180,y:1740},{x:2200,y:1820},{x:2130,y:1860},{x:2050,y:1810}]}
];

function overlaps(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function circleRect(cx,cy,r,o){
 const px=Math.max(o.x,Math.min(cx,o.x+o.w));
 const py=Math.max(o.y,Math.min(cy,o.y+o.h));
 return Math.hypot(cx-px,cy-py)<r;
}

const buildingZones=buildings.map(b=>({x:b.x-35,y:b.y-35,w:b.w+70,h:b.h+70}));
const trees=[];

function safeTree(x,y,s){
 const box={x:x-s,y:y-s,w:s*2,h:s*2};
 if(buildingZones.some(b=>overlaps(box,b)))return false;
 if(roads.some(r=>overlaps(box,r)))return false;
 if(Math.hypot(x-plaza.x,y-plaza.y)<plaza.r+45)return false;
 if(Math.hypot(x-player.x,y-player.y)<100)return false;
 if(npcs.some(n=>Math.hypot(x-n.x,y-n.y)<95))return false;
 if(trees.some(t=>Math.hypot(x-t.x,y-t.y)<t.size+s+12))return false;
 return true;
}

for(let i=0;i<115;i++){
 for(let attempt=0;attempt<100;attempt++){
  const x=40+Math.random()*(world.w-80);
  const y=40+Math.random()*(world.h-80);
  const size=18+Math.random()*14;
  if(safeTree(x,y,size)){trees.push({x,y,size});break;}
 }
}

const obstacles=[];
buildings.forEach(b=>obstacles.push({x:b.x+8,y:b.y+20,w:b.w-16,h:b.h-20}));
trees.forEach(t=>obstacles.push({x:t.x-t.size*.55,y:t.y-t.size*.5,w:t.size*1.1,h:t.size*1.1}));

function blocked(x,y,r=12,ignoreNPC=null){
 if(x-r<0||y-r<0||x+r>world.w||y+r>world.h)return true;
 for(const o of obstacles)if(circleRect(x,y,r,o))return true;
 if(Math.hypot(x-fountain.x,y-fountain.y)<fountain.r+r-3)return true;
 for(const n of npcs){
  if(n===ignoreNPC)continue;
  if(Math.hypot(x-n.x,y-n.y)<r+12)return true;
 }
 return false;
}
function playerBlocked(x,y){return blocked(x,y,player.radius);}

/* صفحه‌کلید */
const validKeys=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(validKeys.includes(k)){e.preventDefault();keys[k]=true;}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{
 keys={};joy.x=joy.y=0;running=false;
});

/* جوی‌استیک */
const stick=document.getElementById('stick');
const nub=document.getElementById('nub');
let dragging=false;

function moveJoy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=36,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 joy.x=dx/max;joy.y=dy/max;
 const center=(r.width-46)/2;
 nub.style.left=(center+dx)+'px';
 nub.style.top=(center+dy)+'px';
}
stick.addEventListener('pointerdown',e=>{
 e.preventDefault();dragging=true;stick.setPointerCapture(e.pointerId);moveJoy(e);
});
stick.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();moveJoy(e);}});
function stopJoy(){
 dragging=false;joy.x=joy.y=0;
 const center=(stick.clientWidth-46)/2;
 nub.style.left=center+'px';nub.style.top=center+'px';
}
stick.addEventListener('pointerup',stopJoy);
stick.addEventListener('pointercancel',stopJoy);
stick.addEventListener('lostpointercapture',stopJoy);

/* دویدن */
const runBtn=document.getElementById('run');
runBtn.addEventListener('pointerdown',e=>{
 e.preventDefault();running=true;runBtn.style.background='#a0804b';
 runBtn.setPointerCapture(e.pointerId);
});
function stopRun(){running=false;runBtn.style.background='#70552f';}
runBtn.addEventListener('pointerup',stopRun);
runBtn.addEventListener('pointercancel',stopRun);
runBtn.addEventListener('lostpointercapture',stopRun);

/* تنظیمات صدا */
const settingsBtn=document.getElementById('settingsBtn');
const settingsPanel=document.getElementById('settingsPanel');
const volume=document.getElementById('volume');
const soundBtn=document.getElementById('soundBtn');

settingsBtn.addEventListener('click',()=>{
 settingsPanel.style.display=settingsPanel.style.display==='block'?'none':'block';
});
document.getElementById('closeSettings').addEventListener('click',()=>settingsPanel.style.display='none');

let audioCtx=null,masterGain=null,soundEnabled=true,audioStarted=false,birdTimer=null;

function applyVolume(){
 if(!masterGain||!audioCtx)return;
 masterGain.gain.setTargetAtTime(soundEnabled?Number(volume.value)/100:0,audioCtx.currentTime,.08);
}
function initAudio(){
 if(audioStarted){
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  return;
 }
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=new AC();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=soundEnabled?Number(volume.value)/100:0;
  masterGain.connect(audioCtx.destination);

  const bufferSize=audioCtx.sampleRate*2;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;

  const noise=audioCtx.createBufferSource();
  noise.buffer=buffer;noise.loop=true;
  const filter=audioCtx.createBiquadFilter();
  filter.type='lowpass';filter.frequency.value=350;
  const ng=audioCtx.createGain();ng.gain.value=.025;
  noise.connect(filter);filter.connect(ng);ng.connect(masterGain);noise.start();

  const hum=audioCtx.createOscillator();
  const hg=audioCtx.createGain();
  hum.type='sine';hum.frequency.value=75;hg.gain.value=.008;
  hum.connect(hg);hg.connect(masterGain);hum.start();

  audioStarted=true;startBirds();
 }catch(err){console.warn('Audio unavailable:',err);}
}
function daylight(){
 const t=(gameTime%dayLength)/dayLength;
 return (Math.sin(t*Math.PI*2-Math.PI/2)+1)/2;
}
function birdChirp(){
 if(!audioCtx||!masterGain||!soundEnabled||!started)return;
 const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
 osc.type='sine';filter.type='bandpass';filter.frequency.value=2600;filter.Q.value=1.2;
 const base=2200+Math.random()*500,duration=.16+Math.random()*.12;
 osc.frequency.setValueAtTime(base,now);
 osc.frequency.exponentialRampToValueAtTime(base*1.35,now+duration*.45);
 osc.frequency.exponentialRampToValueAtTime(base*.9,now+duration);
 gain.gain.setValueAtTime(.0001,now);
 gain.gain.linearRampToValueAtTime(.009,now+.025);
 gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
 osc.connect(filter);filter.connect(gain);gain.connect(masterGain);
 osc.start(now);osc.stop(now+duration+.02);
}
function startBirds(){
 if(birdTimer)clearTimeout(birdTimer);
 function schedule(){
  if(!started||!audioCtx)return;
  if(soundEnabled&&daylight()>.55&&Math.random()<.7)birdChirp();
  birdTimer=setTimeout(schedule,7000+Math.random()*8000);
 }
 schedule();
}
soundBtn.addEventListener('click',()=>{
 soundEnabled=!soundEnabled;applyVolume();
 soundBtn.textContent=soundEnabled?'🔊 قطع صدا':'🔇 فعال کردن صدا';
});
volume.addEventListener('input',applyVolume);

document.getElementById('play').addEventListener('click',()=>{
 started=true;document.getElementById('start').style.display='none';
 initAudio();
 if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
});

/* ابزار رسم */
function rect(x,y,w,h,c){
 ctx.fillStyle=c;ctx.fillRect(x-camX,y-camY,w,h);
}
function circle(x,y,r,c){
 ctx.fillStyle=c;ctx.beginPath();ctx.arc(x-camX,y-camY,r,0,Math.PI*2);ctx.fill();
}

/* میدان */
function drawPlaza(){
 circle(1100,900,104,'#443d32');
 circle(1100,900,98,'#8a7962');
 circle(1100,900,88,'#675a49');
 circle(1100,900,80,'#796a57');
 ctx.strokeStyle='#a18b6d';ctx.lineWidth=5;
 ctx.beginPath();ctx.arc(1100-camX,900-camY,92,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='#51483c';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(1100-camX,900-camY,76,0,Math.PI*2);ctx.stroke();
}

/* زمین و جاده یکپارچه */
function drawGround(){
 rect(0,0,world.w,world.h,'#29382f');

 const startX=Math.max(0,Math.floor(camX/80)*80);
 const endX=Math.min(world.w,camX+W+80);
 const startY=Math.max(0,Math.floor(camY/80)*80);
 const endY=Math.min(world.h,camY+H+80);

 for(let y=startY;y<endY;y+=80){
  for(let x=startX;x<endX;x+=80){
   if((x+y)%160===0)rect(x,y,80,80,'#2d3d32');
  }
 }

 // حاشیه و سطح اصلی جاده‌ها
 roads.forEach(r=>rect(r.x-9,r.y-9,r.w+18,r.h+18,'#403a32'));
 roads.forEach(r=>rect(r.x,r.y,r.w,r.h,'#655747'));

 // بافت سنگ‌فرش با برش دقیق روی کل شبکه جاده
 ctx.save();
 ctx.beginPath();
 roads.forEach(r=>ctx.rect(r.x-camX,r.y-camY,r.w,r.h));
 ctx.clip();

 const tw=34,th=28;
 const sx=Math.floor(camX/tw)*tw;
 const sy=Math.floor(camY/th)*th;

 for(let y=sy;y<camY+H+th;y+=th){
  for(let x=sx;x<camX+W+tw;x+=tw){
   const tx=Math.floor(x/tw),ty=Math.floor(y/th);
   rect(x+1,y+1,tw-2,th-2,(tx+ty)%2===0?'#796a57':'#71624f');
   rect(x+5,y+5,3,2,'#897762');
  }
 }
 ctx.restore();

 drawPlaza();
}

/* درخت */
function drawTree(t){
 const{x,y,size:s}=t;
 circle(x+6,y+13,s,'#17241c');
 rect(x-5,y-3,10,25,'#5a402d');
 circle(x,y-15,s,'#1b3022');
 circle(x-10,y-24,s*.65,'#29452e');
 circle(x+10,y-24,s*.65,'#314d35');
 circle(x,y-35,s*.55,'#3a5a3d');
 circle(x-5,y-23,s*.35,'#476846');
}

/* ساختمان */
function drawBuilding(b){
 rect(b.x+10,b.y+12,b.w,b.h,'#171b1c');
 rect(b.x,b.y,b.w,b.h,'#665548');
 for(let i=0;i<5;i++)rect(b.x+8,b.y+30+i*27,b.w-16,2,'#81705d');
 rect(b.x-12,b.y-20,b.w+24,38,'#392a28');
 rect(b.x+15,b.y-12,b.w-30,6,'#59403b');
 rect(b.x+25,b.y+55,35,45,'#211e1a');
 rect(b.x+b.w-60,b.y+55,35,45,'#211e1a');
 rect(b.x+28,b.y+58,29,39,'#b08c54');
 rect(b.x+b.w-57,b.y+58,29,39,'#b08c54');
 rect(b.x+b.w/2-20,b.y+b.h-65,40,65,'#35241c');
 rect(b.x+b.w/2-15,b.y+b.h-60,30,60,'#4a3023');
 if(b.chimney){
  rect(b.x+b.w-48,b.y-32,25,40,'#59463a');
  rect(b.x+b.w-53,b.y-36,35,9,'#392b26');
 }
 ctx.fillStyle='#d3c1a0';ctx.font='11px Tahoma';ctx.textAlign='center';
 ctx.fillText(b.name,b.x+b.w/2-camX,b.y-30-camY);
}

/* فواره چهارطرفه و متقارن */
function drawFountain(){
 const x=1100-camX,y=900-camY;
 ctx.save();ctx.translate(x,y);

 ctx.fillStyle='#252b27';
 ctx.beginPath();ctx.arc(0,4,65,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#4d5147';
 ctx.beginPath();ctx.arc(0,0,61,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#a18d6e';
 ctx.beginPath();ctx.arc(0,0,55,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#77705b';
 ctx.beginPath();ctx.arc(0,0,49,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#3c6264';
 ctx.beginPath();ctx.arc(0,0,43,0,Math.PI*2);ctx.fill();

 ctx.strokeStyle='#c0ad8b';ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(0,0,55,0,Math.PI*2);ctx.stroke();

 ctx.strokeStyle='#8da5a0';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,44,0,Math.PI*2);ctx.stroke();

 for(let i=0;i<4;i++){
  ctx.save();ctx.rotate(i*Math.PI/2);

  ctx.fillStyle='#b09a75';ctx.fillRect(-6,-43,12,12);
  ctx.fillStyle='#d0bc95';ctx.fillRect(-4,-42,8,7);

  ctx.strokeStyle='#b5d5d0';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-31);
  ctx.quadraticCurveTo(7,-23,0,-16);ctx.stroke();

  ctx.fillStyle='#c5e3dc';
  ctx.beginPath();ctx.arc(0,-17,2.5,0,Math.PI*2);ctx.fill();

  ctx.restore();
 }

 ctx.fillStyle='#b49d77';
 ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#77664d';
 ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#c5b18a';
 ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();

 ctx.fillStyle='#d5e9df';
 ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();

 ctx.restore();
}

/* شخصیت‌ها */
function drawNPC(n){
 const walk=n.walk||0,step=n.moving?Math.sin(walk)*3:0;
 circle(n.x,n.y+10,11,'#111');
 rect(n.x-7+step,n.y+14,5,10,'#292d35');
 rect(n.x+2-step,n.y+14,5,10,'#292d35');
 circle(n.x,n.y,9,'#b98c69');
 rect(n.x-8,n.y+8,16,20,n.color);
 rect(n.x-13,n.y+10,4,12,'#c49a78');
 rect(n.x+9,n.y+10,4,12,'#c49a78');
 ctx.fillStyle='#f3dca5';ctx.font='12px Tahoma';ctx.textAlign='center';
 ctx.fillText(n.name,n.x-camX,n.y-28-camY);
 if(Math.hypot(player.x-n.x,player.y-n.y)<85){
  ctx.fillStyle='#fff';ctx.font='12px Tahoma';
  ctx.fillText('تعامل',n.x-camX,n.y-43-camY);
 }
}
function drawPlayer(){
 const x=player.x,y=player.y;
 const walk=player.moving?Math.sin(player.frame)*4:0;
 circle(x,y+14,12,'#101010');
 rect(x-8+walk,y+14,6,12,'#292d35');
 rect(x+2-walk,y+14,6,12,'#292d35');
 rect(x-10,y-3,20,22,'#334b68');
 rect(x-8,y+2,16,13,'#415e7f');
 rect(x-13,y+2,4,12,'#c49a78');
 rect(x+9,y+2,4,12,'#c49a78');
 circle(x,y-11,10,'#d3a17d');
 rect(x-10,y-20,20,6,'#30241f');
 if(player.direction==='left')rect(x-11,y-15,5,8,'#30241f');
 if(player.direction==='right')rect(x+6,y-15,5,8,'#30241f');
 ctx.fillStyle='#e5d5b6';ctx.font='12px Tahoma';ctx.textAlign='center';
 ctx.fillText('تو',x-camX,y-35-camY);
}

/* حرکت NPC */
function moveNPC(n,dt){
 if(!n.route||!n.route.length)return;
 if(n.target===undefined)n.target=0;
 if(n.pause>0){n.pause-=dt;n.moving=false;return;}

 const p=n.route[n.target],dx=p.x-n.x,dy=p.y-n.y,d=Math.hypot(dx,dy);
 if(d<9){
  n.target=(n.target+1)%n.route.length;
  n.pause=25+Math.random()*35;n.moving=false;n.stuck=0;return;
 }

 const step=Math.min(d,.42*dt);
 const nx=n.x+dx/d*step,ny=n.y+dy/d*step;
 let moved=false;
 if(!blocked(nx,n.y,10,n)){n.x=nx;moved=true;}
 if(!blocked(n.x,ny,10,n)){n.y=ny;moved=true;}

 if(moved){n.moving=true;n.walk=(n.walk||0)+dt*.08;n.stuck=0;}
 else{
  n.moving=false;n.stuck=(n.stuck||0)+dt;
  if(n.stuck>90){
   n.target=(n.target+1)%n.route.length;n.stuck=0;n.pause=12;
  }
 }
}

/* ساعت */
function getGameClock(){
 const totalMinutes=(360+(gameTime/dayLength)*1440)%1440;
 const hour=Math.floor(totalMinutes/60),minute=Math.floor(totalMinutes%60);
 return{hour,minute,text:String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')};
}
function getPhase(){
 const h=getGameClock().hour;
 if(h>=5&&h<8)return '🌅 صبح';
 if(h>=8&&h<17)return '☀️ روز';
 if(h>=17&&h<20)return '🌇 غروب';
 return '🌙 شب';
}

/* نورها */
function drawLights(day){
 const darkness=1-day;
 buildings.forEach(b=>{
  const wx=b.x+42,wy=b.y+78;
  const grd=ctx.createRadialGradient(wx-camX,wy-camY,2,wx-camX,wy-camY,80);
  grd.addColorStop(0,`rgba(255,190,90,${darkness*.5})`);
  grd.addColorStop(1,'rgba(255,190,90,0)');
  ctx.fillStyle=grd;ctx.fillRect(wx-80-camX,wy-80-camY,160,160);
  if(darkness>.35){
   rect(b.x+28,b.y+58,29,39,`rgba(255,190,90,${darkness*.75})`);
   rect(b.x+b.w-57,b.y+58,29,39,`rgba(255,190,90,${darkness*.75})`);
  }
 });
 const lamps=[[500,800],[900,800],[1300,800],[1700,800],[2300,800],[1000,600],[1200,600],[1000,1100],[1200,1100],[500,1500],[1000,1500],[1500,1500],[2000,1500],[2500,1500],[500,1900],[1100,1900],[1900,1900],[2600,1900]];
 lamps.forEach(([x,y])=>{
  circle(x,y,5,'#c6a56b');
  if(darkness>.25){
   const g=ctx.createRadialGradient(x-camX,y-camY,2,x-camX,y-camY,65);
   g.addColorStop(0,`rgba(255,205,120,${darkness*.45})`);
   g.addColorStop(1,'rgba(255,205,120,0)');
   ctx.fillStyle=g;ctx.fillRect(x-65-camX,y-65-camY,130,130);
  }
 });
}

/* دود */
const smoke=Array.from({length:72},()=>({r:3+Math.random()*6,life:Math.random(),speed:.2+Math.random()*.35,drift:Math.random()*2-1}));
function drawSmoke(dt){
 buildings.forEach((b,index)=>{
  if(!b.chimney)return;
  const x=b.x+b.w-35,y=b.y-36;
  for(let i=0;i<8;i++){
   const p=smoke[index*8+i];
   p.life+=dt*p.speed*.006;
   if(p.life>1)p.life=0;
   const sway=Math.sin(gameTime*1.5+p.life*8)*12;
   circle(x+sway+p.drift*p.life*20,y-p.life*70,p.r*(.5+p.life),`rgba(190,195,190,${.18*(1-p.life)})`);
  }
 });
}

/* نور محیط */
function drawAtmosphere(day){
 const darkness=1-day;
 ctx.fillStyle=`rgba(9,18,38,${darkness*.58})`;
 ctx.fillRect(0,0,W,H);
 const h=getGameClock().hour;
 let orange=0;
 if(h>=5&&h<8)orange=1-(h-5)/3;
 if(h>=17&&h<20)orange=(h-17)/3;
 orange=Math.max(0,Math.min(1,orange));
 if(orange>0){
  ctx.fillStyle=`rgba(180,95,40,${orange*.09})`;
  ctx.fillRect(0,0,W,H);
 }
}

/* دوربین */
function updateCamera(){
 const targetX=player.x-W/2,targetY=player.y-H/2;
 camX+=(targetX-camX)*.14;camY+=(targetY-camY)*.14;
 camX=Math.max(0,Math.min(world.w-W,camX));
 camY=Math.max(0,Math.min(world.h-H,camY));
}

/* حرکت بازیکن */
function update(dt){
 if(!started)return;
 gameTime+=dt/60;
 let dx=joy.x,dy=joy.y;
 if(keys.w||keys.arrowup)dy-=1;
 if(keys.s||keys.arrowdown)dy+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;
 const length=Math.hypot(dx,dy);
 if(length>1){dx/=length;dy/=length;}
 player.moving=length>.1;

 if(player.moving){
  const speed=(running?4.5:2.5)*dt;
  player.frame+=running?.25*dt:.15*dt;
  if(Math.abs(dx)>Math.abs(dy))player.direction=dx>0?'right':'left';
  else player.direction=dy>0?'down':'up';
  const nx=player.x+dx*speed,ny=player.y+dy*speed;
  if(!playerBlocked(nx,player.y))player.x=nx;
  if(!playerBlocked(player.x,ny))player.y=ny;
 }
 player.x=Math.max(20,Math.min(world.w-20,player.x));
 player.y=Math.max(20,Math.min(world.h-20,player.y));
 updateCamera();
 npcs.forEach(n=>moveNPC(n,dt));

 near=null;let nearestDistance=75;
 for(const n of npcs){
  const d=Math.hypot(player.x-n.x,player.y-n.y);
  if(d<nearestDistance){nearestDistance=d;near=n;}
 }
}

/* تعامل */
const dialog=document.getElementById('dialog');
const who=document.getElementById('who');
const words=document.getElementById('words');
let dialogTimer=null;
function interact(){
 if(!started)return;
 if(near){who.textContent=near.name;words.textContent=near.msg;}
 else{who.textContent='شهر قدیمی';words.textContent='کسی نزدیکت نیست. کمی به مردم شهر نزدیک‌تر شو.';}
 dialog.style.display='block';
 clearTimeout(dialogTimer);
 dialogTimer=setTimeout(()=>dialog.style.display='none',6000);
}
document.getElementById('talk').addEventListener('click',interact);

/* رسم صحنه */
function visible(x,y,pad=100){
 return x>camX-pad&&x<camX+W+pad&&y>camY-pad&&y<camY+H+pad;
}
function draw(dt){
 ctx.clearRect(0,0,W,H);
 drawGround();
 trees.forEach(t=>{if(visible(t.x,t.y,60))drawTree(t);});
 buildings.forEach(b=>{if(visible(b.x+b.w/2,b.y+b.h/2,200))drawBuilding(b);});
 drawFountain();
 const day=daylight();
 drawLights(day);
 drawSmoke(dt);
 const actors=npcs.map(n=>({y:n.y,draw:()=>drawNPC(n)}));
 actors.push({y:player.y,draw:drawPlayer});
 actors.sort((a,b)=>a.y-b.y);
 actors.forEach(a=>a.draw());
 drawAtmosphere(day);
 const clock=getGameClock();
 document.getElementById('stats').innerHTML='❤️ 100<br>🪙 25<br>'+getPhase()+'<br>🕐 '+clock.text;
}

/* حلقه اصلی */
function loop(now){
 const dt=Math.min(2,(now-lastTime)/16.67);
 lastTime=now;
 update(dt);draw(dt);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
