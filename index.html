<style>

<body>
<canvas id="game"></canvas>

<div id="start">
 <div class="card">

  <button id="play">شروع ماجراجویی</button>
  <p>نسخه آزمایشی آفلاین</p>
 </div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,camX=0,camY=0,started=false;

function resize(){
 W=innerWidth;H=innerHeight;
 canvas.width=W*devicePixelRatio;
 canvas.height=H*devicePixelRatio;
 canvas.style.width=W+'px';
 canvas.style.height=H+'px';
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize',resize);
resize();

const world={w:2800,h:2300};
const player={x:1100,y:900,speed:2.5,direction:'down',moving:false,frame:0};
let keys={},joy={x:0,y:0},running=false,near=null;

/* ساختمان‌ها؛ چیدمان منظم در محله‌ها */
const buildings=[
 {x:650,y:350,w:220,h:170,name:'خانه',chimney:true},
 {x:1400,y:350,w:240,h:190,name:'مغازه',chimney:true},
 {x:2200,y:350,w:250,h:190,name:'مسافرخانه',chimney:true},

 {x:650,y:1050,w:230,h:180,name:'خانه',chimney:true},
 {x:1400,y:1050,w:250,h:200,name:'خانه',chimney:true},
 {x:2200,y:1050,w:220,h:180,name:'خانه قدیمی',chimney:true},

 {x:650,y:1740,w:230,h:180,name:'خانه جنگلی',chimney:true},
 {x:1400,y:1740,w:250,h:190,name:'کلبه',chimney:true},
 {x:2200,y:1740,w:250,h:190,name:'خانه قدیمی',chimney:true}
];

/* شبکه خیابان‌های متصل */
const roads=[
 // خیابان‌های افقی
 {x:0,y:820,w:2800,h:140},
 {x:0,y:1480,w:2800,h:140},

 // خیابان‌های عمودی
 {x:480,y:0,w:120,h:2300},
 {x:1080,y:0,w:140,h:2300},
 {x:1880,y:0,w:140,h:2300},
 {x:2580,y:0,w:120,h:2300}
];

const buildingZones=buildings.map(b=>({
 x:b.x-35,y:b.y-35,w:b.w+70,h:b.h+70
}));
const fountainZone={x:1030,y:830,w:140,h:140};

const npcs=[
 {
  x:1100,y:690,name:'مامان ادریس',
  msg:'با کونم از همه محافظت میکنم',
  color:'#9b5968',
  route:[{x:1100,y:690},{x:1120,y:790},{x:1180,y:900},{x:1080,y:900},{x:1030,y:760}]
 },
 {
  x:820,y:980,name:'ویچر',
  msg:'سلام مسافر! هرچی بخوای شاید توی مغازه پیدا بشه، البته قیمت‌ها رو خودم تعیین میکنم!',
  color:'#536c49',
  route:[{x:820,y:980},{x:760,y:980},{x:650,y:900},{x:760,y:850},{x:900,y:900}]
 },
 {
  x:1430,y:1000,name:'زئوس',
  msg:'دنبال معامله‌ای؟ من آدم مناسبی برای هر کاری هستم... البته پولت رو اول نشون بده.',
  color:'#80649b',
  route:[{x:1430,y:1000},{x:1510,y:950},{x:1550,y:850},{x:1450,y:800},{x:1400,y:900}]
 },
 {
  x:1100,y:1200,name:'تانجیرو',
  msg:'نگران نباش! تا وقتی من اینجام، اجازه نمیدم کسی به شهر آسیب بزنه.',
  color:'#365c75',
  route:[{x:1100,y:1200},{x:1180,y:1100},{x:1250,y:1000},{x:1180,y:950},{x:1100,y:1050}]
 },
 {
  x:900,y:700,name:'یاشار',
  msg:'من فقط یه شهروند عادی هستم... چیزی ندیدی، چیزی نشنیدی.',
  color:'#333b49',
  route:[{x:900,y:700},{x:850,y:750},{x:800,y:800},{x:900,y:850},{x:950,y:750}]
 },
 {
  x:1600,y:850,name:'اراد',
  msg:'سلام مسافر. من ارادم؛ این شهر پر از رازهای پنهانه. همیشه چشم‌هات رو باز نگه دار، چون بعضی اتفاق‌ها فقط یک‌بار رخ می‌دن...',
  color:'#242735',
  route:[{x:1600,y:850},{x:1650,y:900},{x:1700,y:950},{x:1600,y:1000},{x:1550,y:900}]
 },
 {
  x:2050,y:1740,name:'ممد اسموک',
  msg:'اوه... سلام رفیق. من ممد اسموکم. راستش یه مدته درگیر یه عادت بد شدم و کنار گذاشتنش برام آسون نیست. بعضی روزا حسابی گیجم... ولی دارم سعی می‌کنم اوضاعمو درست کنم. فکر کنم وقتشه از یکی کمک بگیرم.',
  color:'#292b32',
  route:[{x:2050,y:1740},{x:2110,y:1770},{x:2180,y:1740},{x:2200,y:1820},{x:2130,y:1860},{x:2050,y:1810}]
 }
];

function overlaps(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function safeTree(x,y,s){
 const box={x:x-s,y:y-s,w:s*2,h:s*2};
 if(buildingZones.some(b=>overlaps(box,b)))return false;
 if(roads.some(r=>overlaps(box,r)))return false;
 if(overlaps(box,fountainZone))return false;
 if(npcs.some(n=>Math.hypot(x-n.x,y-n.y)<100))return false;
 return true;
}

/* تعداد درخت‌ها کمتر و پخش طبیعی‌تر */
const trees=[];
for(let i=0;i<115;i++){
 for(let a=0;a<100;a++){
  let x=40+Math.random()*(world.w-80);
  let y=40+Math.random()*(world.h-80);
  let size=18+Math.random()*14;
  if(safeTree(x,y,size)){
   trees.push({x,y,size});
   break;
  }
 }
}

const obstacles=[];
buildings.forEach(b=>obstacles.push({x:b.x+8,y:b.y+20,w:b.w-16,h:b.h-20}));
trees.forEach(t=>obstacles.push({
 x:t.x-t.size*.55,y:t.y-t.size*.5,w:t.size*1.1,h:t.size*1.1
}));

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

const stick=document.getElementById('stick');
const nub=document.getElementById('nub');
let dragging=false;

function moveJoy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let d=Math.hypot(dx,dy),max=36;
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 joy.x=dx/max;joy.y=dy/max;
 nub.style.left=(35+dx)+'px';
 nub.style.top=(35+dy)+'px';
}
stick.addEventListener('pointerdown',e=>{
 e.preventDefault();dragging=true;
 stick.setPointerCapture(e.pointerId);moveJoy(e);
});
stick.addEventListener('pointermove',e=>{
 if(dragging){e.preventDefault();moveJoy(e);}
});
function stopJoy(){
 dragging=false;joy.x=joy.y=0;
 nub.style.left='35px';nub.style.top='35px';
}
stick.addEventListener('pointerup',stopJoy);
stick.addEventListener('pointercancel',stopJoy);

const runBtn=document.getElementById('run');
runBtn.addEventListener('pointerdown',e=>{
 e.preventDefault();running=true;runBtn.style.background='#a0804b';
});
function stopRun(){running=false;runBtn.style.background='#70552f';}
runBtn.addEventListener('pointerup',stopRun);
runBtn.addEventListener('pointercancel',stopRun);
runBtn.addEventListener('pointerleave',stopRun);

const settingsBtn=document.getElementById('settingsBtn');
const settingsPanel=document.getElementById('settingsPanel');
const volume=document.getElementById('volume');
const soundBtn=document.getElementById('soundBtn');

settingsBtn.onclick=()=>{
 settingsPanel.style.display=settingsPanel.style.display==='block'?'none':'block';
};
document.getElementById('closeSettings').onclick=()=>{
 settingsPanel.style.display='none';
};

/* صدا */
let audioCtx=null,masterGain=null,windGain=null;
let soundEnabled=true,audioStarted=false,birdTimer=null;

function initAudio(){
 if(audioStarted)return;
 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=volume.value/100;
  masterGain.connect(audioCtx.destination);

  windGain=audioCtx.createGain();
  windGain.gain.value=.025;
  windGain.connect(masterGain);

  const bufferSize=audioCtx.sampleRate*2;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;

  const noise=audioCtx.createBufferSource();
  noise.buffer=buffer;noise.loop=true;
  const filter=audioCtx.createBiquadFilter();
  filter.type='lowpass';filter.frequency.value=350;
  const noiseGain=audioCtx.createGain();
  noiseGain.gain.value=.4;
  noise.connect(filter);filter.connect(noiseGain);
  noiseGain.connect(windGain);noise.start();

  const hum=audioCtx.createOscillator();
  const humGain=audioCtx.createGain();
  hum.type='sine';hum.frequency.value=75;
  humGain.gain.value=.015;
  hum.connect(humGain);humGain.connect(masterGain);
  hum.start();

  audioStarted=true;
  startBirds();
 }catch(e){console.log('Audio unavailable');}
}

function daylight(){
 let t=(gameTime%dayLength)/dayLength;
 return (Math.sin(t*Math.PI*2-Math.PI/2)+1)/2;
}

function birdChirp(){
 if(!audioCtx||!soundEnabled||!started)return;
 const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 const filter=audioCtx.createBiquadFilter();
 osc.type='sine';
 filter.type='bandpass';
 filter.frequency.value=2600;
 filter.Q.value=1.2;
 const base=2200+Math.random()*500;
 const duration=.16+Math.random()*.12;
 osc.frequency.setValueAtTime(base,now);
 osc.frequency.exponentialRampToValueAtTime(base*1.35,now+duration*.45);
 osc.frequency.exponentialRampToValueAtTime(base*.9,now+duration);
 gain.gain.setValueAtTime(.0001,now);
 gain.gain.linearRampToValueAtTime(.012,now+.025);
 gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
 osc.connect(filter);filter.connect(gain);gain.connect(masterGain);
 osc.start(now);osc.stop(now+duration+.02);
}

function birdSound(){
 birdChirp();
 if(Math.random()<.45){
  setTimeout(()=>{if(soundEnabled&&started&&audioCtx)birdChirp();},180+Math.random()*180);
 }
}
function startBirds(){
 if(birdTimer)clearTimeout(birdTimer);
 function schedule(){
  if(!started||!audioCtx)return;
  if(soundEnabled&&daylight()>.55&&Math.random()<.7)birdSound();
  birdTimer=setTimeout(schedule,7000+Math.random()*8000);
 }
 schedule();
}

soundBtn.onclick=()=>{
 soundEnabled=!soundEnabled;
 if(masterGain)masterGain.gain.setTargetAtTime(soundEnabled?volume.value/100:0,audioCtx.currentTime,.2);
 soundBtn.textContent=soundEnabled?'🔊 قطع صدا':'🔇 فعال کردن صدا';
};
volume.oninput=e=>{
 if(masterGain&&soundEnabled)masterGain.gain.setTargetAtTime(e.target.value/100,audioCtx.currentTime,.1);
};

document.getElementById('play').addEventListener('click',()=>{
 started=true;
 document.getElementById('start').style.display='none';
 initAudio();
 if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
});

function rect(x,y,w,h,c){
 ctx.fillStyle=c;ctx.fillRect(x-camX,y-camY,w,h);
}
function circle(x,y,r,c){
 ctx.fillStyle=c;ctx.beginPath();
 ctx.arc(x-camX,y-camY,r,0,Math.PI*2);ctx.fill();
}

/* زمین و جاده‌ها */
function drawGround(){
 rect(0,0,world.w,world.h,'#29382f');

 for(let y=0;y<world.h;y+=80){
  for(let x=0;x<world.w;x+=80){
   if((x+y)%160===0)rect(x,y,80,80,'#2d3d32');
  }
 }

 roads.forEach(r=>{
  rect(r.x-9,r.y-9,r.w+18,r.h+18,'#403a32');
  rect(r.x,r.y,r.w,r.h,'#655747');
 });

 // سنگ‌فرش یکدست و منظم
 roads.forEach(r=>{
  const horizontal=r.w>=r.h;
  if(horizontal){
   for(let y=r.y+8;y<r.y+r.h-5;y+=34){
    for(let x=r.x+8;x<r.x+r.w-5;x+=42){
     let offset=(Math.floor((y-r.y)/34)%2)*20;
     rect(x+offset,y,28,22,'#796a57');
     rect(x+offset+29,y,3,22,'#51483c');
    }
   }
  }else{
   for(let x=r.x+8;x<r.x+r.w-5;x+=34){
    for(let y=r.y+8;y<r.y+r.h-5;y+=42){
     let offset=(Math.floor((x-r.x)/34)%2)*20;
     rect(x,y+offset,22,28,'#796a57');
     rect(x,y+offset+29,22,3,'#51483c');
    }
   }
  }
 });

 // میدان مرکزی
 circle(1100,900,100,'#746653');
 circle(1100,900,86,'#665747');
 circle(1100,900,70,'#796a57');
}

function drawTree(t){
 let{x,y,size:s}=t;
 circle(x+6,y+13,s,'#17241c');
 rect(x-5,y-3,10,25,'#5a402d');
 circle(x,y-15,s,'#1b3022');
 circle(x-10,y-24,s*.65,'#29452e');
 circle(x+10,y-24,s*.65,'#314d35');
 circle(x,y-35,s*.55,'#3a5a3d');
 circle(x-5,y-23,s*.35,'#476846');
}

function drawBuilding(b){
 rect(b.x+10,b.y+12,b.w,b.h,'#171b1c');
 rect(b.x,b.y,b.w,b.h,'#665548');
 for(let i=0;i<5;i++)rect(b.x+8,b.y+30+i*27,b.w-16,2,'#81705d');
 rect(b.x-12,b.y-20,b.w+24,38,'#392a28');
 rect(b.x+15,b.y-12,b.w-30,6,'#59403b');
 rect(b.x+25,b.y+55,35,45,'#211e1a');
 rect(b.x+b.w-60,b.y+55,35,45,'#211e1a');
 rect(b.x+28,b.y+58,29,39,'#b08c54');
 rect(b.x+b.w-57,b.y+58,29,39,'#b08c54');
 rect(b.x+b.w/2-20,b.y+b.h-65,40,65,'#35241c');
 rect(b.x+b.w/2-15,b.y+b.h-60,30,60,'#4a3023');
 if(b.chimney){
  rect(b.x+b.w-48,b.y-32,25,40,'#59463a');
  rect(b.x+b.w-53,b.y-36,35,9,'#392b26');
 }
 ctx.fillStyle='#d3c1a0';
 ctx.font='11px Tahoma';ctx.textAlign='center';
 ctx.fillText(b.name,b.x+b.w/2-camX,b.y-30-camY);
}

function drawFountain(){
 circle(1100,900,65,'#4d5147');
 circle(1100,900,48,'#77705b');
 circle(1100,900,36,'#3c5658');
 circle(1100,900,12,'#9a8a66');
 circle(1100,900,70,'#92816b');
 circle(1100,900,62,'#4d5147');
}

function drawNPC(n){
 let walk=n.walk||0;
 let step=n.moving?Math.sin(walk)*3:0;
 circle(n.x,n.y+10,11,'#111');
 rect(n.x-7+step,n.y+14,5,10,'#292d35');
 rect(n.x+2-step,n.y+14,5,10,'#292d35');
 circle(n.x,n.y,9,'#b98c69');
 rect(n.x-8,n.y+8,16,20,n.color||'#7c5360');
 rect(n.x-13,n.y+10,4,12,'#c49a78');
 rect(n.x+9,n.y+10,4,12,'#c49a78');
 ctx.fillStyle='#f3dca5';
 ctx.font='12px Tahoma';ctx.textAlign='center';
 ctx.fillText(n.name,n.x-camX,n.y-28-camY);
 if(Math.hypot(player.x-n.x,player.y-n.y)<85){
  ctx.fillStyle='#fff';ctx.font='12px Tahoma';
  ctx.fillText('تعامل',n.x-camX,n.y-43-camY);
 }
}

function drawPlayer(){
 let x=player.x,y=player.y;
 let walk=player.moving?Math.sin(player.frame)*4:0;
 circle(x,y+14,12,'#101010');
 rect(x-8+walk,y+14,6,12,'#292d35');
 rect(x+2-walk,y+14,6,12,'#292d35');
 rect(x-10,y-3,20,22,'#334b68');
 rect(x-8,y+2,16,13,'#415e7f');
 rect(x-13,y+2,4,12,'#c49a78');
 rect(x+9,y+2,4,12,'#c49a78');
 circle(x,y-11,10,'#d3a17d');
 rect(x-10,y-20,20,6,'#30241f');
 if(player.direction==='left')rect(x-11,y-15,5,8,'#30241f');
 if(player.direction==='right')rect(x+6,y-15,5,8,'#30241f');
 ctx.fillStyle='#e5d5b6';ctx.font='12px Tahoma';ctx.textAlign='center';
 ctx.fillText('تو',x-camX,y-35-camY);
}

function collide(x,y){
 let r=12;
 return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}

function moveNPC(n,dt){
 if(!n.route||!n.route.length)return;
 if(n.target===undefined)n.target=0;
 let p=n.route[n.target];
 let dx=p.x-n.x,dy=p.y-n.y,d=Math.hypot(dx,dy);
 if(d<8){
  n.target=(n.target+1)%n.route.length;
  n.pause=30+Math.random()*70;n.moving=false;return;
 }
 if(n.pause>0){n.pause-=dt;n.moving=false;return;}
 let speed=.42*dt;
 if(speed>d)speed=d;
 let nx=n.x+dx/d*speed,ny=n.y+dy/d*speed;
 if(!collide(nx,n.y)&&!collide(nx,ny)){
  n.x=nx;n.y=ny;n.moving=true;n.walk=(n.walk||0)+dt*.08;
 }else{
  n.target=(n.target+1)%n.route.length;
  n.pause=15;n.moving=false;
 }
}

/* ساعت و نور */
let gameTime=0;
const dayLength=240;
let smoke=[];
for(let i=0;i<40;i++){
 smoke.push({x:0,y:0,r:3+Math.random()*6,life:Math.random(),speed:.2+Math.random()*.35,drift:Math.random()*2-1});
}

function getGameClock(){
 let totalMinutes=(360+(gameTime/dayLength)*1440)%1440;
 let hour=Math.floor(totalMinutes/60);
 let minute=Math.floor(totalMinutes%60);
 return{hour,minute,text:String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')};
}
function getPhase(){
 const c=getGameClock();
 if(c.hour>=5&&c.hour<8)return '🌅 صبح';
 if(c.hour>=8&&c.hour<17)return '☀️ روز';
 if(c.hour>=17&&c.hour<20)return '🌇 غروب';
 return '🌙 شب';
}

function drawLights(day){
 let darkness=1-day;
 buildings.forEach(b=>{
  let wx=b.x+28,wy=b.y+58;
  let grd=ctx.createRadialGradient(wx-camX,wy-camY,2,wx-camX,wy-camY,80);
  grd.addColorStop(0,`rgba(255,190,90,${darkness*.5})`);
  grd.addColorStop(1,'rgba(255,190,90,0)');
  ctx.fillStyle=grd;
  ctx.fillRect(wx-80-camX,wy-80-camY,160,160);
  if(darkness>.35){
   rect(b.x+28,b.y+58,29,39,`rgba(255,190,90,${darkness*.75})`);
   rect(b.x+b.w-57,b.y+58,29,39,`rgba(255,190,90,${darkness*.75})`);
  }
 });
 const lamps=[
  [500,800],[900,800],[1300,800],[1700,800],[2300,800],
  [1000,600],[1200,600],[1000,1100],[1200,1100],
  [500,1500],[1000,1500],[1500,1500],[2000,1500],[2500,1500],
  [500,1900],[1100,1900],[1900,1900],[2600,1900]
 ];
 lamps.forEach(([x,y])=>{
  circle(x,y,5,'#c6a56b');
  if(darkness>.25){
   let g=ctx.createRadialGradient(x-camX,y-camY,2,x-camX,y-camY,65);
   g.addColorStop(0,`rgba(255,205,120,${darkness*.45})`);
   g.addColorStop(1,'rgba(255,205,120,0)');
   ctx.fillStyle=g;ctx.fillRect(x-65-camX,y-65-camY,130,130);
  }
 });
}

function drawSmoke(dt){
 buildings.filter(b=>b.chimney).forEach(b=>{
  let x=b.x+b.w-35,y=b.y-36;
  for(let i=0;i<8;i++){
   let p=smoke[(buildings.indexOf(b)*8+i)%smoke.length];
   p.life+=dt*p.speed*.006;
   if(p.life>1)p.life=0;
   let sway=Math.sin(gameTime*1.5+p.life*8)*12;
   let sx=x+sway+p.drift*p.life*20;
   let sy=y-p.life*70;
   let alpha=.18*(1-p.life);
   circle(sx,sy,p.r*(.5+p.life),`rgba(190,195,190,${alpha})`);
  }
 });
}

function drawAtmosphere(day){
 let darkness=1-day;
 ctx.fillStyle=`rgba(9,18,38,${darkness*.58})`;
 ctx.fillRect(0,0,W,H);
 let clock=getGameClock(),orange=0;
 if(clock.hour>=5&&clock.hour<8)orange=1-(clock.hour-5)/3;
 if(clock.hour>=17&&clock.hour<20)orange=(clock.hour-17)/3;
 orange=Math.max(0,Math.min(1,orange));
 if(orange>0){
  ctx.fillStyle=`rgba(180,95,40,${orange*.09})`;
  ctx.fillRect(0,0,W,H);
 }
}

function update(dt){
 if(!started)return;
 gameTime+=dt/60;
 let dx=joy.x,dy=joy.y;
 if(keys.w||keys.arrowup)dy-=1;
 if(keys.s||keys.arrowdown)dy+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;
 let length=Math.hypot(dx,dy);
 if(length>1){dx/=length;dy/=length;}
 player.moving=length>.1;
 let speed=running?4.5:2.5;
 if(player.moving){
  player.frame+=running?.25:.15;
  if(Math.abs(dx)>Math.abs(dy))player.direction=dx>0?'right':'left';
  else player.direction=dy>0?'down':'up';
  let nx=player.x+dx*speed*dt,ny=player.y+dy*speed*dt;
  if(!collide(nx,player.y))player.x=nx;
  if(!collide(player.x,ny))player.y=ny;
 }
 player.x=Math.max(20,Math.min(world.w-20,player.x));
 player.y=Math.max(20,Math.min(world.h-20,player.y));
 camX+=(player.x-W/2-camX)*.12;
 camY+=(player.y-H/2-camY)*.12;
 camX=Math.max(0,Math.min(world.w-W,camX));
 camY=Math.max(0,Math.min(world.h-H,camY));
 npcs.forEach(n=>moveNPC(n,dt));
 near=null;
 for(let n of npcs){
  if(Math.hypot(player.x-n.x,player.y-n.y)<75){near=n;break;}
 }
}

function interact(){
 document.getElementById('who').textContent=near?near.name:'';
 document.getElementById('words').textContent=near?near.msg:'کسی نزدیکت نیست. کمی در شهر بگرد.';
 let d=document.getElementById('dialog');
 d.style.display='block';
 clearTimeout(window.dialogTimer);
 window.dialogTimer=setTimeout(()=>{d.style.display='none';},6000);
}
document.getElementById('talk').addEventListener('click',interact);

function draw(dt){
 ctx.clearRect(0,0,W,H);
 drawGround();
 trees.forEach(drawTree);
 buildings.forEach(drawBuilding);
 drawFountain();
 let day=daylight();
 drawLights(day);
 drawSmoke(dt);
 npcs.forEach(drawNPC);
 drawPlayer();
 drawAtmosphere(day);
 let clock=getGameClock();
 document.getElementById('stats').innerHTML='❤️ 100<br>🪙 25<br>'+getPhase()+'<br>🕐 '+clock.text;
}

let last=performance.now();
function loop(now){
 let dt=Math.min(2,(now-last)/16.67);
 last=now;
 update(dt);
 draw(dt);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
