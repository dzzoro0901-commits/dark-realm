<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DARK REALM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#18251e;
 overflow:hidden;
 font-family:Tahoma;
 color:white;
 touch-action:none
}
canvas{
 display:block;
 width:100vw;
 height:100vh
}
#ui{
 position:fixed;
 inset:0;
 pointer-events:none
}
.panel{
 background:#101827e8;
 border:1px solid #9b895d;
 border-radius:12px;
 padding:10px
}
#top{
 position:absolute;
 top:12px;
 left:12px;
 right:12px;
 display:flex;
 justify-content:space-between
}
#title{
 font-size:17px;
 color:#d8bd83;
 font-weight:bold
}
#stats{
 font-size:12px;
 line-height:1.8
}
#hint{
 position:absolute;
 top:80px;
 left:50%;
 transform:translateX(-50%);
 background:#101827dd;
 padding:8px 12px;
 border-radius:20px;
 font-size:11px;
 white-space:nowrap
}
#controls{
 position:absolute;
 bottom:20px;
 left:18px;
 right:18px;
 display:flex;
 justify-content:space-between;
 align-items:end;
 pointer-events:auto;
}
#stick{
 width:120px;
 height:120px;
 border:2px solid #ffffff66;
 background:#ffffff20;
 border-radius:50%;
 position:relative;
 touch-action:none;
}
#nub{
 position:absolute;
 left:35px;
 top:35px;
 width:46px;
 height:46px;
 border-radius:50%;
 background:#c5cbd377;
 border:2px solid #fff;
 pointer-events:none;
}
#buttons{
 display:flex;
 gap:12px;
 align-items:end
}
.action{
 border-radius:50%;
 background:#70552f;
 border:2px solid #e0bd7c;
 color:white;
 font-weight:bold;
 touch-action:none;
 user-select:none;
 -webkit-user-select:none;
}
#run{
 width:65px;
 height:65px;
 font-size:12px
}
#talk{
 width:75px;
 height:75px;
 font-size:13px
}
#dialog{
 display:none;
 position:absolute;
 bottom:125px;
 left:5%;
 width:90%;
 background:#101827f2;
 border:1px solid #d0ae70;
 border-radius:14px;
 padding:16px;
 text-align:center;
 line-height:1.8;
 pointer-events:auto
}
#who{
 color:#e3c78f;
 font-weight:bold
}
#start{
 position:fixed;
 inset:0;
 background:#090e19ed;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px;
 pointer-events:auto;
 z-index:10
}
.card{
 background:#131d2c;
 border:1px solid #a88e5d;
 border-radius:20px;
 padding:28px;
 max-width:420px
}
h1{
 color:#d6bd8a;
 letter-spacing:3px
}
p{
 font-size:13px;
 line-height:2;
 color:#c4cbd4
}
#play{
 background:#9a7947;
 color:white;
 border:0;
 border-radius:12px;
 padding:14px 35px;
 font-size:15px;
 font-weight:bold;
 touch-action:manipulation
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

<div id="top">
 <div class="panel">
  <div id="title">DARK REALM</div>
  <small>THE OLD TOWN</small>
 </div>

 <div class="panel" id="stats">
  ❤️ 100<br>
  🪙 25
 </div>
</div>

<div id="hint">در شهر حرکت کن و با مردم صحبت کن</div>

<div id="controls">

 <div id="stick">
  <div id="nub"></div>
 </div>

 <div id="buttons">
  <button class="action" id="run">دویدن</button>
  <button class="action" id="talk">تعامل</button>
 </div>

</div>

<div id="dialog">
 <div id="who"></div>
 <div id="words"></div>
</div>

</div>

<div id="start">
 <div class="card">
  <h1>DARK REALM</h1>
  <div style="color:#b9a47c">THE OLD TOWN</div>

  <p>
   به شهر قدیمی خوش آمدی.<br>
   در کوچه‌ها بگرد، با مردم شهر حرف بزن و رازهای این سرزمین را کشف کن.
  </p>

  <button id="play">شروع ماجراجویی</button>

  <p>نسخه آزمایشی آفلاین</p>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let camX=0;
let camY=0;
let started=false;

function resize(){
 W=innerWidth;
 H=innerHeight;
 canvas.width=W*devicePixelRatio;
 canvas.height=H*devicePixelRatio;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",resize);
resize();

const world={w:2200,h:1800};

const player={
 x:1100,
 y:900,
 speed:2.5,
 direction:"down",
 moving:false,
 frame:0
};

let keys={};
let joy={x:0,y:0};
let running=false;
let near=null;

/* ساختمان ها */

const buildings=[
 {x:620,y:430,w:220,h:170,name:"خانه"},
 {x:1370,y:420,w:240,h:190,name:"مغازه"},
 {x:480,y:1150,w:230,h:180,name:"خانه"},
 {x:1510,y:1170,w:250,h:200,name:"خانه"},
 {x:930,y:250,w:240,h:170,name:"تالار"}
];

/* خیابان ها */

const roads=[
 {x:0,y:830,w:2200,h:140},
 {x:1030,y:0,w:140,h:1800},

 /* کوچه های فرعی */

 {x:700,y:600,w:100,h:250},
 {x:1450,y:600,w:100,h:250},
 {x:570,y:960,w:100,h:220},
 {x:1600,y:960,w:100,h:220},
 {x:1050,y:420,w:100,h:410}
];

/* محدوده ساختمان ها برای جلوگیری از درخت */

const buildingZones=buildings.map(b=>({
 x:b.x-45,
 y:b.y-45,
 w:b.w+90,
 h:b.h+90
}));

/* محل میدان */

const fountainZone={
 x:1030,
 y:830,
 w:140,
 h:140
};

/* NPC ها */

const npcs=[
 {
  x:1100,
  y:690,
  name:"مامان ادی | نگهبان شهر",
  msg:"با کونم از همه محافظت میکنم"
 },
 {
  x:820,
  y:980,
  name:"ویچر | فروشنده",
  msg:"به‌زودی چیزهای جالبی برای فروش می‌آورم."
 },
 {
  x:1430,
  y:1000,
  name:"زئوس | مسافر مرموز",
  msg:"اگر دنبال راز این شهر هستی، از خرابه‌های شرقی شروع کن."
 },
 {
  x:1100,
  y:1200,
  name:"اراد | دهقان پیر",
  msg:"این شهر روزگاری قلب یک پادشاهی بزرگ بود..."
 }
];

/* درخت ها با محل امن */

const trees=[];

function overlaps(a,b){
 return a.x<b.x+b.w&&
        a.x+a.w>b.x&&
        a.y<b.y+b.h&&
        a.y+a.h>b.y;
}

function isTreeLocationSafe(x,y,size){

 const treeBox={
  x:x-size,
  y:y-size,
  w:size*2,
  h:size*2
 };

 /* ساختمان */

 for(const b of buildingZones){
  if(overlaps(treeBox,b))return false;
 }

 /* جاده */

 for(const r of roads){
  if(overlaps(treeBox,r))return false;
 }

 /* میدان */

 if(overlaps(treeBox,fountainZone))return false;

 /* بازیکن */

 if(Math.hypot(x-player.x,y-player.y)<150)return false;

 /* NPC */

 for(const n of npcs){
  if(Math.hypot(x-n.x,y-n.y)<100)return false;
 }

 return true;
}

for(let i=0;i<125;i++){

 let attempts=0;

 while(attempts<80){

  attempts++;

  let x=40+Math.random()*(world.w-80);
  let y=40+Math.random()*(world.h-80);
  let size=18+Math.random()*14;

  if(isTreeLocationSafe(x,y,size)){
   trees.push({x,y,size});
   break;
  }
 }
}

/* موانع */

const obstacles=[];

buildings.forEach(b=>{
 obstacles.push({
  x:b.x+8,
  y:b.y+20,
  w:b.w-16,
  h:b.h-20
 });
});

trees.forEach(t=>{
 obstacles.push({
  x:t.x-t.size*.55,
  y:t.y-t.size*.5,
  w:t.size*1.1,
  h:t.size*1.1
 });
});

/* کنترل کیبورد */

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

/* جوی استیک */

const stick=document.getElementById("stick");
const nub=document.getElementById("nub");

let dragging=false;

function moveJoy(e){

 const r=stick.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 let d=Math.hypot(dx,dy);
 let max=36;

 if(d>max){
  dx=dx/d*max;
  dy=dy/d*max;
 }

 joy.x=dx/max;
 joy.y=dy/max;

 nub.style.left=(35+dx)+"px";
 nub.style.top=(35+dy)+"px";
}

stick.addEventListener("pointerdown",e=>{
 e.preventDefault();
 dragging=true;
 stick.setPointerCapture(e.pointerId);
 moveJoy(e);
});

stick.addEventListener("pointermove",e=>{
 if(dragging){
  e.preventDefault();
  moveJoy(e);
 }
});

function stopJoy(){
 dragging=false;
 joy.x=0;
 joy.y=0;
 nub.style.left="35px";
 nub.style.top="35px";
}

stick.addEventListener("pointerup",stopJoy);
stick.addEventListener("pointercancel",stopJoy);

/* دویدن */

const runBtn=document.getElementById("run");

runBtn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 running=true;
 runBtn.style.background="#a0804b";
});

function stopRun(){
 running=false;
 runBtn.style.background="#70552f";
}

runBtn.addEventListener("pointerup",stopRun);
runBtn.addEventListener("pointercancel",stopRun);
runBtn.addEventListener("pointerleave",stopRun);

/* شروع */

document.getElementById("play").addEventListener("click",()=>{
 started=true;
 document.getElementById("start").style.display="none";
});

/* ابزار رسم */

function rect(x,y,w,h,c){
 ctx.fillStyle=c;
 ctx.fillRect(x-camX,y-camY,w,h);
}

function circle(x,y,r,c){
 ctx.fillStyle=c;
 ctx.beginPath();
 ctx.arc(x-camX,y-camY,r,0,Math.PI*2);
 ctx.fill();
}

/* زمین */

function drawGround(){

 rect(0,0,world.w,world.h,"#29382f");

 /* بافت زمین */

 for(let y=0;y<world.h;y+=80){
  for(let x=0;x<world.w;x+=80){

   if((x+y)%160===0){
    rect(x,y,80,80,"#2d3d32");
   }
  }
 }

 /* حاشیه خیابان ها */

 roads.forEach(r=>{
  rect(r.x-8,r.y-8,r.w+16,r.h+16,"#403a32");
 });

 /* خیابان */

 roads.forEach(r=>{
  rect(r.x,r.y,r.w,r.h,"#655747");
 });

 /* سنگ های خیابان اصلی */

 for(let x=0;x<world.w;x+=44){
  rect(x,850,38,18,"#796a57");
  rect(x+20,892,38,18,"#796a57");
  rect(x,934,38,18,"#796a57");
 }

 for(let y=0;y<world.h;y+=44){
  rect(1050,y,18,38,"#796a57");
  rect(1095,y+20,18,38,"#796a57");
  rect(1140,y,18,38,"#796a57");
 }

 /* سنگ فرش کوچه ها */

 roads.forEach(r=>{

  if(r.w<200){

   for(let y=r.y;y<r.y+r.h;y+=36){
    rect(r.x+8,y,20,28,"#746553");
    rect(r.x+42,y+12,20,28,"#796a57");
   }

  }else{

   for(let x=r.x;x<r.x+r.w;x+=40){
    rect(x,r.y+10,28,20,"#746553");
    rect(x+15,r.y+45,28,20,"#796a57");
   }

  }

 });

 /* محل اتصال کوچه ها */

 circle(1100,900,100,"#746653");
 circle(1100,900,86,"#665747");
 circle(1100,900,70,"#796a57");

}

/* درخت */

function drawTree(t){

 const x=t.x;
 const y=t.y;
 const s=t.size;

 /* سایه */

 circle(x+6,y+13,s,"#17241c");

 /* تنه */

 rect(x-5,y-3,10,25,"#5a402d");

 /* برگ */

 circle(x,y-15,s,"#1b3022");
 circle(x-10,y-24,s*.65,"#29452e");
 circle(x+10,y-24,s*.65,"#314d35");
 circle(x,y-35,s*.55,"#3a5a3d");

 /* نور برگ */

 circle(x-5,y-23,s*.35,"#476846");

}

/* ساختمان */

function drawBuilding(b){

 /* سایه */

 rect(b.x+10,b.y+12,b.w,b.h,"#171b1c");

 /* دیوار */

 rect(b.x,b.y,b.w,b.h,"#665548");

 /* بافت دیوار */

 for(let i=0;i<5;i++){
  rect(b.x+8,b.y+30+i*27,b.w-16,2,"#81705d");
 }

 /* سقف */

 rect(b.x-12,b.y-20,b.w+24,38,"#392a28");

 rect(b.x+15,b.y-12,b.w-30,6,"#59403b");

 /* پنجره ها */

 rect(b.x+25,b.y+55,35,45,"#211e1a");
 rect(b.x+b.w-60,b.y+55,35,45,"#211e1a");

 rect(b.x+28,b.y+58,29,39,"#b08c54");
 rect(b.x+b.w-57,b.y+58,29,39,"#b08c54");

 /* در */

 rect(b.x+b.w/2-20,b.y+b.h-65,40,65,"#35241c");
 rect(b.x+b.w/2-15,b.y+b.h-60,30,60,"#4a3023");

 /* برچسب */

 ctx.fillStyle="#d3c1a0";
 ctx.font="11px Tahoma";
 ctx.textAlign="center";

 ctx.fillText(
  b.name,
  b.x+b.w/2-camX,
  b.y-30-camY
 );

}

/* میدان */

function drawFountain(){

 circle(1100,900,65,"#4d5147");
 circle(1100,900,48,"#77705b");
 circle(1100,900,36,"#3c5658");
 circle(1100,900,12,"#9a8a66");

 /* حاشیه */

 circle(1100,900,70,"#92816b");
 circle(1100,900,62,"#4d5147");

}

/* NPC */

function drawNPC(n){

 /* سایه */

 circle(n.x,n.y+10,11,"#111");

 /* سر */

 circle(n.x,n.y,9,"#b98c69");

 /* لباس */

 rect(n.x-8,n.y+8,16,20,"#7c5360");

 /* دست ها */

 rect(n.x-13,n.y+10,4,12,"#c49a78");
 rect(n.x+9,n.y+10,4,12,"#c49a78");

 /* اسم */

 ctx.fillStyle="#f3dca5";
 ctx.font="12px Tahoma";
 ctx.textAlign="center";

 ctx.fillText(
  n.name,
  n.x-camX,
  n.y-28-camY
 );

 if(Math.hypot(player.x-n.x,player.y-n.y)<85){

  ctx.fillStyle="#fff";
  ctx.font="12px Tahoma";

  ctx.fillText(
   "تعامل",
   n.x-camX,
   n.y-43-camY
  );
 }
}

/* بازیکن */

function drawPlayer(){

 let x=player.x;
 let y=player.y;

 let walk=player.moving?Math.sin(player.frame)*4:0;

 /* سایه */

 circle(x,y+14,12,"#101010");

 /* پاها */

 rect(x-8+walk,y+14,6,12,"#292d35");
 rect(x+2-walk,y+14,6,12,"#292d35");

 /* بدن */

 rect(x-10,y-3,20,22,"#334b68");
 rect(x-8,y+2,16,13,"#415e7f");

 /* دست */

 rect(x-13,y+2,4,12,"#c49a78");
 rect(x+9,y+2,4,12,"#c49a78");

 /* سر */

 circle(x,y-11,10,"#d3a17d");

 /* مو */

 rect(x-10,y-20,20,6,"#30241f");

 if(player.direction==="left"){
  rect(x-11,y-15,5,8,"#30241f");
 }

 if(player.direction==="right"){
  rect(x+6,y-15,5,8,"#30241f");
 }

 ctx.fillStyle="#e5d5b6";
 ctx.font="12px Tahoma";
 ctx.textAlign="center";

 ctx.fillText(
  "تو",
  x-camX,
  y-35-camY
 );

}

/* برخورد */

function collide(x,y){

 let r=12;

 for(let o of obstacles){

  if(
   x+r>o.x&&
   x-r<o.x+o.w&&
   y+r>o.y&&
   y-r<o.y+o.h
  ){
   return true;
  }
 }

 return false;
}

/* حرکت */

function update(){

 if(!started)return;

 let dx=joy.x;
 let dy=joy.y;

 if(keys.w||keys.arrowup)dy-=1;
 if(keys.s||keys.arrowdown)dy+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;

 let length=Math.hypot(dx,dy);

 if(length>1){
  dx/=length;
  dy/=length;
 }

 player.moving=length>0.1;

 let speed=running?4.5:2.5;

 if(player.moving){

  player.frame+=running?.25:.15;

  if(Math.abs(dx)>Math.abs(dy)){
   player.direction=dx>0?"right":"left";
  }else{
   player.direction=dy>0?"down":"up";
  }

  let nx=player.x+dx*speed;
  let ny=player.y+dy*speed;

  if(!collide(nx,player.y))player.x=nx;
  if(!collide(player.x,ny))player.y=ny;
 }

 player.x=Math.max(20,Math.min(world.w-20,player.x));
 player.y=Math.max(20,Math.min(world.h-20,player.y));

 /* دوربین */

 camX+=(player.x-W/2-camX)*.12;
 camY+=(player.y-H/2-camY)*.12;

 camX=Math.max(0,Math.min(world.w-W,camX));
 camY=Math.max(0,Math.min(world.h-H,camY));

 /* NPC نزدیک */

 near=null;

 for(let n of npcs){

  if(Math.hypot(player.x-n.x,player.y-n.y)<75){
   near=n;
   break;
  }
 }
}

/* تعامل */

function interact(){

 document.getElementById("who").textContent=
  near?near.name:"";

 document.getElementById("words").textContent=
  near?near.msg:"کسی نزدیکت نیست. کمی در شهر بگرد.";

 const dialog=document.getElementById("dialog");

 dialog.style.display="block";

 clearTimeout(window.dialogTimer);

 window.dialogTimer=setTimeout(()=>{
  dialog.style.display="none";
 },4000);
}

document.getElementById("talk").addEventListener("click",interact);

/* رسم */

function draw(){

 ctx.clearRect(0,0,W,H);

 /* زمین و خیابان */

 drawGround();

 /* درخت ها */

 trees.forEach(drawTree);

 /* ساختمان ها */

 buildings.forEach(drawBuilding);

 /* میدان */

 drawFountain();

 /* NPC */

 npcs.forEach(drawNPC);

 /* بازیکن */

 drawPlayer();

}

/* حلقه */

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
