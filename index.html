 {x:1430,y:1000,name:'زئوس',msg:'در آهنگری همیشه کار پیدا می‌شود.',color:'#80649b',job:'آهنگری',personality:'سخت‌کوش'},

 {x:900,y:700,name:'یاشار',msg:'زندگی در این شهر آرام است.',color:'#333b49',job:'پیک شهری',personality:'شوخ‌طبع'},

const dungeon={x:3500,y:1900,w:260,h:210,name:'سیاه‌چال فراموش‌شده',inside:false};
const trees=[];
function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function safeTree(x,y,s){
 const box={x:x-s,y:y-s,w:s*2,h:s*2};
 if(buildingZones.some(b=>overlaps(box,b))||roads.some(r=>overlaps(box,r))||overlaps(box,fountainZone)||regions.some(r=>overlaps(box,r)))return false;
 if(npcs.some(n=>Math.hypot(x-n.x,y-n.y)<100))return false;
 return true;
}
for(let i=0;i<65;i++)for(let a=0;a<80;a++){let x=40+Math.random()*2720,y=40+Math.random()*2220,s=18+Math.random()*14;if(safeTree(x,y,s)){trees.push({x,y,size:s});break}}
const obstacles=[];
buildings.forEach(b=>obstacles.push({x:b.x+8,y:b.y+20,w:b.w-16,h:b.h-20}));
trees.forEach(t=>obstacles.push({x:t.x-t.size*.55,y:t.y-t.size*.5,w:t.size*1.1,h:t.size*1.1}));
const enemies=[],projectiles=[],enemyProjectiles=[];
function regionAt(x,y){return regions.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)||null}
function collide(x,y){const r=12;return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
const enemySpecs={
 forest:[{shape:'wolf',name:'گرگ سایه‌جنگل',color:'#739b55',hp:58,speed:.58,damage:9,reward:22,xp:22},{shape:'treant',name:'نگهبان ریشه',color:'#63834b',hp:95,speed:.25,damage:16,reward:35,xp:30},{shape:'archer',name:'کماندار جنگلی',color:'#a2bd65',hp:52,speed:.32,damage:11,reward:28,xp:25,ranged:true}],
 cave:[{shape:'spider',name:'عنکبوت بلورین',color:'#6ec5d7',hp:68,speed:.48,damage:12,reward:30,xp:28},{shape:'golem',name:'غول سنگی',color:'#718da0',hp:135,speed:.2,damage:20,reward:48,xp:38},{shape:'bat',name:'خفاش غار',color:'#8a9ebc',hp:48,speed:.72,damage:9,reward:24,xp:24}],
 ice:[{shape:'icewolf',name:'گرگ یخی',color:'#b9e8f3',hp:88,speed:.62,damage:16,reward:38,xp:34},{shape:'icemage',name:'جادوگر برف',color:'#8bd3e6',hp:72,speed:.3,damage:15,reward:42,xp:36,ranged:true},{shape:'icegiant',name:'غول یخ‌زده',color:'#d4f1f5',hp:155,speed:.19,damage:23,reward:55,xp:45}],
 ruins:[{shape:'skeleton',name:'اسکلت باستانی',color:'#c6b58e',hp:100,speed:.38,damage:18,reward:48,xp:40},{shape:'sentinel',name:'نگهبان معبد',color:'#b18c58',hp:145,speed:.24,damage:22,reward:58,xp:48},{shape:'ancientmage',name:'جادوگر کهن',color:'#d0a86a',hp:85,speed:.3,damage:17,reward:52,xp:45,ranged:true}],
 castle:[{shape:'knight',name:'شوالیه تاریکی',color:'#9b76bd',hp:175,speed:.34,damage:23,reward:70,xp:55},{shape:'darkmage',name:'جادوگر سایه',color:'#b38ad5',hp:115,speed:.3,damage:20,reward:65,xp:52,ranged:true},{shape:'demon',name:'فرمانده اهریمنی',color:'#a34d75',hp:460,speed:.25,damage:28,reward:180,xp:130,boss:true}]
};
function spawnEnemy(region,spec){
 const list=enemySpecs[region.id]||[];spec=spec||list[Math.floor(Math.random()*list.length)];if(!spec||spec.boss&&game.bossDefeated||spec.boss&&enemies.some(e=>e.alive&&e.boss))return;
 const margin=100,x=region.x+margin+Math.random()*(region.w-margin*2),y=region.y+margin+Math.random()*(region.h-margin*2);
 enemies.push({x,y,hp:spec.hp,maxHp:spec.hp,alive:true,phase:Math.random()*6,hit:0,touchCooldown:0,regionId:region.id,type:region.id,shape:spec.shape,color:spec.color,name:spec.name,reward:spec.reward,xpReward:spec.xp,speed:spec.speed,damage:spec.damage,ranged:!!spec.ranged,boss:!!spec.boss,attackCooldown:90+Math.random()*60});
}
function spawnSlime(){
 const spots=[[150,250,900,500],[1800,200,850,500],[100,1650,1000,500],[1800,1650,850,500]],s=spots[Math.floor(Math.random()*spots.length)];

}

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e'||e.key==='E')interact();if(e.key==='Escape')closeMenu();if(e.key===' ')shoot()});

const stick=document.getElementById('stick'),nub=document.getElementById('nub');let dragging=false;
function moveJoy(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),max=32;if(d>max){dx=dx/d*max;dy=dy/d*max}joy.x=dx/max;joy.y=dy/max;nub.style.left=(29+dx)+'px';nub.style.top=(29+dy)+'px'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;stick.setPointerCapture(e.pointerId);moveJoy(e)});
stick.addEventListener('pointermove',e=>{if(dragging)moveJoy(e)});
function stopJoy(){dragging=false;joy.x=joy.y=0;nub.style.left='29px';nub.style.top='29px'}

function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=.35;masterGain.connect(audioCtx.destination)}catch(e){}}
function tone(freq,duration,type='sine',vol=.04){if(!audioCtx||!soundEnabled)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(masterGain);o.start(now);o.stop(now+duration)}

function drawLighting(){
 const t=(gameTime%240)/240,day=(Math.sin(t*Math.PI*2-Math.PI/2)+1)/2;
 ctx.fillStyle=`rgba(9,18,38,${(1-day)*.48})`;ctx.fillRect(0,0,W,H);

}
function drawWeather(){
 if(weather==='clear')return;
 ctx.strokeStyle=weather==='snow'?'#e6f4ff':'#a9c7dc';ctx.lineWidth=1.2;
 for(let i=0;i<35;i++){
  const x=(i*83+performance.now()*.07)%W,y=(i*47+performance.now()*(weather==='snow'?.025:.25))%H;
  if(weather==='rain'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+10);ctx.stroke()}
  else if(weather==='snow'){ctx.fillStyle='#e8f4ff';ctx.fillRect(x,y,3,3)}
 }
}

const gameMenu=document.getElementById('gameMenu'),menuTitle=document.getElementById('menuTitle'),menuBody=document.getElementById('menuBody'),menuActions=document.getElementById('menuActions');
function openMenu(title,body,actions=[]){
 menuTitle.textContent=title;menuBody.innerHTML=body;menuActions.innerHTML='';
 actions.forEach(a=>{const b=document.createElement('button');b.textContent=a.label;b.dataset.action=a.action;if(a.secondary)b.className='secondary';menuActions.appendChild(b)});
 gameMenu.style.display='flex';
}
function closeMenu(){gameMenu.style.display='none'}
document.getElementById('closeMenu').onclick=closeMenu;
function notify(t,m){openMenu(t,m,[{label:'باشه',action:'close'}])}
function itemRow(n,c){return `<div class="itemRow"><span>${n}</span><b>${c}</b></div>`}
function showInventory(){
 let body=`<div>🪙 سکه: ${game.coins}</div><div>❤️ سلامتی: ${game.health}/${game.maxHealth}</div><div>✨ سطح: ${game.level} | تجربه: ${game.xp}/${game.level*50}</div><div>🔫 مهمات: ${game.ammo}/${game.maxAmmo}</div><hr>`;
 Object.keys(game.inventory).forEach(k=>body+=itemRow(k,game.inventory[k]));
 body+=`<hr><div>سلاح: ${game.weapon?'مجهز':'نداری'}</div><div>🏰 خزانه: ${game.treasury}</div><div>🛡 نگهبان‌ها: ${game.guards}</div>`;
 openMenu('🎒 کیف و تجهیزات',body,[{label:'پر کردن خشاب - ۳ سکه',action:'reload'},{label:'استفاده از معجون',action:'potion'},{label:'ذخیره بازی',action:'save'}]);
}
function showCustomization(){
 let body=`<p>لباس:</p>${outfits.map((o,i)=>`<button class="choice" data-custom="outfit" data-value="${i}">${o.name}</button>`).join('')}<p>رنگ مو:</p>${hairs.map((o,i)=>`<button class="choice" data-custom="hair" data-value="${i}">${o}</button>`).join('')}<p>شنل:</p>${cloakColors.map((o,i)=>`<button class="choice" data-custom="cloak" data-value="${i}">${o}</button>`).join('')}<p>کلاه:</p>${hatNames.map((o,i)=>`<button class="choice" data-custom="hat" data-value="${i}">${o}</button>`).join('')}<p>کفش:</p>${bootNames.map((o,i)=>`<button class="choice" data-custom="boot" data-value="${i}">${o}</button>`).join('')}`;
 openMenu('🎨 شخصی‌سازی شخصیت',body,[{label:'ذخیره ظاهر',action:'save'}]);
}
menuBody.addEventListener('click',e=>{const b=e.target.closest('[data-custom]');if(!b)return;const key=b.dataset.custom,val=Number(b.dataset.value);if(['outfit','hair','cloak','hat','boot'].includes(key)){game[key]=val;saveGame();showCustomization()}});
function showGift(){openMenu('🎁 کد هدیه','<p>کد هدیه خود را وارد کن:</p><input id="giftInput" type="text" placeholder="کد هدیه را وارد کن" maxlength="20">',[{label:'ثبت کد',action:'redeem'},{label:'بازگشت',action:'close',secondary:true}])}
function showQuests(){
 const names=['جنگل زمردی','غار بلورین','کوهستان یخی','ویرانه‌های کهن','قلعه تاریک'];let body='<p>دفتر ماجراجویی جهان DARK REALM</p>';
 names.forEach((n,i)=>body+=`<div class="itemRow"><span>${i+1}. ${n}</span><b>${game.discovered.includes(regions[i].id)?'✓ کشف شد':'کشف نشده'}</b></div>`);
 body+=`<hr><p>مناطق کشف‌شده: ${game.discovered.length}/5</p><p>سیاه‌چال: ${game.dungeonCleared?'پاک‌سازی شده':'در انتظار کشف'}</p><p>فرمانده قلعه: ${game.bossDefeated?'شکست خورده':'در انتظار'}</p>`;
 openMenu('📜 دفتر مأموریت‌ها',body,[]);
}
document.getElementById('bagBtn').onclick=showInventory;document.getElementById('questBtn').onclick=showQuests;

function handleAction(a){
 if(!a)return;if(a==='close'){closeMenu();return}
 if(a==='save'){saveGame();notify('ذخیره شد','پیشرفت بازی ذخیره شد.');return}
 if(a==='redeem'){

  game.coins+=1000;game.giftUsed=true;saveGame();notify('🎉 جایزه دریافت شد','۱۰۰۰ سکه به کیف پولت اضافه شد.');return
 }
 if(a==='returncity'){dungeon.inside=false;player.x=2550;player.y=890;closeMenu();saveGame();return}
 if(a.startsWith('travel:')){
  const i=Number(a.split(':')[1]),r=regions[i];if(!r)return;
  player.x=r.x+140;player.y=r.y+150;
  if(!game.discovered.includes(r.id)){game.discovered.push(r.id);game.xp+=20;notify('🌟 منطقه کشف شد','به '+r.name+' رسیدی! ۲۰ تجربه گرفتی.');levelCheck()}else closeMenu();
  saveGame();return
 }
 if(a==='reload'){if(game.coins<3){notify('سکه کافی نیست','۳ سکه لازم داری.');return}game.coins-=3;game.ammo=game.maxAmmo;saveGame();notify('خشاب پر شد','مهماتت کامل شد.');return}
 if(a==='potion'){if(game.inventory['معجون']<1){notify('معجون نداری','از بازارچه معجون بخر.');return}if(game.health>=game.maxHealth){notify('سلامتی کامل است','فعلاً نیازی نداری.');return}game.inventory['معجون']--;game.health=Math.min(game.maxHealth,game.health+35);saveGame();notify('معجون مصرف شد','سلامتی‌ات بازیابی شد.');return}
 if(a.startsWith('chat:')||a.startsWith('gift:')||a.startsWith('npcjob:')){
  let p=a.split(':'),n=findNPC(p[1]);if(!n)return;
  if(p[0]==='chat'){n.friend=Math.min(10,n.friend+1);game.reputation++;n.mood='خوشحال';saveGame();notify('گفت‌وگوی دوستانه',n.name+' از صحبت با تو خوشحال شد.')}

  return
 }
 if(a.startsWith('buy:')){
  let p=a.split(':'),name=p[1],price=Number(p[2]);if(game.coins<price){notify('سکه کافی نیست','سکه بیشتری لازم داری.');return}

 }
 if(a==='armor'){if(game.coins<60){notify('سکه کافی نیست','۶۰ سکه لازم داری.');return}game.coins-=60;game.maxHealth+=15;game.health=game.maxHealth;saveGame();notify('زره خریدی','حداکثر سلامتی تو ۱۵ واحد افزایش یافت.');return}
 if(a.startsWith('sell:')){
  let p=a.split(':'),name=p[1],price=Number(p[2]);if((game.inventory[name]||0)<1){notify('کالایی نداری','برای فروش یک '+name+' لازم داری.');return}game.inventory[name]--;game.coins+=price;saveGame();notify('فروش موفق',price+' سکه گرفتی.');return
 }
 if(a.startsWith('house:')){
  let id=a.split(':')[1],b=buildings.find(x=>x.id===id);if(!b||game.coins<b.price){notify('سکه کافی نیست','برای خرید خانه سکه کافی نداری.');return}if(game.ownedHouse){notify('خانه داری','در حال حاضر یک خانه داری.');return}
  game.coins-=b.price;game.ownedHouse=id;saveGame();notify('تبریک!','این خانه حالا متعلق به توست.');return
 }
 if(a.startsWith('work:')){
  if(gameTime-game.lastWork<18){notify('کمی استراحت کن','برای کار بعدی کمی صبر کن.');return}
  let place=a.split(':')[1],reward=place==='blacksmith'?12:place==='market'?10:place==='inn'?9:8;
  game.coins+=reward;game.workCount++;game.lastWork=gameTime;
  if(place==='bakery')game.inventory['نان']++;if(place==='blacksmith')game.inventory['سنگ']++;if(place==='market')game.inventory['چوب']++;
  saveGame();notify('💰 دستمزد گرفتی',reward+' سکه دریافت کردی.');return
 }
 if(a==='sleep'||a==='homesleep'){
  if(a==='sleep'&&game.coins<4){notify('سکه کافی نیست','۴ سکه لازم داری.');return}
  if(a==='sleep')game.coins-=4;gameTime+=52.8;game.health=game.maxHealth;saveGame();notify('استراحت کردی','سلامتی‌ات کامل شد.');return
 }
 if(a==='plant'){if(game.coins<2){notify('سکه کافی نیست','۲ سکه لازم داری.');return}if(game.planted>=10){notify('باغچه پر شده','ظرفیت باغچه تکمیل شده.');return}game.coins-=2;game.planted++;game.inventory['گل']++;saveGame();notify('گل کاشته شد','باغچه زیباتر شد.');return}
 if(a==='castle'){
  if(game.castleOwned){notify('قلعه ساخته شده','قلمرو تو از قبل قلعه دارد.');return}
  if(game.coins<200){notify('سکه کافی نیست','۲۰۰ سکه لازم داری.');return}
  game.coins-=200;game.castleOwned=true;saveGame();notify('🏰 قلعه ساخته شد','اکنون صاحب یک قلعه هستی.');return
 }
 if(a==='guard'){if(game.coins<30){notify('سکه کافی نیست','۳۰ سکه لازم داری.');return}game.coins-=30;game.guards++;saveGame();notify('نگهبان استخدام شد','یک نگهبان به قلمروت اضافه شد.');return}
 if(a==='upgrade'){let cost=game.territoryLevel*100;if(game.coins<cost){notify('سکه کافی نیست',cost+' سکه لازم داری.');return}game.coins-=cost;game.territoryLevel++;saveGame();notify('قلمرو ارتقا یافت','سطح قلمرو به '+game.territoryLevel+' رسید.');return}
 if(a==='treasury'){if(!game.treasury){notify('خزانه خالی است','هنوز درآمدی جمع نشده.');return}game.coins+=game.treasury;game.treasury=0;saveGame();notify('خزانه برداشت شد','سکه‌ها به کیف پولت منتقل شدند.');return}
 if(a==='dungeonEnter'){dungeon.inside=true;game.dungeonEntered=true;player.x=dungeon.x+130;player.y=dungeon.y+160;spawnDungeon();closeMenu();return}
 if(a==='dungeonExit'){dungeon.inside=false;player.x=3450;player.y=1880;closeMenu();return}
 if(a==='dungeonChest'){
  if(game.dungeonChest){notify('صندوق خالی است','قبلاً گنج را برداشته‌ای.');return}
  game.dungeonChest=true;game.coins+=180;game.inventory['سنگ']+=5;game.inventory['معجون']+=2;game.xp+=80;saveGame();levelCheck();notify('💎 گنج پیدا شد','۱۸۰ سکه، ۵ سنگ، ۲ معجون و ۸۰ تجربه گرفتی.');return
 }
}

function shoot(){
 if(!started||gameMenu.style.display==='flex')return;
 if(!game.weapon){notify('سلاح نداری','برای مبارزه به سلاح نیاز داری.');return}
 if(game.ammo<=0){notify('مهمات تمام شد','خشاب را از کیف پر کن.');return}
 let now=performance.now();if(now-lastShot<350)return;lastShot=now;game.ammo--;
 let dx=0,dy=0;if(player.direction==='left')dx=-1;if(player.direction==='right')dx=1;if(player.direction==='up')dy=-1;if(player.direction==='down')dy=1;
 projectiles.push({x:player.x+dx*16,y:player.y+dy*16,vx:dx*8,vy:dy*8,life:45});tone(520,.09,'triangle',.07);
}

function levelCheck(){while(game.xp>=game.level*50){game.xp-=game.level*50;game.level++;game.maxHealth+=5;game.health=Math.min(game.maxHealth,game.health+15);notify('🌟 سطح جدید','سطح تو به '+game.level+' رسید!')}}
function respawnPlayer(){game.health=50;const r=regionAt(player.x,player.y);if(dungeon.inside){dungeon.inside=false;player.x=3450;player.y=1880}else if(r){player.x=r.x+140;player.y=r.y+150}else{player.x=1150;player.y=890}enemyProjectiles.length=0;saveGame();notify('استراحت اضطراری','به نقطه امن برگشتی و سلامتی‌ات به ۵۰ رسید.')}

function updateCombat(dt){
 for(let i=projectiles.length-1;i>=0;i--){
  let p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let hit=false;
  for(const e of [...enemies,...dungeonEnemies]){
   if(!e.alive)continue;if(Math.hypot(p.x-e.x,p.y-e.y)<(e.boss?28:20)){
    e.hp-=18;e.hit=5;hit=true;
    if(e.hp<=0){
     e.alive=false;game.kills++;game.coins+=e.reward;game.xp+=e.xpReward||20;
     if(e.type==='slime')game.inventory['گل']++;
     if(e.boss&&!e.regionId){game.dungeonCleared=true;notify('🏆 نگهبان دخمه شکست خورد','راه گنج باز شد! صندوق را پیدا کن.')}
     else if(e.boss){game.bossDefeated=true;game.coins+=150;game.xp+=100;notify('🏆 فرمانده شکست خورد','فرمانده قلعه تاریک شکست خورد! ۱۵۰ سکه جایزه گرفتی.')}
     else notify('🌟 دشمن شکست خورد',e.name+' را شکست دادی و جایزه گرفتی.');
     levelCheck();saveGame();
    }break
   }
  }
  if(hit||p.life<=0||p.x<0||p.y<0||p.x>world.w||p.y>world.h)projectiles.splice(i,1)
 }
 for(let i=enemyProjectiles.length-1;i>=0;i--){
  const p=enemyProjectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(Math.hypot(player.x-p.x,player.y-p.y)<17){game.health=Math.max(0,game.health-p.damage);enemyProjectiles.splice(i,1);tone(120,.12,'sine',.04);saveGame();if(game.health<=0)respawnPlayer()}
  else if(p.life<=0)enemyProjectiles.splice(i,1)
 }
 const playerRegion=regionAt(player.x,player.y);
 [...enemies,...(dungeon.inside?dungeonEnemies:[])].forEach(e=>{
  if(!e.alive)return;e.phase+=.08*dt;if(e.hit>0)e.hit-=dt;if(e.touchCooldown>0)e.touchCooldown-=dt;e.attackCooldown-=dt;
  const enemyRegion=e.regionId?regions.find(r=>r.id===e.regionId):null;
  if(enemyRegion?playerRegion!==enemyRegion:(!e.regionId&&!dungeon.inside))return;
  let d=Math.hypot(player.x-e.x,player.y-e.y);
  if(e.ranged&&d<310&&d>95&&e.attackCooldown<=0){let dx=(player.x-e.x)/d,dy=(player.y-e.y)/d;enemyProjectiles.push({x:e.x,y:e.y-8,vx:dx*3.5,vy:dy*3.5,life:95,damage:e.boss?17:12,color:e.color});e.attackCooldown=105}
  else if(d<250&&d>27){let dx=(player.x-e.x)/d,dy=(player.y-e.y)/d,speed=e.speed||.35;if(e.shape==='bat')speed*=1.25;let nx=e.x+dx*speed*dt,ny=e.y+dy*speed*dt;
   if(enemyRegion){nx=Math.max(enemyRegion.x+35,Math.min(enemyRegion.x+enemyRegion.w-35,nx));ny=Math.max(enemyRegion.y+35,Math.min(enemyRegion.y+enemyRegion.h-35,ny))}
   if(!collide(nx,ny)){e.x=nx;e.y=ny}
  }
  if(d<28&&e.touchCooldown<=0){e.touchCooldown=65;game.health=Math.max(0,game.health-(e.damage||10));tone(100,.15,'sine',.04);saveGame();if(game.health<=0)respawnPlayer()}
 });
 if(enemies.filter(e=>e.alive&&e.type==='slime').length<5&&Math.random()<.002*dt)spawnSlime();
 regions.forEach(r=>{if(r.id==='castle'&&game.bossDefeated)return;let count=enemies.filter(e=>e.alive&&e.regionId===r.id).length;if(count<3&&Math.random()<.0009*dt){let list=enemySpecs[r.id].filter(s=>!s.boss);spawnEnemy(r,list[Math.floor(Math.random()*list.length)])}});
 if(dungeon.inside&&!game.dungeonCleared&&dungeonEnemies.every(e=>!e.alive)){game.dungeonCleared=true;saveGame()}
}
function moveNPC(n,dt){
 const hour=Math.floor((gameTime%240)/10);
 let home=hour>=21||hour<6,p=n.route[n.target];
 if(home){p={x:n.homeX,y:n.homeY}}
 let dx=p.x-n.x,dy=p.y-n.y,d=Math.hypot(dx,dy);
 if(d<8){n.target=(n.target+1)%n.route.length;n.pause=35+Math.random()*60;n.moving=false;return}
 if(n.pause>0){n.pause-=dt;n.moving=false;return}
 let speed=(home?.25:.42)*dt;if(speed>d)speed=d;
 let nx=n.x+dx/d*speed,ny=n.y+dy/d*speed;
 if(!collide(nx,n.y)&&!collide(nx,ny)){n.x=nx;n.y=ny;n.moving=true;n.walk+=dt*.08}
 else{n.target=(n.target+1)%n.route.length;n.pause=20;n.moving=false}
 n.mood=home?'خواب‌آلود':hour>=8&&hour<17?'مشغول کار':'در حال گشت‌وگذار';
}
function canMoveTo(x,y){
 if(dungeon.inside)return x>dungeon.x+15&&x<dungeon.x+dungeon.w-15&&y>dungeon.y+15&&y<dungeon.y+dungeon.h-15;
 const current=regionAt(player.x,player.y),target=regionAt(x,y);
 if(current){if(target!==current)return false;return x>current.x+27&&x<current.x+current.w-27&&y>current.y+27&&y<current.y+current.h-27}
 return target===null&&x>35&&x<2765&&y>35&&y<2265;
}
function updateWeather(dt){
 weatherTimer+=dt;
 if(weatherTimer>850){weatherTimer=0;const list=['clear','clear','rain','fog','snow'];weather=list[Math.floor(Math.random()*list.length)]}
}
function update(dt){
 if(!started||gameMenu.style.display==='flex')return;
 gameTime+=dt/60;updateWeather(dt);
 if(game.castleOwned&&Math.floor(gameTime/60)>Math.floor((gameTime-dt/60)/60)){game.treasury+=game.guards*2+game.territoryLevel*3;saveGame()}
 let dx=joy.x,dy=joy.y;
 if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
 let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}
 player.moving=len>.1;
 if(player.moving){player.frame+=running?.25:.15;if(Math.abs(dx)>Math.abs(dy))player.direction=dx>0?'right':'left';else player.direction=dy>0?'down':'up';let speed=running?4.5:2.5,nx=player.x+dx*speed*dt,ny=player.y+dy*speed*dt;if(!collide(nx,player.y)&&canMoveTo(nx,player.y))player.x=nx;if(!collide(player.x,ny)&&canMoveTo(player.x,ny))player.y=ny}
 if(!dungeon.inside){player.x=Math.max(35,Math.min(world.w-20,player.x));player.y=Math.max(35,Math.min(world.h-20,player.y))}
 camX+=(player.x-W/2-camX)*.12;camY+=(player.y-H/2-camY)*.12;camX=Math.max(0,Math.min(world.w-W,camX));camY=Math.max(0,Math.min(world.h-H,camY));
 npcs.forEach(n=>moveNPC(n,dt));updateCombat(dt);
 near=null;nearBuilding=null;nearPortal=null;nearDungeon=false;nearCastle=false;
 let best=85;for(const n of npcs){let d=Math.hypot(player.x-n.x,player.y-n.y);if(d<best){best=d;near=n}}
 let bestB=125;for(const b of buildings){let bx=Math.max(b.x,Math.min(player.x,b.x+b.w)),by=Math.max(b.y,Math.min(player.y,b.y+b.h)),d=Math.hypot(player.x-bx,player.y-by);if(d<bestB){bestB=d;nearBuilding=b}}
 let bp=90;for(const p of portals){let d=Math.hypot(player.x-p.x,player.y-p.y);if(d<bp){bp=d;nearPortal=p}}
 nearDungeon=!dungeon.inside&&Math.hypot(player.x-(dungeon.x+130),player.y-(dungeon.y+190))<100;
 nearCastle=Math.hypot(player.x-4700,player.y-1900)<145;
 if(nearPortal){near=null;nearBuilding=null;nearDungeon=false}
 else if(near&&nearBuilding){let dn=Math.hypot(player.x-near.x,player.y-near.y),bx=Math.max(nearBuilding.x,Math.min(player.x,nearBuilding.x+nearBuilding.w)),by=Math.max(nearBuilding.y,Math.min(player.y,nearBuilding.y+nearBuilding.h));if(Math.hypot(player.x-bx,player.y-by)<dn)near=null;else nearBuilding=null}
}
function getClock(){let m=(360+(gameTime/240)*1440)%1440,h=Math.floor(m/60),mi=Math.floor(m%60);return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(dungeon.inside){rect(camX,camY,W,H,'#211c29');for(let i=0;i<18;i++){let x=dungeon.x+(i*73)%dungeon.w,y=dungeon.y+(i*51)%dungeon.h;circle(x,y,8,'#494052')}drawDungeon()}
 else{drawGround();drawCityWall();drawRegionWalls();trees.forEach(drawTree);buildings.forEach(drawBuilding);drawCastle();drawDungeon()}
 npcs.forEach(drawNPC);enemies.forEach(drawEnemy);if(dungeon.inside)dungeonEnemies.forEach(drawEnemy);drawPortals();
 projectiles.forEach(p=>{circle(p.x,p.y,5,'#b9edff');circle(p.x,p.y,2,'#fff')});
 enemyProjectiles.forEach(p=>{circle(p.x,p.y,7,p.color||'#b58bdb');circle(p.x,p.y,3,'#fff')});
 if(dungeon.inside&&!game.dungeonChest){rect(dungeon.x+190,dungeon.y+125,34,28,'#a87935');rect(dungeon.x+190,dungeon.y+125,34,7,'#e0b95c')}
 drawPlayer();drawLighting();drawWeather();if(!dungeon.inside)drawMinimap();
 const r=regionAt(player.x,player.y),place=dungeon.inside?'سیاه‌چال':r?r.name:'شهر قدیمی';
 document.getElementById('stats').innerHTML='❤️ '+game.health+'/'+game.maxHealth+'<br>🪙 '+game.coins+'<br>✨ سطح '+game.level+' | XP '+game.xp+'<br>🔫 '+game.ammo+'/'+game.maxAmmo+'<br>📍 '+place+'<br>🕒 '+getClock()+'<br>🌦 '+({clear:'صاف',rain:'بارانی',fog:'مه‌آلود',snow:'برفی'}[weather]);
 const hint=document.getElementById('hint');
 if(nearPortal)hint.textContent='برای سفر با دروازه تعامل کن';
 else if(nearDungeon)hint.textContent='ورودی سیاه‌چال؛ برای ورود تعامل کن';
 else if(nearCastle)hint.textContent='برای مدیریت قلعه تعامل کن';
 else if(near)hint.textContent='برای صحبت با '+near.name+' تعامل کن';
 else if(nearBuilding)hint.textContent='برای تعامل با '+nearBuilding.name+' دکمه تعامل را بزن';
 else if(dungeon.inside)hint.textContent='سیاه‌چال را پاک‌سازی کن و گنج را پیدا کن';
 else if(r)hint.textContent='منطقه: '+r.name+' | دشمن‌ها را پیدا کن و شکست بده';
 else hint.textContent='شهر را بگرد، تجارت کن یا از دروازه جهان عبور کن';
}
let last=performance.now(),saveTimer=0;
function loop(now){let dt=Math.min(2,(now-last)/16.67);last=now;update(dt);draw();saveTimer+=dt;if(saveTimer>600){saveGame();saveTimer=0}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
