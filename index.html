
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DARK REALM - Living Kingdom</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#18251e;overflow:hidden;font-family:Tahoma;color:white;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
button{font-family:Tahoma;cursor:pointer}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101827e8;border:1px solid #9b895d;border-radius:12px;padding:10px}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px}
#title{font-size:16px;color:#d8bd83;font-weight:bold}
#stats{font-size:11px;line-height:1.8;text-align:right;min-width:105px}
#hint{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:#101827dd;padding:8px 12px;border-radius:20px;font-size:11px;white-space:nowrap}
#controls{position:absolute;bottom:17px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;pointer-events:auto}
#stick{width:112px;height:112px;border:2px solid #ffffff66;background:#ffffff20;border-radius:50%;position:relative;touch-action:none}
#nub{position:absolute;left:32px;top:32px;width:44px;height:44px;border-radius:50%;background:#c5cbd377;border:2px solid #fff;pointer-events:none}
#buttons{display:flex;gap:9px;align-items:end}
.action{border-radius:50%;background:#70552f;border:2px solid #e0bd7c;color:white;font-weight:bold;touch-action:none;user-select:none}
#run{width:60px;height:60px;font-size:11px}
#talk{width:70px;height:70px;font-size:12px}
#dialog{display:none;position:absolute;bottom:120px;left:5%;width:90%;background:#101827f5;border:1px solid #d0ae70;border-radius:14px;padding:14px;text-align:center;line-height:1.8;pointer-events:auto}
#who{color:#e3c78f;font-weight:bold;margin-bottom:5px}
#start{position:fixed;inset:0;background:#090e19ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:auto;z-index:10}
.card{background:#131d2c;border:1px solid #a88e5d;border-radius:20px;padding:25px;max-width:420px}
h1{color:#d6bd8a;letter-spacing:3px}
p{font-size:13px;line-height:2;color:#c4cbd4}
#play{background:#9a7947;color:white;border:0;border-radius:12px;padding:14px 35px;font-size:15px;font-weight:bold}
#settingsBtn,#bagBtn{position:absolute;left:10px;width:43px;height:43px;border:1px solid #d0ae70;border-radius:12px;background:#101827ed;color:#e3c78f;font-size:22px;pointer-events:auto}
#settingsBtn{top:155px}
#bagBtn{top:205px}
#settingsPanel{display:none;position:absolute;top:207px;left:10px;width:205px;background:#101827f5;border:1px solid #9b895d;border-radius:14px;padding:13px;pointer-events:auto;box-shadow:0 8px 25px #0008}
#settingsPanel button,.smallBtn{background:#70552f;color:white;border:1px solid #d0ae70;border-radius:8px;padding:9px}
#volume{width:100%;accent-color:#d0ae70}
.settingsTitle{color:#e3c78f;font-weight:bold;margin-bottom:12px}
#gameMenu{display:none;position:fixed;inset:0;background:#070b12b8;z-index:8;align-items:center;justify-content:center;padding:16px;pointer-events:auto}
#menuCard{width:min(440px,100%);max-height:82vh;overflow:auto;background:#111b29;border:1px solid #c0a16b;border-radius:17px;padding:18px;box-shadow:0 12px 40px #000a}
#menuTitle{color:#e3c78f;font-size:18px;font-weight:bold;margin-bottom:12px}
#menuBody{font-size:13px;line-height:2;color:#e1e4e8}
.menuActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.menuActions button{flex:1;min-width:110px;background:#70552f;color:white;border:1px solid #d0ae70;border-radius:9px;padding:10px;font-size:12px}
.menuActions button.secondary{background:#293443;border-color:#657184}
.itemRow{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff18;padding:6px 0}
#closeMenu{width:100%;margin-top:12px;background:#293443;color:white;border:1px solid #657184;border-radius:9px;padding:10px}
@media(max-height:520px){
 #stick{width:90px;height:90px}
 #nub{left:25px;top:25px}
 #controls{bottom:8px}
 #dialog{bottom:100px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
 <div id="top">
  <div class="panel"><div id="title">DARK REALM</div><small>THE LIVING KINGDOM</small></div>
  <div class="panel" id="stats">❤️ 100<br>🪙 25<br>🌅 08:00</div>
 </div>

 <button id="settingsBtn">⚙</button>
 <button id="bagBtn">🎒</button>

 <div id="settingsPanel">
  <div class="settingsTitle">⚙ تنظیمات بازی</div>
  <div style="font-size:12px;margin-bottom:8px">🔊 صدای محیط</div>
  <input id="volume" type="range" min="0" max="100" value="35">
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#aaa"><span>کم</span><span>زیاد</span></div>
  <button id="soundBtn" style="width:100%;margin-top:13px">🔊 قطع صدا</button>
  <button id="closeSettings" style="width:100%;margin-top:8px">بستن</button>
 </div>

 <div id="hint">در شهر آزادانه بگرد؛ با مردم و ساختمان‌ها تعامل کن</div>

 <div id="controls">
  <div id="stick"><div id="nub"></div></div>
  <div id="buttons">
   <button class="action" id="run">دویدن</button>
   <button class="action" id="talk">تعامل</button>
  </div>
 </div>
</div>

<div id="gameMenu">
 <div id="menuCard">
  <div id="menuTitle"></div>
  <div id="menuBody"></div>
  <div class="menuActions" id="menuActions"></div>
  <button id="closeMenu">بستن</button>
 </div>
</div>

<div id="start">
 <div class="card">
  <h1>DARK REALM</h1>
  <div style="color:#b9a47c">THE LIVING KINGDOM</div>
  <p>به شهر قدیمی خوش آمدی.<br>خانه بخر، تجارت کن، شغل پیدا کن، با مردم دوست شو و زندگی خودت را در این سرزمین بساز.</p>
  <button id="play">شروع ماجراجویی</button>
  <p>نسخه آزمایشی آفلاین</p>
 </div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
let W=innerWidth,H=innerHeight,camX=0,camY=0,started=false;
const DPR=Math.min(window.devicePixelRatio||1,1.25);

function resize(){
 W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*DPR);
 canvas.height=Math.floor(H*DPR);
 canvas.style.width=W+'px';
 canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
resize();

const world={w:2800,h:2300};
const player={x:1150,y:890,speed:2.5,direction:'down',moving:false,frame:0};
let keys={},joy={x:0,y:0},running=false,near=null,nearBuilding=null;

/* ساختمان‌های شهر */
const buildings=[
 {id:'home1',x:650,y:350,w:220,h:170,name:'خانه کوچک',type:'home',price:80},
 {id:'bakery',x:1400,y:350,w:240,h:190,name:'نانوایی',type:'bakery'},
 {id:'inn',x:2200,y:350,w:250,h:190,name:'مسافرخانه',type:'inn'},

 {id:'home2',x:650,y:1050,w:230,h:180,name:'خانه باغی',type:'home',price:140},
 {id:'blacksmith',x:1400,y:1050,w:250,h:200,name:'آهنگری',type:'blacksmith'},
 {id:'home3',x:2200,y:1050,w:220,h:180,name:'خانه قدیمی',type:'home',price:110},

 {id:'home4',x:650,y:1740,w:230,h:180,name:'خانه جنگلی',type:'home',price:170},
 {id:'market',x:1400,y:1740,w:250,h:190,name:'بازارچه',type:'market'},
 {id:'home5',x:2200,y:1740,w:250,h:190,name:'کلبه',type:'home',price:100}
];

const roads=[
 {x:0,y:820,w:2800,h:140},
 {x:0,y:1480,w:2800,h:140},
 {x:480,y:0,w:120,h:2300},
 {x:1080,y:0,w:140,h:2300},
 {x:1880,y:0,w:140,h:2300},
 {x:2580,y:0,w:120,h:2300}
];

const buildingZones=buildings.map(b=>({x:b.x-35,y:b.y-35,w:b.w+70,h:b.h+70}));
const fountainZone={x:1080,y:820,w:140,h:140};

const npcs=[
 {x:1100,y:690,name:'مامان ادریس',msg:'به شهر ما خوش آمدی! اینجا هرکسی می‌تواند زندگی خودش را بسازد.',color:'#9b5968',job:'کشاورزی'},
 {x:820,y:980,name:'ویچر',msg:'من از بازارچه خبر دارم. اگر دنبال خریدوفروشی، سری به آنجا بزن.',color:'#536c49',job:'جمع‌آوری کالا'},
 {x:1430,y:1000,name:'زئوس',msg:'در آهنگری همیشه کار پیدا می‌شود. البته کار بدون دستمزد نداریم!',color:'#80649b',job:'آهنگری'},
 {x:1100,y:1200,name:'تانجیرو',msg:'من نگهبان شهرم. مراقب مردم و کوچه‌ها هستم.',color:'#365c75',job:'نگهبانی'},
 {x:900,y:700,name:'یاشار',msg:'زندگی در این شهر آرام است. من بیشتر روزها در میدان می‌چرخم.',color:'#333b49',job:'پیک شهری'},
 {x:1600,y:850,name:'اراد',msg:'سلام مسافر. این شهر پر از رازهای پنهان است. با مردمش آشنا شو.',color:'#242735',job:'راهنمای شهر'},
 {x:2050,y:1740,name:'ممد اسموک',msg:'من مدتی است تلاش می‌کنم زندگی‌ام را بهتر کنم. شاید یک روز در بازار کار پیدا کنم.',color:'#292b32',job:'کمک در بازار'}
];

npcs.forEach((n,i)=>{
 n.route=[
  {x:n.x,y:n.y},
  {x:n.x+45,y:n.y+35},
  {x:n.x+80,y:n.y},
  {x:n.x+30,y:n.y-45},
  {x:n.x-35,y:n.y-20}
 ];
 n.friend=0;
 n.target=0;
 n.pause=20+i*7;
 n.walk=0;
 n.moving=false;
});

/* اطلاعات و پیشرفت بازیکن */
const game={
 coins:25,
 health:100,
 inventory:{نان:0,معجون:0,چوب:0,سنگ:0,گل:0,شمشیر:0},
 ownedHouse:null,
 planted:0,
 workCount:0,
 lastWork:-9999
};

function saveGame(){
 try{localStorage.setItem('darkRealmSave',JSON.stringify({
  coins:game.coins,health:game.health,inventory:game.inventory,
  ownedHouse:game.ownedHouse,planted:game.planted,workCount:game.workCount,
  friends:npcs.map(n=>n.friend),gameTime
 }));}catch(e){}
}
function loadGame(){
 try{
  const s=JSON.parse(localStorage.getItem('darkRealmSave')||'null');
  if(!s)return;
  game.coins=Number(s.coins)||25;
  game.health=Number(s.health)||100;
  game.inventory=Object.assign(game.inventory,s.inventory||{});
  game.ownedHouse=s.ownedHouse||null;
  game.planted=Number(s.planted)||0;
  game.workCount=Number(s.workCount)||0;
  if(Array.isArray(s.friends))npcs.forEach((n,i)=>n.friend=s.friends[i]||0);
  gameTime=Number(s.gameTime)||0;
 }catch(e){}
}
loadGame();

function overlaps(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function safeTree(x,y,s){
 const box={x:x-s,y:y-s,w:s*2,h:s*2};
 if(buildingZones.some(b=>overlaps(box,b)))return false;
 if(roads.some(r=>overlaps(box,r)))return false;
 if(overlaps(box,fountainZone))return false;
 if(npcs.some(n=>Math.hypot(x-n.x,y-n.y)<100))return false;
 return true;
}

/* درخت کمتر برای اجرای روان‌تر */
const trees=[];
for(let i=0;i<65;i++){
 for(let a=0;a<80;a++){
  let x=40+Math.random()*(world.w-80);
  let y=40+Math.random()*(world.h-80);
  let size=18+Math.random()*14;
  if(safeTree(x,y,size)){trees.push({x,y,size});break;}
 }
}

const obstacles=[];
buildings.forEach(b=>obstacles.push({x:b.x+8,y:b.y+20,w:b.w-16,h:b.h-20}));
trees.forEach(t=>obstacles.push({x:t.x-t.size*.55,y:t.y-t.size*.5,w:t.size*1.1,h:t.size*1.1}));

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==='e'||e.key==='E')interact();
 if(e.key==='Escape')closeMenu();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* جوی‌استیک */
const stick=document.getElementById('stick');
const nub=document.getElementById('nub');
let dragging=false;
function moveJoy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let d=Math.hypot(dx,dy),max=34;
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 joy.x=dx/max;joy.y=dy/max;
 nub.style.left=(32+dx)+'px';
 nub.style.top=(32+dy)+'px';
}
stick.addEventListener('pointerdown',e=>{
 e.preventDefault();dragging=true;stick.setPointerCapture(e.pointerId);moveJoy(e);
});
stick.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();moveJoy(e);}});
function stopJoy(){
 dragging=false;joy.x=joy.y=0;nub.style.left='32px';nub.style.top='32px';
}
stick.addEventListener('pointerup',stopJoy);
stick.addEventListener('pointercancel',stopJoy);

/* دویدن */
const runBtn=document.getElementById('run');
runBtn.addEventListener('pointerdown',e=>{e.preventDefault();running=true;runBtn.style.background='#a0804b';});
function stopRun(){running=false;runBtn.style.background='#70552f';}
runBtn.addEventListener('pointerup',stopRun);
runBtn.addEventListener('pointercancel',stopRun);
runBtn.addEventListener('pointerleave',stopRun);

/* تنظیمات صدا */
const settingsBtn=document.getElementById('settingsBtn');
const settingsPanel=document.getElementById('settingsPanel');
const volume=document.getElementById('volume');
const soundBtn=document.getElementById('soundBtn');
settingsBtn.onclick=()=>settingsPanel.style.display=settingsPanel.style.display==='block'?'none':'block';
document.getElementById('closeSettings').onclick=()=>settingsPanel.style.display='none';

let audioCtx=null,masterGain=null,windGain=null;
let soundEnabled=true,audioStarted=false,birdTimer=null;
function initAudio(){
 if(audioStarted)return;
 try{
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=volume.value/100;
  masterGain.connect(audioCtx.destination);
  windGain=audioCtx.createGain();windGain.gain.value=.025;windGain.connect(masterGain);
  const bufferSize=audioCtx.sampleRate*2;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;
  const noise=audioCtx.createBufferSource();noise.buffer=buffer;noise.loop=true;
  const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=350;
  const noiseGain=audioCtx.createGain();noiseGain.gain.value=.4;
  noise.connect(filter);filter.connect(noiseGain);noiseGain.connect(windGain);noise.start();
  const hum=audioCtx.createOscillator(),humGain=audioCtx.createGain();
  hum.type='sine';hum.frequency.value=75;humGain.gain.value=.015;
  hum.connect(humGain);humGain.connect(masterGain);hum.start();
  audioStarted=true;startBirds();
 }catch(e){}
}
function daylight(){
 let t=(gameTime%dayLength)/dayLength;
 return(Math.sin(t*Math.PI*2-Math.PI/2)+1)/2;
}
function birdChirp(){
 if(!audioCtx||!soundEnabled||!started)return;
 const now=audioCtx.currentTime;
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
 osc.type='sine';filter.type='bandpass';filter.frequency.value=2600;filter.Q.value=1.2;
 const base=2200+Math.random()*500,duration=.16+Math.random()*.12;
 osc.frequency.setValueAtTime(base,now);
 osc.frequency.exponentialRampToValueAtTime(base*1.35,now+duration*.45);
 osc.frequency.exponentialRampToValueAtTime(base*.9,now+duration);
 gain.gain.setValueAtTime(.0001,now);
 gain.gain.linearRampToValueAtTime(.012,now+.025);
 gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
 osc.connect(filter);filter.connect(gain);gain.connect(masterGain);
 osc.start(now);osc.stop(now+duration+.02);
}
function startBirds(){
 if(birdTimer)clearTimeout(birdTimer);
 function schedule(){
  if(!started||!audioCtx)return;
  if(soundEnabled&&daylight()>.55&&Math.random()<.7)birdChirp();
  birdTimer=setTimeout(schedule,7000+Math.random()*8000);
 }
 schedule();
}
soundBtn.onclick=()=>{
 soundEnabled=!soundEnabled;
 if(masterGain)masterGain.gain.setTargetAtTime(soundEnabled?volume.value/100:0,audioCtx.currentTime,.2);
 soundBtn.textContent=soundEnabled?'🔊 قطع صدا':'🔇 فعال کردن صدا';
};
volume.oninput=e=>{
 if(masterGain&&soundEnabled)masterGain.gain.setTargetAtTime(e.target.value/100,audioCtx.currentTime,.1);
};

document.getElementById('play').addEventListener('click',()=>{
 started=true;
 document.getElementById('start').style.display='none';
 initAudio();
 if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
});

/* ابزار رسم */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x-camX,y-camY,w,h);}
function circle(x,y,r,c){
 ctx.fillStyle=c;ctx.beginPath();ctx.arc(x-camX,y-camY,r,0,Math.PI*2);ctx.fill();
}
function visible(x,y,w,h,margin=100){
 return x+w>camX-margin&&x<camX+W+margin&&y+h>camY-margin&&y<camY+H+margin;
}

/* زمین؛ فقط بخش دیده‌شده رسم می‌شود */
function drawGround(){
 rect(camX,camY,W,H,'#29382f');
 const startX=Math.max(0,Math.floor((camX-80)/80)*80);
 const endX=Math.min(world.w,camX+W+80);
 const startY=Math.max(0,Math.floor((camY-80)/80)*80);
 const endY=Math.min(world.h,camY+H+80);
 for(let y=startY;y<endY;y+=80){
  for(let x=startX;x<endX;x+=80){
   if((x+y)%160===0)rect(x,y,80,80,'#2d3d32');
  }
 }
 roads.forEach(r=>{
  if(!visible(r.x,r.y,r.w,r.h))return;
  rect(r.x-9,r.y-9,r.w+18,r.h+18,'#403a32');
  rect(r.x,r.y,r.w,r.h,'#655747');
  const horizontal=r.w>=r.h;
  if(horizontal){
   const sy=Math.max(r.y+8,Math.floor((camY-r.y-40)/34)*34+r.y+8);
   const ey=Math.min(r.y+r.h-5,camY+H+40);
   const sx=Math.max(r.x+8,Math.floor((camX-r.x-45)/42)*42+r.x+8);
   const ex=Math.min(r.x+r.w-5,camX+W+45);
   for(let y=sy;y<ey;y+=34)for(let x=sx;x<ex;x+=42){
    let offset=(Math.floor((y-r.y)/34)%2)*20;
    rect(x+offset,y,28,22,'#796a57');
    rect(x+offset+29,y,3,22,'#51483c');
   }
  }else{
   const sx=Math.max(r.x+8,Math.floor((camX-r.x-40)/34)*34+r.x+8);
   const ex=Math.min(r.x+r.w-5,camX+W+40);
   const sy=Math.max(r.y+8,Math.floor((camY-r.y-45)/42)*42+r.y+8);
   const ey=Math.min(r.y+r.h-5,camY+H+45);
   for(let x=sx;x<ex;x+=34)for(let y=sy;y<ey;y+=42){
    let offset=(Math.floor((x-r.x)/34)%2)*20;
    rect(x,y+offset,22,28,'#796a57');
    rect(x,y+offset+29,22,3,'#51483c');
   }
  }
 });
 circle(1150,890,100,'#746653');
 circle(1150,890,86,'#665747');
 circle(1150,890,70,'#796a57');
}

function drawTree(t){
 let{x,y,size:s}=t;
 if(!visible(x-s,y-s*2,s*2,s*3))return;
 circle(x+6,y+13,s,'#17241c');
 rect(x-5,y-3,10,25,'#5a402d');
 circle(x,y-15,s,'#1b3022');
 circle(x-10,y-24,s*.65,'#29452e');
 circle(x+10,y-24,s*.65,'#314d35');
 circle(x,y-35,s*.55,'#3a5a3d');
 circle(x-5,y-23,s*.35,'#476846');
}

function drawBuilding(b){
 if(!visible(b.x,b.y-45,b.w,b.h+50))return;
 rect(b.x+10,b.y+12,b.w,b.h,'#171b1c');
 rect(b.x,b.y,b.w,b.h,'#665548');

function collide(x,y){
 let r=12;
 return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}
function moveNPC(n,dt){
 let p=n.route[n.target],dx=p.x-n.x,dy=p.y-n.y,d=Math.hypot(dx,dy);
 if(d<8){n.target=(n.target+1)%n.route.length;n.pause=35+Math.random()*60;n.moving=false;return;}
 if(n.pause>0){n.pause-=dt;n.moving=false;return;}
 let speed=.42*dt;if(speed>d)speed=d;
 let nx=n.x+dx/d*speed,ny=n.y+dy/d*speed;
 if(!collide(nx,n.y)&&!collide(nx,ny)){
  n.x=nx;n.y=ny;n.moving=true;n.walk+=dt*.08;
 }else{n.target=(n.target+1)%n.route.length;n.pause=20;n.moving=false;}
}

/* زمان بازی */
let gameTime=0;
const dayLength=240;
function getGameClock(){
 let totalMinutes=(360+(gameTime/dayLength)*1440)%1440;
 let hour=Math.floor(totalMinutes/60),minute=Math.floor(totalMinutes%60);
 return{hour,minute,text:String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')};
}
function getPhase(){
 const c=getGameClock();
 if(c.hour>=5&&c.hour<8)return'🌅 صبح';
 if(c.hour>=8&&c.hour<17)return'☀️ روز';
 if(c.hour>=17&&c.hour<20)return'🌇 غروب';
 return'🌙 شب';
}
function drawLights(day){
 let darkness=1-day;
 buildings.forEach(b=>{
  if(!visible(b.x-90,b.y-90,b.w+180,b.h+180))return;
  let wx=b.x+28,wy=b.y+58;
  if(darkness>.35){
   rect(b.x+28,b.y+58,29,39,`rgba(255,190,90,${darkness*.75})`);
   rect(b.x+b.w-57,b.y+58,29,39,`rgba(255,190,90,${darkness*.75})`);
  }
  if(darkness>.2){
   let grd=ctx.createRadialGradient(wx-camX,wy-camY,2,wx-camX,wy-camY,65);
   grd.addColorStop(0,`rgba(255,190,90,${darkness*.22})`);
   grd.addColorStop(1,'rgba(255,190,90,0)');
   ctx.fillStyle=grd;ctx.fillRect(wx-65-camX,wy-65-camY,130,130);
  }
 });
 const lamps=[[500,800],[900,800],[1300,800],[1700,800],[2300,800],[1000,600],[1200,600],[1000,1100],[1200,1100],[500,1500],[1000,1500],[1500,1500],[2000,1500],[2500,1500],[500,1900],[1100,1900],[1900,1900],[2600,1900]];
 lamps.forEach(([x,y])=>{
  if(!visible(x-65,y-65,130,130))return;
  circle(x,y,5,'#c6a56b');
  if(darkness>.25){
   let g=ctx.createRadialGradient(x-camX,y-camY,2,x-camX,y-camY,55);
   g.addColorStop(0,`rgba(255,205,120,${darkness*.35})`);
   g.addColorStop(1,'rgba(255,205,120,0)');
   ctx.fillStyle=g;ctx.fillRect(x-55-camX,y-55-camY,110,110);
  }
 });
}
function drawAtmosphere(day){
 let darkness=1-day;
 ctx.fillStyle=`rgba(9,18,38,${darkness*.58})`;ctx.fillRect(0,0,W,H);
 let clock=getGameClock(),orange=0;
 if(clock.hour>=5&&clock.hour<8)orange=1-(clock.hour-5)/3;
 if(clock.hour>=17&&clock.hour<20)orange=(clock.hour-17)/3;
 orange=Math.max(0,Math.min(1,orange));
 if(orange>0){ctx.fillStyle=`rgba(180,95,40,${orange*.09})`;ctx.fillRect(0,0,W,H);}
}

/* منوی بازی */

const menuTitle=document.getElementById('menuTitle');
const menuBody=document.getElementById('menuBody');

function openMenu(title,body,actions=[]){
 menuTitle.textContent=title;
 menuBody.innerHTML=body;
 menuActions.innerHTML='';
 actions.forEach(a=>{

  b.textContent=a.label;b.dataset.action=a.action;

function interact(){
 if(!started||gameMenu.style.display==='flex')return;
 if(near){showNPC(near);return;}
 if(nearBuilding){showBuilding(nearBuilding);return;}
 openMenu('هیچ‌کس اینجا نیست','برای تعامل به مردم یا درِ ساختمان‌ها نزدیک‌تر شو.',[]);
}

function findNPC(name){return npcs.find(n=>n.name===name);}
function notify(title,message){openMenu(title,message,[{label:'باشه',action:'close'}]);}

function handleAction(action){
 if(!action)return;
 if(action==='close'){closeMenu();return;}
 if(action==='save'){saveGame();notify('ذخیره شد','پیشرفت بازی روی همین دستگاه ذخیره شد.');return;}
 if(action.startsWith('chat:')){
  let n=findNPC(action.split(':')[1]);if(!n)return;
  n.friend=Math.min(10,n.friend+1);saveGame();
  notify('گفت‌وگوی دوستانه','رابطه تو با '+n.name+' بهتر شد.');return;
 }
 if(action.startsWith('gift:')){
  let n=findNPC(action.split(':')[1]);if(!n)return;
  if(game.coins<5){notify('سکه کافی نیست','برای هدیه دادن ۵ سکه لازم داری.');return;}
  game.coins-=5;n.friend=Math.min(10,n.friend+2);
  saveGame();notify('هدیه داده شد',''+n.name+' از هدیه‌ات خوشحال شد.');return;
 }
 if(action.startsWith('npcjob:')){
  let n=findNPC(action.split(':')[1]);if(!n)return;
  notify('پیشنهاد کار',''+n.name+' می‌گوید: برای کار روزانه به نانوایی، آهنگری، بازارچه یا مسافرخانه سر بزن.');return;
 }
 if(action.startsWith('buy:')){
  let p=action.split(':'),name=p[1],price=Number(p[2]);
  if(game.coins<price){notify('سکه کافی نیست','برای این خرید سکه بیشتری لازم داری.');return;}
  game.coins-=price;game.inventory[name]=(game.inventory[name]||0)+1;
  saveGame();notify('خرید موفق','یک عدد '+name+' به کیف تو اضافه شد.');return;
 }
 if(action.startsWith('sell:')){
  let p=action.split(':'),name=p[1],price=Number(p[2]);
  if((game.inventory[name]||0)<1){notify('کالایی نداری','برای فروش حداقل یک '+name+' لازم داری.');return;}
  game.inventory[name]--;game.coins+=price;saveGame();
  notify('فروش موفق','یک '+name+' فروختی و '+price+' سکه گرفتی.');return;
 }
 if(action.startsWith('house:')){
  let id=action.split(':')[1],b=buildings.find(x=>x.id===id);
  if(!b||game.coins<b.price){notify('سکه کافی نیست','برای خرید این خانه '+(b?b.price:0)+' سکه لازم داری.');return;}
  if(game.ownedHouse){notify('خانه داری','در حال حاضر یک خانه داری. اول از خانه فعلی‌ات استفاده کن.');return;}
  game.coins-=b.price;game.ownedHouse=id;saveGame();
  notify('🏠 تبریک!','این خانه حالا متعلق به توست. می‌توانی به آن برگردی و استراحت کنی.');return;
 }
 if(action.startsWith('work:')){
  let now=gameTime;
  if(now-game.lastWork<18){notify('کمی استراحت کن','برای گرفتن کار بعدی کمی در بازی صبر کن.');return;}
  let place=action.split(':')[1];
  let reward=place==='blacksmith'?12:place==='market'?10:place==='inn'?9:8;
  game.coins+=reward;game.workCount++;game.lastWork=now;
  if(place==='bakery')game.inventory['نان']++;
  if(place==='blacksmith')game.inventory['سنگ']++;
  if(place==='market')game.inventory['چوب']++;
  saveGame();notify('💰 دستمزد گرفتی','برای کارت '+reward+' سکه گرفتی. یک کالا هم به موجودی‌ات اضافه شد.');return;
 }
 if(action==='sleep'||action==='homesleep'){
  if(action==='sleep'&&game.coins<4){notify('سکه کافی نیست','استراحت در مسافرخانه ۴ سکه هزینه دارد.');return;}
  if(action==='sleep')game.coins-=4;
  gameTime+=dayLength*.22;game.health=100;saveGame();
  notify('استراحت کردی','سلامتی‌ات کامل شد. روز تازه‌ای در شهر آغاز شده است.');return;
 }
 if(action==='plant'){
  if(game.coins<2){notify('سکه کافی نیست','برای کاشت گل ۲ سکه لازم داری.');return;}
  if(game.planted>=10){notify('باغچه پر شده','فعلاً ظرفیت باغچه‌ات تکمیل شده است.');return;}
  game.coins-=2;game.planted++;game.inventory['گل']++;
  saveGame();notify('🌱 گل کاشته شد','باغچه خانه‌ات زیباتر شد.');return;
 }
 if(action==='homeitems'){
  showInventory();return;
 }
}
menuActions.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');
 if(b)handleAction(b.dataset.action);
});
document.getElementById('talk').addEventListener('click',interact);

/* بروزرسانی */
function update(dt){
 if(!started||gameMenu.style.display==='flex')return;
 gameTime+=dt/60;
 let dx=joy.x,dy=joy.y;
 if(keys.w||keys.arrowup)dy-=1;
 if(keys.s||keys.arrowdown)dy+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;
 let length=Math.hypot(dx,dy);
 if(length>1){dx/=length;dy/=length;}
 player.moving=length>.1;
 let speed=running?4.5:2.5;
 if(player.moving){
  player.frame+=running?.25:.15;
  if(Math.abs(dx)>Math.abs(dy))player.direction=dx>0?'right':'left';
  else player.direction=dy>0?'down':'up';
  let nx=player.x+dx*speed*dt,ny=player.y+dy*speed*dt;
  if(!collide(nx,player.y))player.x=nx;
  if(!collide(player.x,ny))player.y=ny;
 }
 player.x=Math.max(20,Math.min(world.w-20,player.x));
 player.y=Math.max(20,Math.min(world.h-20,player.y));
 camX+=(player.x-W/2-camX)*.12;
 camY+=(player.y-H/2-camY)*.12;
 camX=Math.max(0,Math.min(world.w-W,camX));
 camY=Math.max(0,Math.min(world.h-H,camY));
 npcs.forEach(n=>moveNPC(n,dt));
 near=null;nearBuilding=null;
 let best=85;
 for(const n of npcs){
  let d=Math.hypot(player.x-n.x,player.y-n.y);
  if(d<best){best=d;near=n;}
 }
 let bestB=125;
 for(const b of buildings){
  let d=Math.hypot(player.x-(b.x+b.w/2),player.y-(b.y+b.h+20));
  if(d<bestB){bestB=d;nearBuilding=b;}
 }
 if(near&&nearBuilding){
  let dn=Math.hypot(player.x-near.x,player.y-near.y);
  let db=Math.hypot(player.x-(nearBuilding.x+nearBuilding.w/2),player.y-(nearBuilding.y+nearBuilding.h+20));
  if(db<dn)near=null;else nearBuilding=null;
 }
}

/* رندر */
function draw(){
 ctx.clearRect(0,0,W,H);
 drawGround();
 trees.forEach(drawTree);
 buildings.forEach(drawBuilding);
 drawFountain();
 let day=daylight();
 drawLights(day);
 npcs.forEach(drawNPC);
 drawPlayer();
 drawAtmosphere(day);
 const clock=getGameClock();
 document.getElementById('stats').innerHTML=
 '❤️ '+game.health+'<br>🪙 '+game.coins+'<br>'+getPhase()+'<br>🕐 '+clock.text;
 const hint=document.getElementById('hint');
 if(near)hint.textContent='برای صحبت با '+near.name+' دکمه تعامل را بزن';
 else if(nearBuilding)hint.textContent='برای ورود به '+nearBuilding.name+' دکمه تعامل را بزن';
 else hint.textContent='آزادانه در شهر بگرد؛ مردم و ساختمان‌ها منتظر تو هستند';
}

let last=performance.now(),saveTimer=0;
function loop(now){
 let dt=Math.min(2,(now-last)/16.67);
 last=now;
 update(dt);
 draw();
 saveTimer+=dt;
 if(saveTimer>600){saveGame();saveTimer=0;}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
