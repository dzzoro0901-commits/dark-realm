
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARK REALM - Living Kingdom</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#18251e;overflow:hidden;font-family:Tahoma;color:white;touch-action:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
button{font-family:Tahoma;cursor:pointer;touch-action:manipulation}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101827e8;border:1px solid #9b895d;border-radius:12px;padding:9px}
#top{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;gap:6px}
#title{font-size:15px;color:#d8bd83;font-weight:bold}
#stats{font-size:10px;line-height:1.7;text-align:right;min-width:112px}

.action{border-radius:50%;background:#70552f;border:2px solid #e0bd7c;color:white;font-weight:bold;user-select:none}
#run{width:53px;height:53px;font-size:10px}
#talk{width:62px;height:62px;font-size:11px}
#shoot{width:68px;height:68px;font-size:12px;background:#713c35;border-color:#e49b79}
#settingsBtn,#bagBtn{position:absolute;left:9px;width:41px;height:41px;border:1px solid #d0ae70;border-radius:11px;background:#101827ed;color:#e3c78f;font-size:20px;pointer-events:auto}
#settingsBtn{top:155px}#bagBtn{top:202px}
#settingsPanel{display:none;position:absolute;top:202px;left:9px;width:210px;background:#101827f5;border:1px solid #9b895d;border-radius:14px;padding:12px;pointer-events:auto;z-index:4}
#settingsPanel button,.smallBtn{background:#70552f;color:white;border:1px solid #d0ae70;border-radius:8px;padding:9px}
#volume{width:100%;accent-color:#d0ae70}
#dialog{display:none}
#gameMenu{display:none;position:fixed;inset:0;background:#070b12d9;z-index:8;align-items:center;justify-content:center;padding:13px;pointer-events:auto}
#menuCard{width:min(440px,100%);max-height:86vh;overflow:auto;background:#111b29;border:1px solid #c0a16b;border-radius:17px;padding:16px;box-shadow:0 12px 40px #000a}
#menuTitle{color:#e3c78f;font-size:18px;font-weight:bold;margin-bottom:12px}
#menuBody{font-size:12px;line-height:2;color:#e1e4e8}
.menuActions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.menuActions button{flex:1;min-width:105px;background:#70552f;color:white;border:1px solid #d0ae70;border-radius:9px;padding:10px;font-size:11px}
.menuActions button.secondary{background:#293443;border-color:#657184}
#closeMenu{width:100%;margin-top:10px;background:#293443;color:white;border:1px solid #657184;border-radius:9px;padding:10px}
.itemRow{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff18;padding:5px 0}
input[type=text]{width:100%;background:#202c3b;color:white;border:1px solid #a88e5d;border-radius:8px;padding:11px;font-family:Tahoma}
#start{position:fixed;inset:0;background:#090e19ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;pointer-events:auto;z-index:10}
.card{background:#131d2c;border:1px solid #a88e5d;border-radius:20px;padding:23px;max-width:420px}
h1{color:#d6bd8a;letter-spacing:3px}
p{font-size:12px;line-height:2;color:#c4cbd4}
#play{background:#9a7947;color:white;border:0;border-radius:12px;padding:13px 30px;font-size:14px;font-weight:bold}
#mapCanvas{width:100%;height:125px;background:#25382d;border:1px solid #9b895d;border-radius:8px}
.choice{display:inline-block;margin:3px;padding:8px 10px;background:#293443;border:1px solid #8e7958;border-radius:8px;color:white}
@media(max-height:520px){#stick{width:85px;height:85px}#nub{left:21px;top:21px}#controls{bottom:5px}#shoot{width:58px;height:58px}}
</style>

<body>
<canvas id="game"></canvas>

<div id="ui">
 <div id="top">
  <div class="panel"><div id="title">DARK REALM</div><small>THE LIVING KINGDOM</small></div>
  <div class="panel" id="stats">❤️ 100<br>🪙 25<br>🌅 08:00</div>
 </div>
 <button id="settingsBtn">⚙</button>
 <button id="bagBtn">🎒</button>

 <div id="settingsPanel">
  <b style="color:#e3c78f">⚙ تنظیمات بازی</b>
  <div style="font-size:11px;margin-top:9px">🔊 صدای محیط</div>
  <input id="volume" type="range" min="0" max="100" value="35">
  <button id="soundBtn" style="width:100%;margin-top:8px">🔊 قطع صدا</button>
  <button id="customBtn" style="width:100%;margin-top:8px">🎨 شخصی‌سازی شخصیت</button>
  <button id="giftBtn" style="width:100%;margin-top:8px">🎁 کد هدیه</button>
  <button id="mapBtn" style="width:100%;margin-top:8px">🧭 نقشه دشمن‌ها</button>
  <button id="closeSettings" style="width:100%;margin-top:8px">بستن</button>
 </div>

 <div id="hint">در شهر آزادانه بگرد؛ با مردم و ساختمان‌ها تعامل کن</div>
 <div id="controls">
  <div id="stick"><div id="nub"></div></div>
  <div id="buttons">
   <button class="action" id="run">دویدن</button>
   <button class="action" id="talk">تعامل</button>
   <button class="action" id="shoot">✨<br>شلیک</button>
  </div>
 </div>
</div>

<div id="gameMenu">
 <div id="menuCard">
  <div id="menuTitle"></div>
  <div id="menuBody"></div>
  <div class="menuActions" id="menuActions"></div>
  <button id="closeMenu">بستن</button>
 </div>
</div>

<div id="start">
 <div class="card">
  <h1>DARK REALM</h1>
  <div style="color:#b9a47c">THE LIVING KINGDOM</div>
  <p>به شهر قدیمی خوش آمدی.<br>خانه بخر، تجارت کن، با مردم دوست شو، ظاهر شخصیتت را تغییر بده و در جنگل ماجراجویی کن.</p>
  <button id="play">شروع ماجراجویی</button>
  <p>نسخه آزمایشی آفلاین</p>
 </div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
let W=innerWidth,H=innerHeight,camX=0,camY=0,started=false;
const DPR=Math.min(devicePixelRatio||1,1.15);
function resize(){
 W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

const world={w:2800,h:2300};
const player={x:1150,y:890,speed:2.5,direction:'down',moving:false,frame:0};
let keys={},joy={x:0,y:0},running=false,near=null,nearBuilding=null;
let gameTime=0;
const dayLength=240;

const game={
 coins:25,health:100,maxHealth:100,
 inventory:{نان:0,معجون:0,چوب:0,سنگ:0,گل:0,شمشیر:0},
 ownedHouse:null,planted:0,workCount:0,lastWork:-9999,
 ammo:12,maxAmmo:12,xp:0,level:1,kills:0,
 outfit:0,hair:0,cloak:0,hat:0,boot:0,weapon:true,
 giftUsed:false
};

const outfits=[
 {name:'لباس آبی مسافر',color:'#334b68',trim:'#415e7f'},
 {name:'لباس سبز جنگل',color:'#36583e',trim:'#54784b'},
 {name:'لباس اشرافی',color:'#67405f',trim:'#a77a9b'},
 {name:'لباس تیره',color:'#30323c',trim:'#555968'},
 {name:'لباس طلایی',color:'#79603a',trim:'#c49a52'}
];
const hairs=['قهوه‌ای','مشکی','طلایی','نقره‌ای'];
const hairColors=['#30241f','#171717','#d4aa54','#aeb5bd'];
const cloakColors=['بدون شنل','#6a2630','#263c58','#31533c','#4d3b65'];
const hatNames=['بدون کلاه','کلاه مسافر','کلاه نگهبان'];
const bootNames=['چکمه قهوه‌ای','چکمه تیره','چکمه روشن'];

const buildings=[
 {id:'home1',x:650,y:350,w:220,h:170,name:'خانه کوچک',type:'home',price:80},
 {id:'bakery',x:1400,y:350,w:240,h:190,name:'نانوایی',type:'bakery'},
 {id:'inn',x:2200,y:350,w:250,h:190,name:'مسافرخانه',type:'inn'},
 {id:'home2',x:650,y:1050,w:230,h:180,name:'خانه باغی',type:'home',price:140},
 {id:'blacksmith',x:1400,y:1050,w:250,h:200,name:'آهنگری',type:'blacksmith'},
 {id:'home3',x:2200,y:1050,w:220,h:180,name:'خانه قدیمی',type:'home',price:110},
 {id:'home4',x:650,y:1740,w:230,h:180,name:'خانه جنگلی',type:'home',price:170},
 {id:'market',x:1400,y:1740,w:250,h:190,name:'بازارچه',type:'market'},
 {id:'home5',x:2200,y:1740,w:250,h:190,name:'کلبه',type:'home',price:100}
];
const roads=[
 {x:0,y:820,w:2800,h:140},{x:0,y:1480,w:2800,h:140},
 {x:480,y:0,w:120,h:2300},{x:1080,y:0,w:140,h:2300},
 {x:1880,y:0,w:140,h:2300},{x:2580,y:0,w:120,h:2300}
];
const buildingZones=buildings.map(b=>({x:b.x-35,y:b.y-35,w:b.w+70,h:b.h+70}));
const fountainZone={x:1080,y:820,w:140,h:140};

const npcs=[
 {x:1100,y:690,name:'مامان ادریس',msg:'به شهر ما خوش آمدی! اینجا هرکسی می‌تواند زندگی خودش را بسازد.',color:'#9b5968',job:'کشاورزی'},
 {x:820,y:980,name:'ویچر',msg:'من از بازارچه خبر دارم. اگر دنبال خریدوفروشی، سری به آنجا بزن.',color:'#536c49',job:'جمع‌آوری کالا'},
 {x:1430,y:1000,name:'زئوس',msg:'در آهنگری همیشه کار پیدا می‌شود.',color:'#80649b',job:'آهنگری'},
 {x:1100,y:1200,name:'تانجیرو',msg:'من نگهبان شهرم. مراقب مردم و کوچه‌ها هستم.',color:'#365c75',job:'نگهبانی'},
 {x:900,y:700,name:'یاشار',msg:'زندگی در این شهر آرام است.',color:'#333b49',job:'پیک شهری'},
 {x:1600,y:850,name:'اراد',msg:'سلام مسافر. این شهر پر از رازهای پنهان است.',color:'#242735',job:'راهنمای شهر'},
 {x:2050,y:1740,name:'ممد اسموک',msg:'شاید یک روز در بازار کار پیدا کنم.',color:'#292b32',job:'کمک در بازار'}
];
npcs.forEach((n,i)=>{
 n.route=[{x:n.x,y:n.y},{x:n.x+45,y:n.y+35},{x:n.x+80,y:n.y},{x:n.x+30,y:n.y-45},{x:n.x-35,y:n.y-20}];
 n.friend=0;n.target=0;n.pause=20+i*7;n.walk=0;n.moving=false;
});

const enemies=[];
const projectiles=[];
const particles=[];
let lastShot=0;

function saveGame(){
 try{
  localStorage.setItem('darkRealmSave',JSON.stringify({
   game,gameTime,player:{x:player.x,y:player.y},
   friends:npcs.map(n=>n.friend)
  }));
 }catch(e){}
}
function loadGame(){
 try{
  const s=JSON.parse(localStorage.getItem('darkRealmSave')||'null');
  if(!s)return;
  if(s.game)Object.assign(game,s.game);
  if(s.player){player.x=Number(s.player.x)||1150;player.y=Number(s.player.y)||890;}
  if(Array.isArray(s.friends))npcs.forEach((n,i)=>n.friend=s.friends[i]||0);
  gameTime=Number(s.gameTime)||0;
 }catch(e){}
}
loadGame();

function overlaps(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function safeTree(x,y,s){
 const box={x:x-s,y:y-s,w:s*2,h:s*2};
 if(buildingZones.some(b=>overlaps(box,b)))return false;
 if(roads.some(r=>overlaps(box,r)))return false;
 if(overlaps(box,fountainZone))return false;
 if(npcs.some(n=>Math.hypot(x-n.x,y-n.y)<100))return false;
 return true;
}
const trees=[];
for(let i=0;i<65;i++){
 for(let a=0;a<80;a++){
  let x=40+Math.random()*(world.w-80),y=40+Math.random()*(world.h-80);
  let size=18+Math.random()*14;
  if(safeTree(x,y,size)){trees.push({x,y,size});break;}
 }
}
const obstacles=[];
buildings.forEach(b=>obstacles.push({x:b.x+8,y:b.y+20,w:b.w-16,h:b.h-20}));
trees.forEach(t=>obstacles.push({x:t.x-t.size*.55,y:t.y-t.size*.5,w:t.size*1.1,h:t.size*1.1}));

function spawnSlime(){
 const spots=[
  [150,250,900,650],[1800,200,850,500],
  [100,1650,1000,550],[1800,1650,850,500]
 ];
 const s=spots[Math.floor(Math.random()*spots.length)];
 let x=s[0]+Math.random()*s[2],y=s[1]+Math.random()*s[3];
 for(let i=0;i<25;i++){
  if(!collide(x,y)&&Math.hypot(x-player.x,y-player.y)>230)break;
  x=s[0]+Math.random()*s[2];y=s[1]+Math.random()*s[3];
 }
 enemies.push({x,y,hp:35,maxHp:35,alive:true,phase:Math.random()*6,hit:0});
}
for(let i=0;i<5;i++)spawnSlime();

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==='e'||e.key==='E')interact();
 if(e.key==='Escape')closeMenu();
 if(e.key===' ')shoot();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const stick=document.getElementById('stick'),nub=document.getElementById('nub');
let dragging=false;
function moveJoy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 let d=Math.hypot(dx,dy),max=32;
 if(d>max){dx=dx/d*max;dy=dy/d*max;}
 joy.x=dx/max;joy.y=dy/max;
 nub.style.left=(29+dx)+'px';nub.style.top=(29+dy)+'px';
}
stick.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;stick.setPointerCapture(e.pointerId);moveJoy(e);});
stick.addEventListener('pointermove',e=>{if(dragging)moveJoy(e);});
function stopJoy(){dragging=false;joy.x=joy.y=0;nub.style.left='29px';nub.style.top='29px';}
stick.addEventListener('pointerup',stopJoy);stick.addEventListener('pointercancel',stopJoy);

const runBtn=document.getElementById('run');
runBtn.addEventListener('pointerdown',e=>{e.preventDefault();running=true;});
['pointerup','pointercancel','pointerleave'].forEach(ev=>runBtn.addEventListener(ev,()=>running=false));

const settingsBtn=document.getElementById('settingsBtn');
const settingsPanel=document.getElementById('settingsPanel');
settingsBtn.onclick=()=>settingsPanel.style.display=settingsPanel.style.display==='block'?'none':'block';
document.getElementById('closeSettings').onclick=()=>settingsPanel.style.display='none';

let audioCtx=null,masterGain=null,soundEnabled=true,audioStarted=false;
function initAudio(){
 if(audioStarted)return;
 try{
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();masterGain.gain.value=.35;masterGain.connect(audioCtx.destination);
  audioStarted=true;
 }catch(e){}
}
function tone(freq,duration,type='sine',vol=.04){
 if(!audioCtx||!soundEnabled)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
 o.type=type;o.frequency.setValueAtTime(freq,now);
 g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);
 o.connect(g);g.connect(masterGain);o.start(now);o.stop(now+duration);
}
document.getElementById('soundBtn').onclick=()=>{
 soundEnabled=!soundEnabled;
 document.getElementById('soundBtn').textContent=soundEnabled?'🔊 قطع صدا':'🔇 فعال کردن صدا';
};
document.getElementById('volume').oninput=e=>{
 if(masterGain)masterGain.gain.value=Number(e.target.value)/100;
};

document.getElementById('play').onclick=()=>{
 started=true;document.getElementById('start').style.display='none';
 initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
};

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x-camX,y-camY,w,h);}
function circle(x,y,r,c){
 ctx.fillStyle=c;ctx.beginPath();ctx.arc(x-camX,y-camY,r,0,Math.PI*2);ctx.fill();
}
function visible(x,y,w,h,m=100){return x+w>camX-m&&x<camX+W+m&&y+h>camY-m&&y<camY+H+m;}

function drawGround(){
 rect(camX,camY,W,H,'#29382f');
 const sx=Math.max(0,Math.floor((camX-80)/80)*80),ex=Math.min(world.w,camX+W+80);
 const sy=Math.max(0,Math.floor((camY-80)/80)*80),ey=Math.min(world.h,camY+H+80);
 for(let y=sy;y<ey;y+=80)for(let x=sx;x<ex;x+=80)if((x+y)%160===0)rect(x,y,80,80,'#2d3d32');
 roads.forEach(r=>{
  if(!visible(r.x,r.y,r.w,r.h))return;
  rect(r.x-9,r.y-9,r.w+18,r.h+18,'#403a32');rect(r.x,r.y,r.w,r.h,'#655747');
  if(r.w>=r.h){
   for(let y=Math.max(r.y+8,camY-40);y<Math.min(r.y+r.h,camY+H+40);y+=34)
    for(let x=Math.max(r.x+8,camX-40);x<Math.min(r.x+r.w,camX+W+40);x+=42){
     rect(x,y,28,22,'#796a57');rect(x+29,y,3,22,'#51483c');
    }
  }else{
   for(let x=Math.max(r.x+8,camX-40);x<Math.min(r.x+r.w,camX+W+40);x+=34)
    for(let y=Math.max(r.y+8,camY-40);y<Math.min(r.y+r.h,camY+H+40);y+=42){
     rect(x,y,22,28,'#796a57');rect(x,y+29,22,3,'#51483c');
    }
  }
 });
 circle(1150,890,100,'#746653');circle(1150,890,86,'#665747');
 circle(1150,890,70,'#796a57');circle(1150,890,36,'#3c5658');
 circle(1150,890,12,'#9a8a66');
}
function drawTree(t){
 let{x,y,size:s}=t;if(!visible(x-s,y-s*2,s*2,s*3))return;
 circle(x+6,y+13,s,'#17241c');rect(x-5,y-3,10,25,'#5a402d');
 circle(x,y-15,s,'#1b3022');circle(x-10,y-24,s*.65,'#29452e');
 circle(x+10,y-24,s*.65,'#314d35');circle(x,y-35,s*.55,'#3a5a3d');
}
function drawBuilding(b){
 if(!visible(b.x,b.y-45,b.w,b.h+50))return;
 rect(b.x+10,b.y+12,b.w,b.h,'#171b1c');rect(b.x,b.y,b.w,b.h,'#665548');
 for(let i=0;i<5;i++)rect(b.x+8,b.y+30+i*27,b.w-16,2,'#81705d');
 rect(b.x-12,b.y-20,b.w+24,38,'#392a28');
 rect(b.x+25,b.y+55,35,45,'#b08c54');rect(b.x+b.w-60,b.y+55,35,45,'#b08c54');
 rect(b.x+b.w/2-20,b.y+b.h-65,40,65,'#35241c');
 rect(b.x+b.w/2-15,b.y+b.h-60,30,60,'#4a3023');
 ctx.fillStyle='#d3c1a0';ctx.font='11px Tahoma';ctx.textAlign='center';
 ctx.fillText(b.name,b.x+b.w/2-camX,b.y-30-camY);
 if(b.type==='home'&&game.ownedHouse===b.id){
  ctx.fillStyle='#f1d58a';ctx.fillText('خانه من',b.x+b.w/2-camX,b.y-45-camY);
  for(let i=0;i<game.planted;i++){
   let px=b.x+35+(i%5)*28,py=b.y+b.h+17+Math.floor(i/5)*17;
   circle(px,py,4,'#d2a9c3');rect(px-1,py+3,2,8,'#567a43');
  }
 }
}
function drawNPC(n){
 if(!visible(n.x-30,n.y-50,60,80))return;
 let step=n.moving?Math.sin(n.walk)*3:0;
 circle(n.x,n.y+10,11,'#111');rect(n.x-7+step,n.y+14,5,10,'#292d35');

function collide(x,y){
 let r=12;
 return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}
function moveNPC(n,dt){
 let p=n.route[n.target],dx=p.x-n.x,dy=p.y-n.y,d=Math.hypot(dx,dy);
 if(d<8){n.target=(n.target+1)%n.route.length;n.pause=35+Math.random()*60;n.moving=false;return;}
 if(n.pause>0){n.pause-=dt;n.moving=false;return;}
 let speed=.42*dt;if(speed>d)speed=d;
 let nx=n.x+dx/d*speed,ny=n.y+dy/d*speed;
 if(!collide(nx,n.y)&&!collide(nx,ny)){n.x=nx;n.y=ny;n.moving=true;n.walk+=dt*.08;}
 else{n.target=(n.target+1)%n.route.length;n.pause=20;n.moving=false;}
}

function shoot(){
 if(!started||gameMenu.style.display==='flex')return;
 if(!game.weapon){notify('سلاح نداری','برای استفاده از شلیک، تپانچه جادویی لازم است.');return;}
 if(game.ammo<=0){notify('مهمات تمام شد','خشاب را از کیف تجهیزات پر کن.');return;}
 let now=performance.now();if(now-lastShot<350)return;lastShot=now;
 game.ammo--;
 let dx=0,dy=0;
 if(player.direction==='left')dx=-1;
 if(player.direction==='right')dx=1;
 if(player.direction==='up')dy=-1;
 if(player.direction==='down')dy=1;
 projectiles.push({x:player.x+dx*16,y:player.y+dy*16,vx:dx*8,vy:dy*8,life:45});
 tone(520,.09,'triangle',.07);tone(260,.12,'sine',.035);
 for(let i=0;i<3;i++)particles.push({x:player.x+dx*18,y:player.y+dy*18,size:3,color:'#a7e6ff',life:12});
 saveGame();
}

function updateCombat(dt){
 for(let i=projectiles.length-1;i>=0;i--){
  let p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  let hit=false;
  for(const e of enemies){
   if(!e.alive)continue;
   if(Math.hypot(p.x-e.x,p.y-e.y)<19){
    e.hp-=18;e.hit=5;hit=true;
    for(let k=0;k<5;k++)particles.push({x:e.x,y:e.y,size:2+Math.random()*3,color:'#91dca0',life:20});
    tone(180,.08,'sine',.04);
    if(e.hp<=0){
     e.alive=false;game.kills++;game.coins+=8;game.xp+=15;
     game.inventory['گل']=(game.inventory['گل']||0)+1;
     if(game.xp>=game.level*50){game.xp-=game.level*50;game.level++;game.maxHealth+=5;game.health=Math.min(game.maxHealth,game.health+15);}
     notify('🌟 اسلایم شکست خورد','۸ سکه و یک گل گرفتی! تجربه هم به دست آوردی.');
     saveGame();
    }
    break;
   }
  }
  if(hit||p.life<=0||p.x<0||p.y<0||p.x>world.w||p.y>world.h)projectiles.splice(i,1);
 }
 enemies.forEach(e=>{
  if(!e.alive)return;
  e.phase+=.08*dt;if(e.hit>0)e.hit-=dt;
  let d=Math.hypot(player.x-e.x,player.y-e.y);
  if(d<240&&d>24){
   let dx=(player.x-e.x)/d,dy=(player.y-e.y)/d;
   let nx=e.x+dx*.35*dt,ny=e.y+dy*.35*dt;
   if(!collide(nx,ny)){e.x=nx;e.y=ny;}
  }
  if(d<25&&Math.random()<.012*dt){
   game.health=Math.max(0,game.health-3);
   tone(100,.1,'sine',.025);
   if(game.health<=0){
    game.health=50;player.x=1150;player.y=890;
    notify('استراحت اضطراری','به میدان شهر برگشتی و سلامتی‌ات به ۵۰ رسید.');
   }
  }
 });
 if(enemies.filter(e=>e.alive).length<5&&Math.random()<.002*dt)spawnSlime();
 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];p.life-=dt;p.size*=.97;
  if(p.life<=0)particles.splice(i,1);
 }
}

function handleAction(a){
 if(!a)return;
 if(a==='close'){closeMenu();return;}
 if(a==='save'){saveGame();notify('ذخیره شد','پیشرفت بازی ذخیره شد.');return;}
 if(a==='redeem'){
  const input=document.getElementById('giftInput');
  const code=input?input.value.trim().toUpperCase():'';
  if(code!=='MAX'){notify('کد نامعتبر','این کد هدیه معتبر نیست.');return;}
  if(game.giftUsed){notify('کد تکراری','قبلاً از این کد استفاده کرده‌ای.');return;}
  game.coins+=1000;game.giftUsed=true;saveGame();
  notify('🎉 جایزه دریافت شد','۱۰۰۰ سکه به کیف پولت اضافه شد!');return;
 }
 if(a==='reload'){
  if(game.coins<3){notify('سکه کافی نیست','برای پر کردن خشاب ۳ سکه لازم داری.');return;}
  game.coins-=3;game.ammo=game.maxAmmo;saveGame();notify('خشاب پر شد','مهماتت کامل شد.');return;
 }
 if(a==='potion'){
  if(game.inventory['معجون']<1){notify('معجون نداری','از بازارچه معجون بخر.');return;}
  if(game.health>=game.maxHealth){notify('سلامتی کامل است','فعلاً نیازی به معجون نداری.');return;}
  game.inventory['معجون']--;game.health=Math.min(game.maxHealth,game.health+35);
  saveGame();notify('معجون مصرف شد','سلامتی‌ات بازیابی شد.');return;
 }
 if(a.startsWith('chat:')||a.startsWith('gift:')||a.startsWith('npcjob:')){
  let parts=a.split(':'),n=findNPC(parts[1]);if(!n)return;
  if(parts[0]==='chat'){n.friend=Math.min(10,n.friend+1);saveGame();notify('گفت‌وگوی دوستانه','رابطه‌ات با '+n.name+' بهتر شد.');}
  else if(parts[0]==='gift'){
   if(game.coins<5){notify('سکه کافی نیست','۵ سکه لازم داری.');return;}
   game.coins-=5;n.friend=Math.min(10,n.friend+2);saveGame();notify('هدیه داده شد',n.name+' خوشحال شد.');
  }else notify('پیشنهاد کار',n.job+'؛ برای کار به مغازه‌های شهر سر بزن.');
  return;
 }
 if(a.startsWith('buy:')){
  let p=a.split(':'),name=p[1],price=Number(p[2]);
  if(game.coins<price){notify('سکه کافی نیست','برای این خرید سکه بیشتری لازم داری.');return;}
  game.coins-=price;game.inventory[name]=(game.inventory[name]||0)+1;
  if(name==='شمشیر')game.weapon=true;
  saveGame();notify('خرید موفق','یک '+name+' به کیف تو اضافه شد.');return;
 }
 if(a.startsWith('sell:')){
  let p=a.split(':'),name=p[1],price=Number(p[2]);
  if((game.inventory[name]||0)<1){notify('کالایی نداری','برای فروش یک '+name+' لازم داری.');return;}
  game.inventory[name]--;game.coins+=price;saveGame();notify('فروش موفق',''+price+' سکه گرفتی.');return;
 }
 if(a.startsWith('house:')){
  let id=a.split(':')[1],b=buildings.find(x=>x.id===id);
  if(!b||game.coins<b.price){notify('سکه کافی نیست','برای خرید خانه سکه کافی نداری.');return;}
  if(game.ownedHouse){notify('خانه داری','در حال حاضر یک خانه داری.');return;}
  game.coins-=b.price;game.ownedHouse=id;saveGame();notify('تبریک!','این خانه حالا متعلق به توست.');return;
 }
 if(a.startsWith('work:')){
  if(gameTime-game.lastWork<18){notify('کمی استراحت کن','برای کار بعدی کمی صبر کن.');return;}
  let place=a.split(':')[1],reward=place==='blacksmith'?12:place==='market'?10:place==='inn'?9:8;
  game.coins+=reward;game.workCount++;game.lastWork=gameTime;
  if(place==='bakery')game.inventory['نان']++;
  if(place==='blacksmith')game.inventory['سنگ']++;
  if(place==='market')game.inventory['چوب']++;
  saveGame();notify('💰 دستمزد گرفتی',reward+' سکه دریافت کردی.');return;
 }
 if(a==='sleep'||a==='homesleep'){
  if(a==='sleep'&&game.coins<4){notify('سکه کافی نیست','۴ سکه لازم داری.');return;}
  if(a==='sleep')game.coins-=4;
  gameTime+=dayLength*.22;game.health=game.maxHealth;saveGame();
  notify('استراحت کردی','سلامتی‌ات کامل شد.');return;
 }
 if(a==='plant'){
  if(game.coins<2){notify('سکه کافی نیست','۲ سکه لازم داری.');return;}
  if(game.planted>=10){notify('باغچه پر شده','ظرفیت باغچه تکمیل شده.');return;}
  game.coins-=2;game.planted++;game.inventory['گل']++;saveGame();notify('گل کاشته شد','باغچه زیباتر شد.');return;
 }
 if(a==='homeitems'){showInventory();return;}
}

 gameTime+=dt/60;
 let dx=joy.x,dy=joy.y;
 if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;
 if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
 let length=Math.hypot(dx,dy);if(length>1){dx/=length;dy/=length;}
 player.moving=length>.1;
 if(player.moving){
  player.frame+=running?.25:.15;
  if(Math.abs(dx)>Math.abs(dy))player.direction=dx>0?'right':'left';
  else player.direction=dy>0?'down':'up';
  let speed=running?4.5:2.5,nx=player.x+dx*speed*dt,ny=player.y+dy*speed*dt;
  if(!collide(nx,player.y))player.x=nx;
  if(!collide(player.x,ny))player.y=ny;
 }
 player.x=Math.max(20,Math.min(world.w-20,player.x));
 player.y=Math.max(20,Math.min(world.h-20,player.y));
 camX+=(player.x-W/2-camX)*.12;camY+=(player.y-H/2-camY)*.12;
 camX=Math.max(0,Math.min(world.w-W,camX));camY=Math.max(0,Math.min(world.h-H,camY));
 npcs.forEach(n=>moveNPC(n,dt));
 updateCombat(dt);
 near=null;nearBuilding=null;
 let best=85;
 for(const n of npcs){let d=Math.hypot(player.x-n.x,player.y-n.y);if(d<best){best=d;near=n;}}
 let bestB=125;
 for(const b of buildings){
  let bx=Math.max(b.x,Math.min(player.x,b.x+b.w)),by=Math.max(b.y,Math.min(player.y,b.y+b.h));
  let d=Math.hypot(player.x-bx,player.y-by);
  if(d<bestB){bestB=d;nearBuilding=b;}
 }
 if(near&&nearBuilding){
  let dn=Math.hypot(player.x-near.x,player.y-near.y);
  let bx=Math.max(nearBuilding.x,Math.min(player.x,nearBuilding.x+nearBuilding.w));
  let by=Math.max(nearBuilding.y,Math.min(player.y,nearBuilding.y+nearBuilding.h));
  if(Math.hypot(player.x-bx,player.y-by)<dn)near=null;else nearBuilding=null;
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawGround();trees.forEach(drawTree);buildings.forEach(drawBuilding);
 npcs.forEach(drawNPC);enemies.forEach(drawSlime);
 projectiles.forEach(p=>{circle(p.x,p.y,5,'#b9edff');circle(p.x,p.y,2,'#ffffff');});
 drawEffects();drawPlayer();drawLighting();
 const c=getGameClock();
 document.getElementById('stats').innerHTML=
 '❤️ '+game.health+'/'+game.maxHealth+'<br>🪙 '+game.coins+
 '<br>✨ سطح '+game.level+' | XP '+game.xp+
 '<br>🔫 '+game.ammo+'/'+game.maxAmmo+'<br>'+getPhase()+' '+c.text;
 const hint=document.getElementById('hint');
 if(near)hint.textContent='برای صحبت با '+near.name+' دکمه تعامل را بزن';
 else if(nearBuilding)hint.textContent='برای تعامل با '+nearBuilding.name+' دکمه تعامل را بزن';
 else hint.textContent='برای مبارزه با اسلایم‌ها به جنگل برو؛ دکمه شلیک را بزن';
 drawMinimap();
}

let last=performance.now(),saveTimer=0;
function loop(now){
 let dt=Math.min(2,(now-last)/16.67);last=now;
 update(dt);draw();saveTimer+=dt;
 if(saveTimer>600){saveGame();saveTimer=0;}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
